.hc.sel{border-color:#ffd45e}.hc.lock{opacity:.5}

.dlg{font-size:18px;min-height:70px}
.sp{font-weight:bold;color:#ffd45e;font-size:20px}
.hint{font-size:12px;color:#5a2d7a}
#bar button{padding:6px 9px;font-size:12px}
#fs{position:absolute;right:56px;bottom:8px;z-index:5;padding:5px 9px;font-size:16px}

function ac(){
 if(!AUD.ctx){try{AUD.ctx=new(window.AudioContext||window.webkitAudioContext)();AUD.master=AUD.ctx.createGain();AUD.master.gain.value=AUD.muted?0:1;AUD.master.connect(AUD.ctx.destination)}catch(e){return null}}
 if(AUD.ctx.state==='suspended')AUD.ctx.resume();

}
function tone(f,d,type,v,delay,to){
 const c=ac();if(!c)return;
 try{const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type==='sine'?'sine':'triangle';o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.05,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AUD.master);o.start(t);o.stop(t+d+.03)}catch(e){}
}
function noise(d,v,fq,delay){
 const c=ac();if(!c)return;
 try{const t=c.currentTime+(delay||0),n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=b;f.type='lowpass';f.frequency.value=fq||800;g.gain.value=v||.1;
  s.connect(f);f.connect(g);g.connect(AUD.master);s.start(t)}catch(e){}
}

/* ---------- Drawing helpers ---------- */
function ell(x,y,rx,ry,f){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,7);ctx.fillStyle=f;ctx.fill()}

function txt(t,x,y,size,col,align,stroke){ctx.font='bold '+size+'px "Trebuchet MS",system-ui,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke){ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.strokeText(t,x,y)}ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y)}
function star5(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}ctx.closePath();ctx.fill()}
function hat(kind,s,hy,col){
 switch(kind){

  case'wizard':ctx.fillStyle='#8a5cf0';ctx.beginPath();ctx.moveTo(-s*.7,hy+s*.05);ctx.lineTo(0,hy-s*1.1);ctx.lineTo(s*.7,hy+s*.05);ctx.closePath();ctx.fill();ell(0,hy+s*.03,s*.85,s*.12,'#6a3fd0');star5(0,hy-s*.4,s*.16,'#ffe36e');break;
  case'bow':for(const sx of[-1,1]){ctx.fillStyle='#ff5aa0';ctx.beginPath();ctx.moveTo(s*.6,hy+s*.15);ctx.lineTo(s*.6+sx*s*.45+s*.05,hy-s*.15);ctx.lineTo(s*.6+sx*s*.45+s*.05,hy+s*.45);ctx.closePath();ctx.fill()}ell(s*.6,hy+s*.15,s*.1,s*.1,'#ffd0e4');break;
  case'flower':for(let i=0;i<5;i++){const a=i*1.2566;ell(-s*.6+Math.cos(a)*s*.17,hy+s*.12+Math.sin(a)*s*.17,s*.13,s*.13,'#ff9ec7')}ell(-s*.6,hy+s*.12,s*.09,s*.09,'#ffe36e');break;
  case'pirate':ctx.fillStyle='#333';ctx.beginPath();ctx.moveTo(-s*.85,hy+s*.1);ctx.quadraticCurveTo(0,hy-s*.9,s*.85,hy+s*.1);ctx.closePath();ctx.fill();ell(0,hy-s*.15,s*.1,s*.1,'#eee');break;
  case'helmet':ctx.fillStyle='#c4c9dc';ctx.beginPath();ctx.arc(0,hy+s*.14,s*.85,Math.PI,0);ctx.closePath();ctx.fill();ctx.fillStyle='#ff5a8a';ctx.fillRect(-s*.07,hy-s*.72,s*.14,s*.45);break;

 ell(-s*.3,s*1.18,s*.2,s*.14,col);ell(s*.3,s*1.18,s*.2,s*.14,col);
 for(const sx of[-1,1]){

  ctx.fillStyle=dark?'#c9a0ff':'#ffb3cf';ctx.beginPath();ctx.moveTo(sx*s*.45,-s*.68);ctx.quadraticCurveTo(sx*s*.85,-s*1.2,sx*s*.88,-s*.45);ctx.closePath();ctx.fill();
 }

function castleMax(){return 100+25*((S.kup&&S.kup.walls)||0)+15*vl('v_tower')}
function dojo(){return 1+.1*((S.kup&&S.kup.dojo)||0)}
function bmax(t,u){return Math.round(BDEF[t].hp*(1+.5*u)*(t==='warrior'?1+.2*vl('v_guard'):1))}
function upCost(b){const d=BDEF[b.type],up=b.up||0;return {fish:cost(Math.round(Math.max(30,d.fish)*(.9+up*.7))),cat:up>=1?up:0}}
function upgradeB(b){
 const up=b.up||0,x=colX(b.c),y=rowY(b.r);
 if(up>=3){S.fx.push({k:'float',x,y:y-30,s:'MAX LEVEL!',t:1,col:'#ffe36e'});return}
 const c=upCost(b);
 if(S.fish<c.fish||S.cat<c.cat){S.fx.push({k:'float',x,y:y-30,s:'Not enough!',t:1,col:'#ff7a7a'});sfx.hit();return}
 S.fish-=c.fish;S.cat-=c.cat;b.up=up+1;b.max=bmax(b.type,b.up);b.hp=b.max;
 sfx.upgrade();S.fx.push({k:'ring',x,y,r:8,mr:44,t:.5,col:'#ffe36e'});
 S.fx.push({k:'float',x,y:y-34,s:'⬆ '+'★'.repeat(b.up),t:1.2,col:'#ffe36e'});
 for(let i=0;i<8;i++)S.fx.push({k:'p',x,y,vx:rnd(-90,90),vy:rnd(-110,-20),t:.7,col:'#ffe36e',r:3});
}
function extraB(dt){
 const night=S.phase==='night';
 for(const b of S.b.slice()){
  if(b.dis>0)continue;
  const up=b.up||0,bx=colX(b.c),by=rowY(b.r);
  if(b.type==='luck'){b.cd-=dt;if(b.cd<=0){b.cd=8;S.dr.push({x:bx,y:by-10,ty:by-10,type:'fish',v:8+5*up,life:14})}continue}
  if(!night)continue;
  if(b.type==='frost'){
   b.cd-=dt*(S.boost>0?1.5:1);
   if(b.cd<=0&&S.en.some(e=>e.row===b.r&&e.x>bx&&e.x<970)){b.cd=1.6/(1+.2*up);S.pr.push({x:bx+22,y:by,vx:380,vy:0,dmg:5+3*up,r:9,row:b.r,hit:new Set(),life:3,col:'#cdeeff',fish:1,frost:1,src:b});sfx.pew()}
  }else if(b.type==='heart'){
   b.cd-=dt;
   if(b.cd<=0){b.cd=3;let healed=false;
    for(const o of S.b){if(o!==b&&Math.abs(o.c-b.c)<=1&&Math.abs(o.r-b.r)<=1&&o.hp<o.max){o.hp=Math.min(o.max,o.hp+12+6*up);healed=true;S.fx.push({k:'float',x:colX(o.c),y:rowY(o.r)-26,s:'💖',t:.8,col:'#ff9ec7'})}}
    const h=S.h;if(h&&h.down<=0&&dist(h.x,h.y,bx,by)<110&&h.hp<h.max){h.hp=Math.min(h.max,h.hp+6+3*up);healed=true}
    if(healed)sfx.heal();
   }
  }else if(b.type==='bomb'){
   const t=S.en.find(e=>Math.abs(e.y-by)<RH*.9&&Math.abs(e.x-bx)<CW*1.4);
   if(t){S.b.splice(S.b.indexOf(b),1);boom(bx,by,95+15*up,120*(1+.4*up),'#ffb3d9');S.fx.push({k:'float',x:bx,y:by-30,s:'MOCHI BOOM!',t:1,col:'#ffe3f2'})}
  }else if(b.type==='laser'){
   b.cd-=dt;
   if(b.cd<=0&&S.en.some(e=>e.row===b.r&&e.x>bx)){b.cd=2/(1+.2*up);S.fx.push({k:'beam',x1:bx+20,y1:by-10,x2:990,y2:by-10,t:.18,col:'#ff4a7a'});sfx.laser();for(const e of S.en.slice())if(e.row===b.r&&e.x>bx)hurt(e,(18+8*up)*dojo(),b)}
  }
 }
}

function cast(){
 const h=S.h;if(S.phase!=='night'||!h||h.down>0||h.spCd>0)return;
 const d=HERO[S.heroType];h.spCd=d.sp*(1-.1*(S.kup.bakery||0));sfx.special();
 switch(S.heroType){
  case'nebula':
   for(let i=0;i<6;i++)S.sched.push({at:.25+i*.3,fn:()=>{const t=S.en.length?S.en[ri(S.en.length)]:null;const x=t?t.x:rnd(300,800),y=t?t.y:rowY(ri(ROWS));boom(x,y,75,70,'#b58cff')}});
   if(S.en.length){let sx=0,sy=0;for(const e of S.en){sx+=e.x;sy+=e.y}S.holes.push({x:sx/S.en.length,y:sy/S.en.length,t:3.5})}
   break;
  case'knight':
   h.shield=4;S.fx.push({k:'ring',x:h.x,y:h.y,r:10,mr:210,t:.6,col:'#ffd45e'});
   for(const e of S.en)if(dist(e.x,e.y,h.x,h.y)<210)e.stun=Math.max(e.stun,e.boss?1:2.2);
   for(const b of S.b)if(dist(colX(b.c),rowY(b.r),h.x,h.y)<230)b.sh=4;
   break;
  case'ranger':
   for(let r=0;r<ROWS;r++)for(let k=0;k<3;k++)S.sched.push({at:k*.35,fn:()=>{S.pr.push({x:h.x,y:rowY(r),vx:520,vy:0,dmg:22,r:8,pierce:1,hit:new Set(),life:3,col:'#7be08a',arrow:1})}});
   break;
  case'healer':
   h.hp=Math.min(h.max,h.hp+h.max*.5);for(const b of S.b)b.hp=Math.min(b.max,b.hp+b.max*.4);S.boost=6;
   for(let i=0;i<14;i++)S.fx.push({k:'emoji',e:'🧁',x:rnd(140,830),y:rnd(60,100),vy:rnd(120,200),t:2});
   S.fx.push({k:'float',x:h.x,y:h.y-40,s:'Cupcake rain! 💖',t:1.5,col:'#ffb3dc'});
   break;
  case'rogue':{
   let t=S.en.filter(e=>e.boss)[0];if(!t){t=S.en.slice().sort((a,b)=>b.hp-a.hp)[0]}
   if(!t){h.spCd=0;return}
   S.fx.push({k:'ring',x:h.x,y:h.y,r:5,mr:50,t:.4,col:'#8a7bd8'});
   h.x=Math.min(940,t.x+t.r+18);h.y=t.y;h.tx=h.x;h.ty=h.y;
   hurt(t,t.boss?240:160,null);S.fx.push({k:'float',x:t.x,y:t.y-30,s:'CRIT BACKSTAB!',t:1.2,col:'#ff5a8a'});
   S.fx.push({k:'ring',x:t.x,y:t.y,r:5,mr:60,t:.4,col:'#fff'});break;}
  case'goddess':
   S.freeze=4;for(const l of S.lost){if(!S.b.find(b=>b.c===l.c&&b.r===l.r))S.b.push({type:l.type,c:l.c,r:l.r,up:l.up||0,hp:bmax(l.type,l.up||0)*.6,max:bmax(l.type,l.up||0),cd:0,tm:3,dis:0,sh:0,kills:0,lvl:1})}
   S.lost=[];h.hp=h.max;
   for(const b of S.b)b.hp=Math.min(b.max,b.hp+b.max*.3);
   S.fx.push({k:'ring',x:h.x,y:h.y,r:10,mr:500,t:1,col:'#fff3a0'});

  const p=S.pr[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;let dead=p.life<=0||p.x>1000||p.x<-20||p.y<60||p.y>540;
  if(!dead)for(const e of S.en.slice()){

   if(ok){p.hit.add(e);hurt(e,p.dmg,p.src||null);if(p.frost)e.slowT=2.5;if(!p.pierce){dead=true;break}}

 }
 /* black holes */
 for(let i=S.holes.length-1;i>=0;i--){const o=S.holes[i];o.t-=dt;
  for(const e of S.en){if(Math.abs(e.y-o.y)<170&&Math.abs(e.x-o.x)<300){e.x+=(o.x-e.x)*Math.min(1,dt*1.8)}if(dist(e.x,e.y,o.x,o.y)<60)hurt(e,18*dt,null)}
  if(o.t<=0)S.holes.splice(i,1)}
 /* lava */
 for(let i=S.lava.length-1;i>=0;i--){const l=S.lava[i];l.t-=dt;
  if(h.down<=0&&dist(h.x,h.y,l.x,l.y)<30&&h.shield<=0&&(h.z||0)<14)h.hp-=12*dt;
  for(const b of S.b)if(b.type==='warrior'&&b.r===Math.floor((l.y-GY)/RH)&&Math.abs(colX(b.c)-l.x)<CW/2)b.hp-=6*dt;
  if(l.t<=0)S.lava.splice(i,1)}
 /* enemies */
 for(const e of S.en.slice()){
  if(e.flash>0)e.flash-=dt;e.t+=dt*6;
  if(fr)continue;
  if(e.stun>0){e.stun-=dt;continue}
  let sp=e.spd;

  const col=Math.floor((e.x-GX)/CW);
  const tr=S.b.find(b=>b.type==='trap'&&b.r===e.row&&b.c===col);
  if(tr&&!e.noslow){sp*=Math.max(.15,.4-.1*(tr.up||0));e.hp-=(3+2*(tr.up||0))*dt;if(e.hp<=0){hurt(e,0.01,null)}}
  if(e.hp<=0)continue;
  e.dmgEff=e.dmg;
  /* boss behaviours */
  if(e.type==='michi'){
   if(e.st==='run'){e.x-=sp*dt;if(e.x<GX+10){if(e.steals<3){const v=Math.min(S.fish,30+ri(30));S.fish-=v;e.steals++;e.st='flee';S.fx.push({k:'float',x:e.x+30,y:e.y-30,s:'-'+v+'🐟 STOLEN!',t:1.6,col:'#ff7a7a'});sfx.steal()}else{S.castle-=e.dmg*dt*1.5}}}
   else{e.x+=sp*dt*.9;if(e.x>990){e.st='run';e.row=ri(ROWS);e.y=rowY(e.row)}}
   e.y+=(rowY(e.row)-e.y)*.2;
   if(S.castle<=0){loseNight();return}
   continue;
  }
  if(e.type==='sylva'){e.tm-=dt;if(e.tm<=0){e.tm=.45;S.lava.push({x:e.x,y:e.y+10,t:5})}}
  if(e.type==='ein'){e.tm-=dt;if(e.tm<=0){e.tm=7;for(let k=0;k<2;k++){const r=Math.max(0,Math.min(ROWS-1,e.row+k*2-1));addEnemy('shadow',r,e.x+20,rowY(r))}S.fx.push({k:'float',x:e.x,y:e.y-50,s:'AWOOOO!',t:1.3,col:'#ff9a9a'});sfx.howl()}}
  if(e.type==='zane'){
   e.tm-=dt;
   if(e.st==='run'&&e.x<640)e.st='cast';
   if(e.st==='cast'){
    e.cdt=(e.cdt||0)+dt;
    if(e.tm<=0){e.tm=4;const ts=S.b.filter(b=>(b.type==='cannon'||b.type==='farm')&&b.dis<=0);if(ts.length){const t=ts[ri(ts.length)];t.dis=5;S.fx.push({k:'beam',x1:e.x,y1:e.y,x2:colX(t.c),y2:rowY(t.r),t:.4,col:'#9a6bff'});S.fx.push({k:'float',x:colX(t.c),y:rowY(t.r)-25,s:'DISABLED!',t:1.2,col:'#c9a8ff'});sfx.zap()}}

   }

 }
 for(let i=S.b.length-1;i>=0;i--)if(S.b[i].hp<=0&&S.b[i].type!=='trap'){const b=S.b[i];S.b.splice(i,1);S.lost.push({type:b.type,c:b.c,r:b.r,up:b.up||0})}
 if(h.down<=0&&h.hp<=0){h.down=6;h.hp=0;S.fx.push({k:'float',x:h.x,y:h.y-30,s:'Hero down! Back in 6s',t:2,col:'#ff7a7a'})}

 h.moving=false;
 if(mx||my){const l=Math.hypot(mx,my);h.x+=mx/l*sp*dt;h.y+=my/l*sp*dt;h.tx=h.x;h.ty=h.y;h.moving=true;if(mx)h.face=mx>0?1:-1}
 else{const dx=h.tx-h.x,dy=h.ty-h.y,l=Math.hypot(dx,dy);if(l>4){const st=Math.min(l,sp*dt);h.x+=dx/l*st;h.y+=dy/l*st;h.moving=true;if(Math.abs(dx)>3)h.face=dx>0?1:-1}}
 h.running=run&&h.moving;
 h.x=Math.max(20,Math.min(940,h.x));h.y=Math.max(95,Math.min(S.phase==='day'?520:480,h.y));
 if(h.jumpReq&&h.z===0){h.vz=520;sfx.jump();for(let i=0;i<5;i++)S.fx.push({k:'p',x:h.x,y:h.y+30,vx:rnd(-50,50),vy:rnd(-30,-5),t:.35,col:'rgba(255,255,255,.9)',r:rnd(3,5)})}
 h.jumpReq=false;
 if(h.z>0||h.vz>0){h.vz-=1500*dt;h.z+=h.vz*dt;if(h.z<=0){h.z=0;h.vz=0;sfx.land();for(let i=0;i<7;i++)S.fx.push({k:'p',x:h.x,y:h.y+30,vx:rnd(-80,80),vy:rnd(-40,-5),t:.4,col:'rgba(255,255,255,.9)',r:rnd(3,5)});S.fx.push({k:'ring',x:h.x,y:h.y+30,r:5,mr:26,t:.3,col:'#fff'})}}
 h.wp+=h.moving&&h.z===0?dt*(h.running?17:11):0;
 h.dust-=dt;
 if(h.moving&&h.z===0&&h.dust<=0){h.dust=h.running?.06:.15;S.fx.push({k:'p',x:h.x-h.face*8,y:h.y+30,vx:rnd(-20,20)-h.face*25,vy:rnd(-30,-10),t:.35,col:'rgba(255,255,255,.9)',r:rnd(3,5)})}
 for(let i=S.dr.length-1;i>=0;i--)if(dist(h.x,h.y,S.dr[i].x,S.dr[i].y)<36)pick(S.dr[i],i);
}

function loop(now){

 else if(S.phase==='won'||S.phase==='lost'){S.t+=dt;for(let i=S.fx.length-1;i>=0;i--){S.fx[i].t-=dt;if(S.fx[i].t<=0)S.fx.splice(i,1)}}
