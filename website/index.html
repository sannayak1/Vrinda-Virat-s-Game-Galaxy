<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vrinda &amp; Virat's Arcade</title>
<meta name="description" content="Games made by Vrinda and Virat. Pick one and press Play.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#bfe2ff">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="V&amp;V Arcade">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: bubbly sky hero → spotlight carousel of newest games → filter bar → grid of sticker cards. One committed "candy sky" look. */
:root{
  --ink:#2b1e4f; --muted:#5f5485; --paper:#fff;
  --pink:#ff6fae; --sun:#ffc83d; --mint:#3fd9ae; --sky:#5fb0ff; --grape:#a57bff; --orange:#ff9156;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:#cfe7ff}
body{margin:0;color:var(--ink);font-family:var(--body);font-weight:600;line-height:1.5;min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.55) 1.5px,transparent 2px) 0 0/26px 26px,
    linear-gradient(180deg,#bfe2ff 0%,#dcd6ff 42%,#ffe3f0 100%) fixed}
a{color:inherit}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px;border-radius:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* drifting clouds */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;width:190px;height:58px;background:#fff;border-radius:60px;opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:86px;height:86px;left:28px;top:-44px}
.cloud::after{width:62px;height:62px;left:98px;top:-28px}
.c1{top:9%;animation-duration:95s;animation-delay:-20s}
.c2{top:34%;transform:scale(.7);animation-duration:120s;animation-delay:-70s;opacity:.7}
.c3{top:62%;transform:scale(.9);animation-duration:105s;animation-delay:-45s;opacity:.6}
@keyframes drift{from{left:-260px}to{left:calc(100% + 60px)}}

.appbar{display:flex;justify-content:flex-end}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 56px}

/* hero */
.hero{position:relative;text-align:center;padding:36px 0 30px}
.hero h1{margin:0;font-weight:400;line-height:1}
.ribbon{display:inline-block;font-family:var(--display);font-size:clamp(20px,3.4vw,30px);color:#fff;background:var(--ink);padding:6px 22px 8px;border-radius:14px;transform:rotate(-3deg);box-shadow:0 5px 0 var(--pink);letter-spacing:.02em}
.word{display:flex;justify-content:center;gap:clamp(2px,.6vw,8px);margin-top:10px;font-family:var(--display);font-size:clamp(64px,15vw,150px)}
.word span{display:inline-block;color:var(--c);-webkit-text-stroke:clamp(2px,.45vw,4px) var(--ink);text-shadow:0 clamp(5px,1vw,10px) 0 var(--ink);
  animation:bob 2.8s ease-in-out infinite;animation-delay:calc(var(--i) * -.35s);transition:transform .2s;cursor:default}
.word span:hover{animation-play-state:paused;transform:translateY(-14px) scale(1.12) rotate(-6deg)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.tagline{margin:18px auto 0;font-size:clamp(17px,2.2vw,21px);font-weight:800;color:var(--muted);max-width:34ch}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:5px 16px;font-weight:900;font-size:15px;box-shadow:0 4px 0 var(--ink)}
.stat b{font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums;margin-right:4px}
.stat:nth-child(1) b{color:#e0457f}.stat:nth-child(2) b{color:#2e86e6}.stat:nth-child(3) b{color:#1a9e7a}
.actions{position:relative;z-index:1;display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:26px}
.deco{position:absolute;width:var(--s,56px);animation:float 5s ease-in-out infinite;animation-delay:var(--d,0s);pointer-events:none}
.deco svg{display:block;width:100%;height:auto}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-16px) rotate(calc(var(--r,0deg) * -1))}}
@media (max-width:700px){.deco.wide{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:400;font-size:22px;line-height:1;letter-spacing:.02em;color:var(--ink);text-decoration:none;
  background:var(--b,var(--sun));border:3px solid var(--ink);border-radius:999px;padding:13px 26px;box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn svg{width:20px;height:20px;flex:none}
.btn.pink{--b:var(--pink)}
.btn.white{--b:#fff}
.btn.small{font-size:19px;padding:9px 20px 9px 16px;box-shadow:0 4px 0 var(--ink)}
.btn.small:hover{box-shadow:0 6px 0 var(--ink)}
.btn.small:active{box-shadow:0 1px 0 var(--ink)}

/* spotlight */
.spot{position:relative;margin:18px 0 56px}
.spot-track{display:grid;grid-template-columns:minmax(0,1fr)}
.slide{grid-area:1/1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);background:#fff;border:4px solid var(--ink);border-radius:32px;box-shadow:10px 12px 0 var(--ink);
  opacity:0;visibility:hidden;transform:translateY(12px) scale(.98);transition:opacity .45s,transform .45s,visibility 0s .45s}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s,transform .45s,visibility 0s}
.slide .shot{position:relative;display:block;margin:16px;border:3px solid var(--ink);border-radius:22px;overflow:hidden;aspect-ratio:16/10;background:#e9e4ff}
.slide .shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.slide .shot:hover img{transform:scale(1.04)}
.burst{position:absolute;top:-6px;left:-6px;width:92px;height:92px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--ink);transform:rotate(-14deg);z-index:2;animation:pulse 1.6s ease-in-out infinite}
.burst svg{position:absolute;inset:0;width:100%;height:100%}
.burst span{position:relative}
@keyframes pulse{0%,100%{transform:rotate(-14deg) scale(1)}50%{transform:rotate(-8deg) scale(1.08)}}
.slide .info{padding:28px 30px 28px 14px;display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}
.eyebrow{align-self:flex-start;font-weight:900;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--mint);border:3px solid var(--ink);border-radius:999px;padding:3px 12px}
.slide h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,4vw,48px);line-height:1.02;margin:0;text-wrap:balance}
.slide p{margin:0;color:var(--muted);font-size:17px;max-width:40ch}
.slide .btn{align-self:flex-start;margin-top:6px;--b:var(--pink);font-size:26px;padding:14px 32px 14px 26px}
.spot-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px}
.arrow{width:46px;height:46px;display:grid;place-items:center;background:#fff;border:3px solid var(--ink);border-radius:50%;box-shadow:0 4px 0 var(--ink);cursor:pointer;color:var(--ink);transition:transform .12s,box-shadow .12s}
.arrow:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.arrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.arrow svg{width:20px;height:20px}
.dots{display:flex;gap:8px}
.dot{width:14px;height:14px;padding:0;border-radius:999px;border:3px solid var(--ink);background:#fff;cursor:pointer;transition:width .25s,background .25s}
.dot[aria-current="true"]{width:36px;background:var(--pink)}
@media (max-width:760px){.slide{grid-template-columns:1fr;box-shadow:6px 8px 0 var(--ink)}.slide .shot{margin:12px 12px 0}.slide .info{padding:18px 20px 22px}}

/* all games */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.head h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.4vw,44px);line-height:1;margin:0;position:relative;padding-bottom:12px}
.head h2 svg{position:absolute;left:0;bottom:0;width:100%;height:12px}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;font:inherit;font-weight:800;font-size:16px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:11px 18px 11px 46px;box-shadow:0 4px 0 var(--ink)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;box-shadow:0 4px 0 var(--ink),0 0 0 5px rgba(255,111,174,.45)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.chip{font:inherit;font-weight:900;font-size:15px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 15px 6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:0 3px 0 var(--ink);transition:transform .12s}
.chip::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--dc,var(--pink));border:2px solid var(--ink)}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip[aria-pressed="true"]::before{border-color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:30px 26px}
.card{display:flex;flex-direction:column;background:#fff;border:3px solid var(--ink);border-radius:26px;padding:10px;min-width:0;box-shadow:7px 8px 0 var(--a);
  transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--n) * 45ms)}
.card:hover{transform:translateY(-7px) rotate(var(--tilt));box-shadow:10px 13px 0 var(--a)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.94)}}
.card .shot{position:relative;display:block;aspect-ratio:16/10;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#e9e4ff}
.card .shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover .shot img{transform:scale(1.06)}
.new{position:absolute;top:10px;right:10px;font-family:var(--display);font-size:15px;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:1px 10px 3px;transform:rotate(6deg)}
.card .body{padding:14px 8px 8px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.card h3{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.05;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:15px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:999px;background:var(--tb);color:var(--tf)}
.tag.laptop{background:var(--ink);color:#fff;text-decoration:none}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}
.card .btn{--b:var(--a)}
.rate{align-self:flex-start;font-size:14px;font-weight:900;color:var(--ink);text-decoration:none;border-bottom:3px solid var(--a);line-height:1.3}
.rate:hover{background:var(--a)}
.date{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
details.versions{font-size:14px;color:var(--muted);border-top:2px dashed #ddd6f3;padding-top:8px;margin-top:4px}
details.versions summary{cursor:pointer;font-weight:900;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.versions summary::-webkit-details-marker{display:none}
details.versions summary::before{content:"";width:0;height:0;border-left:7px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
details.versions[open] summary::before{transform:rotate(90deg)}
.vlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vlist a{text-decoration:none;font-weight:900;font-size:13px;color:var(--ink);padding:3px 11px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.vlist a:hover{background:var(--a)}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;font-size:19px;font-weight:800;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-weight:400;font-size:30px;color:var(--ink)}

footer{margin-top:64px;text-align:center;font-weight:800;font-size:16px;color:var(--muted)}
footer .heart{display:inline-block;color:#e0457f;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.3)}40%{transform:scale(1)}}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.piece{position:absolute;width:10px;height:14px;border-radius:3px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .cloud{display:none}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span></div>

<div class="wrap">
  <div class="appbar"><a class="btn small" style="--b:var(--mint)" href="help.html#install" data-install hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3" fill="#fff" stroke="currentColor" stroke-width="2.4"/><path d="M12 7v7.5M8.8 11.5 12 14.7l3.2-3.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Get the app</a></div>
  <header class="hero">
    <span class="deco wide" style="top:6%;left:3%;--s:64px;--r:-12deg" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M32 4l8.6 17.5 19.3 2.8-14 13.6 3.3 19.2L32 48l-17.2 9.1 3.3-19.2-14-13.6 19.3-2.8z" fill="#ffc83d" stroke="#2b1e4f" stroke-width="4" stroke-linejoin="round"/></svg></span>
    <span class="deco" style="top:52%;left:1%;--s:54px;--r:10deg;--d:-1.5s" aria-hidden="true"><svg viewBox="0 0 64 44"><rect x="3" y="5" width="58" height="34" rx="17" fill="#a57bff" stroke="#2b1e4f" stroke-width="4"/><rect x="13" y="19" width="14" height="5" rx="2.5" fill="#fff"/><rect x="17.5" y="14.5" width="5" height="14" rx="2.5" fill="#fff"/><circle cx="44" cy="17" r="3.6" fill="#ffc83d"/><circle cx="51" cy="24" r="3.6" fill="#ff6fae"/></svg></span>
    <span class="deco wide" style="top:4%;right:4%;--s:58px;--r:14deg;--d:-3s" aria-hidden="true"><svg viewBox="0 0 64 58"><path d="M32 54S4 37 4 19.5C4 10 11 4 19 4c6 0 10.5 3.5 13 8 2.5-4.5 7-8 13-8 8 0 15 6 15 15.5C60 37 32 54 32 54z" fill="#ff6fae" stroke="#2b1e4f" stroke-width="4" stroke-linejoin="round"/><ellipse cx="18" cy="17" rx="5" ry="3.5" fill="#fff" opacity=".7"/></svg></span>
    <span class="deco" style="top:50%;right:2%;--s:50px;--r:-10deg;--d:-2s" aria-hidden="true"><svg viewBox="0 0 48 64"><path d="M29 3L6 37h16l-5 24 25-36H25z" fill="#3fd9ae" stroke="#2b1e4f" stroke-width="4" stroke-linejoin="round"/></svg></span>
    <span class="deco wide" style="top:30%;left:13%;--s:42px;--r:20deg;--d:-4s" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#ffc83d" stroke="#2b1e4f" stroke-width="4"/><circle cx="24" cy="24" r="11" fill="none" stroke="#2b1e4f" stroke-width="3"/></svg></span>
    <span class="deco wide" style="top:28%;right:14%;--s:46px;--r:-16deg;--d:-.8s" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="18" fill="#5fb0ff" stroke="#2b1e4f" stroke-width="4"/><ellipse cx="32" cy="32" rx="29" ry="9" fill="none" stroke="#2b1e4f" stroke-width="4" transform="rotate(-20 32 32)"/></svg></span>

    <h1>
      <span class="ribbon">Vrinda &amp; Virat's</span>
      <span class="sr">Arcade</span>
      <span class="word" aria-hidden="true"><span style="--i:0;--c:var(--pink)">A</span><span style="--i:1;--c:var(--sun)">r</span><span style="--i:2;--c:var(--mint)">c</span><span style="--i:3;--c:var(--sky)">a</span><span style="--i:4;--c:var(--grape)">d</span><span style="--i:5;--c:var(--orange)">e</span></span>
    </h1>
    <p class="tagline">Games we made ourselves. Pick one and press Play!</p>
    <div class="stats"><span class="stat"><b id="nGames">0</b>games</span><span class="stat"><b id="nKinds">0</b>kinds</span><span class="stat"><b id="nVersions">0</b>versions</span></div>
    <div class="actions">
      <a class="btn pink" id="playNewest" href="#" data-play><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>Play the newest</a>
      <button class="btn" id="surprise" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="#fff" stroke="currentColor" stroke-width="2.5"/><circle cx="8.5" cy="8.5" r="1.7" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.7" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.7" fill="currentColor"/></svg>Surprise me!</button>
      <a class="btn white" href="help.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#fff" stroke="currentColor" stroke-width="2.5"/><path d="M9.2 9.3a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.3-2.8 4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.5" fill="currentColor"/></svg>How to play</a>
      <a class="btn white" id="feedbackBtn" href="#" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z" fill="#fff" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="8.5" cy="9.5" r="1.4" fill="currentColor"/><circle cx="12" cy="9.5" r="1.4" fill="currentColor"/><circle cx="15.5" cy="9.5" r="1.4" fill="currentColor"/></svg>Give feedback</a>
    </div>
  </header>

  <section class="spot" aria-roledescription="carousel" aria-label="Newest games">
    <div class="spot-track" id="spot"></div>
    <div class="spot-nav">
      <button class="arrow" id="prev" type="button" aria-label="Previous game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="dots" id="dots"></div>
      <button class="arrow" id="next" type="button" aria-label="Next game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </section>

  <section aria-labelledby="allHead">
    <div class="head">
      <h2 id="allHead">All our games<svg viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true"><path d="M3 8 Q 20 1 37 7 T 71 7 T 105 7 T 139 7 T 173 7 T 197 6" fill="none" stroke="#ff6fae" stroke-width="5" stroke-linecap="round"/></svg></h2>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="Find a game…" aria-label="Find a game"></label>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter games"></div>
    <main class="grid" id="grid"></main>
  </section>

  <footer>Made with lots of ideas <span class="heart" aria-hidden="true">♥</span> by Vrinda and Virat · <a href="help.html">How to play</a><span id="feedbackFoot" hidden> · <a href="#" target="_blank" rel="noopener">Give feedback</a></span></footer>
</div>

<script>

const ICON_PLAY='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>';
const BURST='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 3l9 14 16-6 1 17 17 3-8 15 12 12-16 7 3 17-17-1-6 16-12-12-14 10-4-17-17-2 7-16-13-11 15-8-4-17 17 1 5-16 13 11z" fill="#ffc83d" stroke="#2b1e4f" stroke-width="4" stroke-linejoin="round"/></svg>';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const isNew=d=>(Date.now()-new Date(d+'T12:00:00'))/864e5<21;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sorted=[...GAMES].sort((a,b)=>b.updated.localeCompare(a.updated));
const ACCENTS=['var(--pink)','var(--sky)','var(--mint)','var(--sun)','var(--grape)','var(--orange)'];
const TAG_COLORS={Adventure:['#dcecff','#1d5aa8'],'3D':['#ece3ff','#5530bd'],Spooky:['#2b1e4f','#fff'],Fighting:['#ffe2d3','#a8410c'],
  Sneaky:['#d4f6ea','#0f7055'],Maze:['#fff0c2','#7d5900'],Funny:['#ffe0ee','#a82866'],'2 players':['#dff2ff','#0d6491'],Learning:['#e3f7d4','#3b6e12']};
const tagColor=t=>TAG_COLORS[t]||['#efeaff','#4a3f73'];
const LAPTOP_TAG='<a class="tag laptop" href="help.html#laptop-only" title="Needs a keyboard">Laptop only</a>';
const tagHTML=t=>{const [b,f]=tagColor(t);return `<span class="tag" style="--tb:${b};--tf:${f}">${esc(t)}</span>`;};

/* hero stats */
const tags=[...new Set(GAMES.flatMap(g=>g.tags))].sort();
function countUp(id,n){
  const el=document.getElementById(id);
  if(reduce){el.textContent=n;return;}
  const t0=performance.now();
  (function step(t){const p=Math.min(1,(t-t0)/1100);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);})(t0);
}
countUp('nGames',GAMES.length);
countUp('nKinds',tags.length);
countUp('nVersions',GAMES.reduce((n,g)=>n+1+(g.older||[]).length,0));
document.getElementById('playNewest').href=sorted[0].file;
if(feedbackURL()){
  document.getElementById('feedbackBtn').href=feedbackURL();document.getElementById('feedbackBtn').hidden=false;
  const ff=document.getElementById('feedbackFoot');ff.querySelector('a').href=feedbackURL();ff.hidden=false;
}

/* spotlight carousel */
const spotGames=sorted.slice(0,4);
const spot=document.getElementById('spot'),dotsEl=document.getElementById('dots');
spot.innerHTML=spotGames.map((g,i)=>`<article class="slide" aria-roledescription="slide" aria-label="${i+1} of ${spotGames.length}">
  <a class="shot" href="${esc(g.file)}" data-play tabindex="-1" aria-hidden="true"><img src="${esc(g.thumb)}" alt="">${i===0?`<span class="burst">${BURST}<span>NEW!</span></span>`:''}</a>
  <div class="info">
    <span class="eyebrow">${i===0?'Newest game':'Recently updated'}</span>
    <h2>${esc(g.title)}</h2>
    <p>${esc(g.blurb)}</p>
    <div class="meta">${g.phone===false?LAPTOP_TAG:''}${g.by?tagHTML('By '+g.by):''}${g.tags.map(tagHTML).join('')}</div>
    <a class="btn" href="${esc(g.file)}" data-play>${ICON_PLAY} Play</a>
  </div></article>`).join('');
dotsEl.innerHTML=spotGames.map((g,i)=>`<button class="dot" type="button" aria-label="Show ${esc(g.title)}"></button>`).join('');
const slides=[...spot.children],dots=[...dotsEl.children];
let cur=0,timer=null;
function show(i){
  cur=(i+slides.length)%slides.length;
  slides.forEach((s,j)=>{s.classList.toggle('on',j===cur);s.inert=j!==cur;});
  dots.forEach((d,j)=>d.setAttribute('aria-current',j===cur));
}
function start(){if(!reduce&&!timer)timer=setInterval(()=>show(cur+1),6500);}
function stop(){clearInterval(timer);timer=null;}
document.getElementById('prev').onclick=()=>{show(cur-1);stop();start();};
document.getElementById('next').onclick=()=>{show(cur+1);stop();start();};
dots.forEach((d,j)=>d.onclick=()=>{show(j);stop();start();});
const spotSection=spot.parentElement;
spotSection.addEventListener('mouseenter',stop);spotSection.addEventListener('mouseleave',start);
spotSection.addEventListener('focusin',stop);spotSection.addEventListener('focusout',start);
show(0);start();

/* filters + grid */
const makers=[...new Set(GAMES.flatMap(g=>(g.by||'').split(/\s*&\s*/).filter(Boolean)))];
const filters=['All',...(makers.length>1?makers.map(m=>'By '+m):[]),...tags];
let active='All',q='';
try{const s=localStorage.getItem('arcade-filter');if(s&&filters.includes(s))active=s;}catch(e){}
const chips=document.getElementById('chips');
function drawChips(){chips.innerHTML=filters.map(f=>`<button class="chip" type="button" aria-pressed="${f===active}" data-f="${esc(f)}" style="--dc:${f==='All'?'var(--pink)':tagColor(f)[0]}">${esc(f)}</button>`).join('');}
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;active=b.dataset.f;try{localStorage.setItem('arcade-filter',active);}catch(e){}drawChips();drawGrid();});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();drawGrid();});

function card(g,n){
  const older=g.older||[],k=GAMES.indexOf(g);
  return `<article class="card" style="--a:${ACCENTS[k%ACCENTS.length]};--tilt:${k%2?'.8deg':'-.8deg'};--n:${n}">
    <a class="shot" href="${esc(g.file)}" data-play tabindex="-1" aria-hidden="true"><img src="${esc(g.thumb)}" alt="" loading="lazy">${isNew(g.updated)?'<span class="new">NEW</span>':''}</a>
    <div class="body">
      <div class="meta">${g.phone===false?LAPTOP_TAG:''}${g.by?tagHTML('By '+g.by):''}${g.tags.map(tagHTML).join('')}</div>
      <h3>${esc(g.title)}</h3>
      <p>${esc(g.blurb)}</p>
      <div class="row"><a class="btn small" href="${esc(g.file)}" data-play>${ICON_PLAY} Play</a><span class="date">Updated<br>${fmtDate(g.updated)}</span></div>
      ${feedbackURL()?`<a class="rate" href="${esc(feedbackURL(g.title))}" target="_blank" rel="noopener">★ Rate this game</a>`:''}
      ${older.length?`<details class="versions"><summary>${older.length} older version${older.length>1?'s':''}</summary><div class="vlist">${older.map((f,i)=>`<a href="${esc(f)}">Version ${i+1}</a>`).join('')}</div></details>`:''}
    </div></article>`;
}
function drawGrid(){
  const list=sorted.filter(g=>{
    if(active!=='All'){if(active.startsWith('By ')){if(!(g.by||'').includes(active.slice(3)))return false;}else if(!g.tags.includes(active))return false;}
    if(q&&!(g.title+' '+g.blurb+' '+g.tags.join(' ')).toLowerCase().includes(q))return false;return true;});
  document.getElementById('grid').innerHTML=list.length?list.map(card).join(''):'<p class="empty"><b>Oops, no games here!</b>Try another word or pick a different filter.</p>';
}
drawChips();drawGrid();

/* confetti on Play */
const fx=document.getElementById('fx');
const COLORS=['#ff6fae','#ffc83d','#3fd9ae','#5fb0ff','#a57bff','#ff9156'];
function burst(x,y){
  for(let i=0;i<34;i++){
    const p=document.createElement('span');p.className='piece';
    p.style.cssText=`left:${x}px;top:${y}px;background:${COLORS[i%COLORS.length]};${i%3?'':'border-radius:50%;height:10px'}`;
    fx.appendChild(p);
    const a=Math.random()*Math.PI*2,v=90+Math.random()*150,dx=Math.cos(a)*v,dy=Math.sin(a)*v-80,r=Math.random()*720-360;
    p.animate([{transform:'translate(-50%,-50%)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${r/2}deg)`,opacity:1,offset:.55},
      {transform:`translate(calc(-50% + ${dx*1.2}px),calc(-50% + ${dy+160}px)) rotate(${r}deg)`,opacity:0}],{duration:800+Math.random()*300,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>p.remove();
  }
}
function go(href,el,e){
  if(reduce){location.href=href;return;}
  const r=el.getBoundingClientRect();
  const x=e&&e.detail?e.clientX:r.left+r.width/2,y=e&&e.detail?e.clientY:r.top+r.height/2;
  burst(x,y);setTimeout(()=>{location.href=href;},420);
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-play]');
  if(!a||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  e.preventDefault();go(a.href,a,e);
});
document.getElementById('surprise').addEventListener('click',e=>{
  const g=GAMES[Math.floor(Math.random()*GAMES.length)];
  e.currentTarget.innerHTML=`${ICON_PLAY} ${esc(g.title)}!`;
  go(g.file,e.currentTarget,e);
});
</script>
</body>
</html>
