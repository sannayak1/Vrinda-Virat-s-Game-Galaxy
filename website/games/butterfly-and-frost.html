<title>Butterfly &amp; Frost</title>
<style>

#stingBtn{--p:0%;background:linear-gradient(90deg,#8a45d6 var(--p),#221c45 var(--p));}
#stingBtn.ready{border-color:#ffd6ea;box-shadow:0 0 18px 2px rgba(245,155,187,.7)}
#stingBtn:active{transform:scale(.97)}

<body>
<div id="app">
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="controls">
    <button class="btn" id="slashBtn">Slash</button>
    <button class="btn" id="stingBtn">Sting</button>
  </div>
</div>
<div id="ov">
  <div class="box">
    <h1 id="ttl">Butterfly &amp; Frost</h1>
    <p id="sub">Stand between the ice demon and the girl behind you. Deflect his frost back at him, then sting.</p>
    <button id="go">Start</button>
    <div class="how" id="how">Drag to move. Slash deflects ice. Sting when the bar is full.</div>
  </div>
</div>

<script>
(()=>{
const W=360,H=560,FLOORY=520;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let scale=1;
function resize(){
  const st=$('stage');
  const s=Math.min(st.clientWidth/W,st.clientHeight/H);
  const d=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);
  scale=s*d;
}
addEventListener('resize',resize);resize();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);

let S=null,running=false,last=0;
const keys={};

/* ---------- input ---------- */
function toX(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W;}
cv.addEventListener('pointerdown',e=>{if(!S)return;cv.setPointerCapture(e.pointerId);S.p.tx=toX(e);});
cv.addEventListener('pointermove',e=>{if(!S||!e.buttons)return;S.p.tx=toX(e);});
$('slashBtn').addEventListener('pointerdown',e=>{e.preventDefault();slash();});
$('stingBtn').addEventListener('pointerdown',e=>{e.preventDefault();sting();});
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){slash();e.preventDefault();}
  if(e.key==='z'||e.key==='Shift'||e.key==='x')sting();
});
addEventListener('keyup',e=>{keys[e.key]=false;});

/* ---------- state ---------- */
function reset(){
  const snow=[];for(let i=0;i<90;i++)snow.push({x:rand(0,W),y:rand(0,H),v:rand(25,70),r:rand(.8,2.2),ph:rand(0,6)});
  S={t:0,hp:3,score:0,charge:0,over:false,win:false,shake:0,
    boss:{x:W/2,y:105,hp:100,max:100,flash:0,atkT:1.6,fanT:5,spikeT:3.2,cast:0},
    p:{x:W/2,y:468,tx:W/2,slash:0,cd:0,inv:0,thrust:0},
    girl:{x:W/2+36,y:500},
    proj:[],spikes:[],darts:[],parts:[],texts:[],snow};
}
function slash(){
  if(!S||S.over||!running)return;
  const p=S.p;if(p.cd>0)return;
  p.slash=.22;p.cd=.38;
}
function sting(){
  if(!S||S.over||!running||S.charge<100)return;
  S.charge=0;S.darts.push({x:S.p.x,y:S.p.y-34});S.p.thrust=.25;
  burst(S.p.x,S.p.y-30,'#e0b0ff',14);
}
function hurt(){
  const s=S;if(s.p.inv>0||s.over)return;
  s.hp--;s.p.inv=1.3;s.shake=.3;
  burst(s.p.x,s.p.y,'#ff7a90',14);
  if(s.hp<=0)finish(false);
}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=rand(0,6.28),v=rand(40,170);S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.3,.7),max:.7,c,r:rand(1.5,3.5)});}}
function txt(x,y,t){S.texts.push({x,y,t,life:.8});}
function shoot(x,y,tx,ty,sp,r,kind){
  const dx=tx-x,dy=ty-y,d=Math.hypot(dx,dy)||1;
  S.proj.push({x,y,vx:dx/d*sp,vy:dy/d*sp,r,kind,friendly:false,rot:0});
}
function addSpike(x){S.spikes.push({x:clamp(x,24,W-24),t:0,warn:.95,act:.4,boom:false});}
function finish(win){
  const s=S;s.over=true;s.win=win;
  if(win){s.score+=s.hp*200;burst(s.boss.x,s.boss.y+20,'#dff6ff',60);s.shake=.5;}
  setTimeout(()=>{
    running=false;
    $('ov').classList.remove('hide');$('ov').classList.add('dim');
    $('ttl').textContent=win?'The demon retreats':'The frost wins';
    $('sub').textContent=(win?'You held the line with '+s.hp+' heart'+(s.hp===1?'':'s')+' left. ':'Deflect more, get your Sting ready, and step out of the warning rings. ')+'Score: '+s.score;
    $('go').textContent=win?'Play again':'Try again';
    $('how').textContent='Drag to move. Slash deflects ice. Sting when the bar is full.';
  },1100);
}

/* ---------- update ---------- */
function update(dt){
  const s=S;s.t+=dt;
  for(const f of s.snow){f.y+=f.v*dt;f.x+=Math.sin(s.t+f.ph)*10*dt-8*dt;if(f.y>H){f.y=-5;f.x=rand(0,W);}if(f.x<0)f.x=W;}
  s.shake=Math.max(0,s.shake-dt);
  for(const q of s.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.life-=dt;}
  s.parts=s.parts.filter(q=>q.life>0);
  for(const q of s.texts){q.y-=26*dt;q.life-=dt;}
  s.texts=s.texts.filter(q=>q.life>0);
  if(s.over)return;

  const p=s.p,b=s.boss,g=s.girl;
  if(keys.ArrowLeft||keys.a)p.tx-=290*dt;
  if(keys.ArrowRight||keys.d)p.tx+=290*dt;
  p.tx=clamp(p.tx,30,W-30);
  p.x+=(p.tx-p.x)*Math.min(1,dt*14);
  p.slash=Math.max(0,p.slash-dt);p.cd=Math.max(0,p.cd-dt);
  p.inv=Math.max(0,p.inv-dt);p.thrust=Math.max(0,p.thrust-dt);
  const gt=p.x+(p.x>W/2?-38:38);
  g.x+=(gt-g.x)*Math.min(1,dt*6);

  b.x=W/2+Math.sin(s.t*.7)*95;
  b.flash=Math.max(0,b.flash-dt);b.cast=Math.max(0,b.cast-dt);
  const ratio=b.hp/b.max,ph=ratio>.66?0:ratio>.33?1:2;

  b.atkT-=dt;
  if(b.atkT<=0){
    const tgt=Math.random()<.35?g:p;
    shoot(b.x,b.y+40,tgt.x,tgt.y,175+ph*35,10,'crescent');
    b.atkT=[1.4,1.1,.8][ph];b.cast=.25;
  }
  if(ph>=1){
    b.fanT-=dt;
    if(b.fanT<=0){
      for(let i=-2;i<=2;i++){const a=Math.PI/2+i*.28;s.proj.push({x:b.x,y:b.y+40,vx:Math.cos(a)*150,vy:Math.sin(a)*150,r:6,kind:'shard',friendly:false,rot:0});}
      b.fanT=ph===1?6:4.5;b.cast=.4;
    }
    b.spikeT-=dt;
    if(b.spikeT<=0){
      addSpike(p.x+rand(-30,30));
      if(ph===2)addSpike(g.x+rand(-20,20));
      b.spikeT=ph===1?4.2:3.2;
    }
  }

  for(const q of s.proj){
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=dt*9;
    if(q.dead)continue;
    if(q.friendly){
      if(Math.hypot(q.x-b.x,q.y-(b.y+22))<36){
        q.dead=true;b.hp-=q.kind==='crescent'?5:2;b.flash=.12;s.score+=25;
        burst(q.x,q.y,'#bfefff',8);
      }
    }else{
      if(p.slash>0&&Math.hypot(q.x-p.x,q.y-(p.y-22))<74&&q.y<p.y+20){
        q.friendly=true;
        const dx=b.x-q.x,dy=b.y+22-q.y,d=Math.hypot(dx,dy)||1;
        q.vx=dx/d*340;q.vy=dy/d*340;
        s.charge=Math.min(100,s.charge+(q.kind==='shard'?6:14));s.score+=10;
        burst(q.x,q.y,'#ffb3d1',10);
        if(q.kind==='crescent')txt(q.x,q.y-10,'Deflect');
      }else if(Math.hypot(q.x-p.x,q.y-p.y)<q.r+13||Math.hypot(q.x-g.x,q.y-g.y)<q.r+11){
        q.dead=true;burst(q.x,q.y,'#bfefff',12);hurt();
      }
    }
    if(q.y>H+30||q.y<-30||q.x<-30||q.x>W+30)q.dead=true;
  }
  s.proj=s.proj.filter(q=>!q.dead);

  for(const d of s.darts){
    d.y-=560*dt;
    for(const q of s.proj){if(!q.friendly&&!q.dead&&Math.abs(q.x-d.x)<18&&Math.abs(q.y-d.y)<18){q.dead=true;burst(q.x,q.y,'#e0b0ff',6);}}
    if(!d.dead&&d.y<b.y+50&&Math.abs(d.x-b.x)<46){
      d.dead=true;b.hp-=18;b.flash=.3;s.shake=.25;s.score+=100;
      burst(b.x,b.y+30,'#d9a6ff',26);txt(b.x,b.y+70,'Sting');
    }
    if(d.y<-20)d.dead=true;
  }
  s.darts=s.darts.filter(d=>!d.dead);

  for(const k of s.spikes){
    k.t+=dt;
    if(k.t>k.warn&&k.t<k.warn+k.act){
      if(!k.boom){k.boom=true;s.shake=Math.max(s.shake,.2);burst(k.x,FLOORY-6,'#dff6ff',14);}
      if(Math.abs(p.x-k.x)<24||Math.abs(g.x-k.x)<22)hurt();
    }
  }
  s.spikes=s.spikes.filter(k=>k.t<k.warn+k.act+.35);

  if(b.hp<=0){b.hp=0;finish(true);}
}

/* ---------- drawing ---------- */
function drawBG(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#080d22');g.addColorStop(1,'#1c2548');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0a1024';
  for(const x of [22,118,292]){ctx.fillRect(x,0,26,400);}
  // shrine
  ctx.fillStyle='#2b1f26';ctx.beginPath();ctx.moveTo(196,70);ctx.lineTo(360,30);ctx.lineTo(360,88);ctx.lineTo(206,104);ctx.closePath();ctx.fill();
  ctx.fillStyle='#dbe9fa';ctx.beginPath();ctx.moveTo(196,70);ctx.lineTo(360,30);ctx.lineTo(360,44);ctx.lineTo(202,84);ctx.closePath();ctx.fill();
  ctx.fillStyle='#3a2a30';ctx.fillRect(318,90,16,330);
  // floor
  const f=ctx.createLinearGradient(0,400,0,H);f.addColorStop(0,'#2a3355');f.addColorStop(1,'#151b36');
  ctx.fillStyle=f;ctx.fillRect(0,400,W,H-400);
  ctx.fillStyle='rgba(220,238,255,.10)';
  ctx.beginPath();ctx.ellipse(70,455,80,16,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(260,520,90,14,0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(8,12,30,.55)';ctx.lineWidth=2;
  for(let y=400;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // cold light
  const v=ctx.createRadialGradient(W/2,H*.45,60,W/2,H*.45,H*.75);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(2,4,14,.6)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function fan(x,y,rot,open){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.fillStyle='rgba(170,226,255,.88)';ctx.strokeStyle='#effcff';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,32+open*6,-Math.PI*.9,-Math.PI*.1);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;
  for(let i=1;i<6;i++){const a=-Math.PI*.9+i*(Math.PI*.8/6);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*(32+open*6),Math.sin(a)*(32+open*6));ctx.stroke();}
  ctx.restore();
}
function drawBoss(b,t){
  ctx.save();ctx.translate(b.x,b.y);
  const sway=Math.sin(t*2)*2;
  ctx.fillStyle='#14141d';ctx.beginPath();ctx.moveTo(-30,-8);ctx.lineTo(-60,84);ctx.lineTo(60,84);ctx.lineTo(30,-8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8c8c97';ctx.beginPath();ctx.moveTo(-24,42);ctx.lineTo(-40,90);ctx.lineTo(40,90);ctx.lineTo(24,42);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#6d6d78';ctx.lineWidth=1;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*6,44);ctx.lineTo(i*10,90);ctx.stroke();}
  ctx.fillStyle='#8f1d2c';ctx.fillRect(-21,-8,42,52);
  ctx.fillStyle='#1a0e14';
  for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-14+i*14,20);ctx.quadraticCurveTo(-10+i*14,8,-6+i*14,20);ctx.quadraticCurveTo(-10+i*14,26,-14+i*14,20);ctx.fill();}
  ctx.fillStyle='#d9d9e6';ctx.fillRect(-22,40,44,6);
  ctx.fillStyle='#1a1a24';ctx.fillRect(-14,-14,28,8);
  ctx.fillStyle='#f0e2d8';ctx.beginPath();ctx.arc(0,-28,14,0,7);ctx.fill();
  ctx.fillStyle='#f4f1ea';
  ctx.beginPath();ctx.moveTo(-16,-28);ctx.lineTo(-24,-46+sway);ctx.lineTo(-12,-38);ctx.lineTo(-10,-54);ctx.lineTo(-2,-40);ctx.lineTo(6,-56+sway);ctx.lineTo(10,-40);ctx.lineTo(22,-48);ctx.lineTo(16,-28);ctx.lineTo(10,-34);ctx.lineTo(-10,-34);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8f1d2c';ctx.beginPath();ctx.ellipse(0,-50,10,5,0,0,7);ctx.fill();
  ctx.fillStyle='#b9a8c8';ctx.fillRect(-7,-30,4,3);ctx.fillRect(3,-30,4,3);
  ctx.strokeStyle='#5b3b3b';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-24,5,.15*Math.PI,.85*Math.PI);ctx.stroke();
  const open=b.cast>0?1:0;
  ctx.save();ctx.strokeStyle='#f0e2d8';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-20,-2);ctx.lineTo(-42,20+sway);ctx.stroke();
  ctx.beginPath();ctx.moveTo(20,-2);ctx.lineTo(42,14-sway);ctx.stroke();ctx.restore();
  fan(-42,20+sway,-.5+open*-.3,open);
  fan(42,14-sway,.5+open*.3,open);
  if(b.flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(.7,b.flash*4)+')';ctx.beginPath();ctx.arc(0,10,52,0,7);ctx.fill();}
  ctx.restore();
}
function drawShinobu(p,t){
  ctx.save();ctx.translate(p.x,p.y);
  if(p.inv>0&&Math.floor(t*20)%2)ctx.globalAlpha=.4;
  const sw=Math.sin(t*3)*2;
  ctx.fillStyle='#211b48';ctx.fillRect(-13,14,26,28);
  ctx.fillStyle='#2b2460';ctx.fillRect(-13,-14,26,32);
  ctx.fillStyle='#c9a24a';ctx.beginPath();ctx.arc(0,-4,1.8,0,7);ctx.arc(0,6,1.8,0,7);ctx.fill();
  const wing=s=>{
    ctx.beginPath();ctx.moveTo(s*9,-14);ctx.lineTo(s*46,-4+sw);ctx.lineTo(s*40,34);ctx.lineTo(s*8,32);ctx.closePath();
    const g=ctx.createLinearGradient(s*10,-10,s*46,34);g.addColorStop(0,'#f4f4fb');g.addColorStop(.55,'#f2a2be');g.addColorStop(1,'#8fe4d2');
    ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#15151f';ctx.lineWidth=2;ctx.stroke();
    ctx.strokeStyle='rgba(20,20,40,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(s*12,-8);ctx.lineTo(s*36,12);ctx.moveTo(s*10,4);ctx.lineTo(s*32,26);ctx.stroke();
  };
  wing(-1);wing(1);
  ctx.fillStyle='#f6e3d8';ctx.beginPath();ctx.arc(0,-27,12,0,7);ctx.fill();
  ctx.fillStyle='#1a1424';ctx.beginPath();ctx.arc(0,-31,12.5,Math.PI,0);ctx.lineTo(12,-24);ctx.lineTo(8,-30);ctx.lineTo(-8,-30);ctx.lineTo(-12,-24);ctx.closePath();ctx.fill();
  ctx.fillStyle='#6b45b8';ctx.fillRect(-12,-27,4,6);ctx.fillRect(8,-27,4,6);
  ctx.fillStyle='#7a5ad8';ctx.beginPath();ctx.ellipse(-4.5,-25,2.2,3,0,0,7);ctx.ellipse(4.5,-25,2.2,3,0,0,7);ctx.fill();
  ctx.fillStyle='#b58cf0';ctx.beginPath();ctx.ellipse(12,-40,6,4,-.6,0,7);ctx.ellipse(16,-36,5,3.5,.6,0,7);ctx.fill();
  const sl=p.slash>0?1-p.slash/.22:0;
  const ang=p.thrust>0?-Math.PI/2:(p.slash>0?-2.4+sl*2.6:-1.15);
  ctx.save();ctx.translate(12,4);ctx.rotate(ang);
  ctx.fillStyle='#e8f0ff';ctx.fillRect(0,-1.5,50,3);
  ctx.fillStyle='#e58fb3';ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();
  ctx.restore();
  if(p.slash>0){
    ctx.strokeStyle='rgba(255,190,220,'+(p.slash/.22)+')';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,-22,64,-2.6+sl*.4,-.5-(1-sl)*.3);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,'+(p.slash/.22)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,-22,64,-2.6+sl*.4,-.5-(1-sl)*.3);ctx.stroke();
  }
  ctx.restore();
}
function drawGirl(g,t,hp){
  ctx.save();ctx.translate(g.x,g.y);
  const tr=Math.sin(t*25)*(hp<3?1.2:.7);ctx.translate(tr,0);
  ctx.fillStyle='#2b3970';ctx.fillRect(-10,12,20,22);
  ctx.fillStyle='#c94a54';ctx.fillRect(-12,-12,24,28);
  ctx.fillStyle='#b8845c';ctx.beginPath();ctx.arc(-13,2,4,0,7);ctx.arc(13,2,4,0,7);ctx.fill();
  ctx.fillStyle='#b8845c';ctx.beginPath();ctx.arc(0,-24,11,0,7);ctx.fill();
  ctx.fillStyle='#14121c';ctx.beginPath();ctx.arc(0,-28,12,Math.PI,0);ctx.lineTo(12,-14);ctx.lineTo(8,-26);ctx.lineTo(-8,-26);ctx.lineTo(-12,-14);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#d9dde8';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(-4.5,-24,3.6,0,7);ctx.arc(4.5,-24,3.6,0,7);ctx.moveTo(-1,-24);ctx.lineTo(1,-24);ctx.stroke();
  ctx.fillStyle='#20141c';ctx.beginPath();ctx.arc(-4.5,-24,1.2,0,7);ctx.arc(4.5,-24,1.2,0,7);ctx.fill();
  ctx.strokeStyle='#5b3a2c';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,-15,3,1.15*Math.PI,1.85*Math.PI);ctx.stroke();
  ctx.restore();
}
function drawSpike(k,t){
  const a=k.t;
  if(a<k.warn){
    const pulse=.5+.5*Math.sin(a*18);
    ctx.strokeStyle='rgba(160,225,255,'+(.35+.45*pulse)+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(k.x,FLOORY-4,26,8,0,0,7);ctx.stroke();
    ctx.fillStyle='rgba(160,225,255,'+(.10+.15*a/k.warn)+')';ctx.fill();
  }else{
    const u=Math.min(1,(a-k.warn)/.08),fade=a>k.warn+k.act?1-(a-k.warn-k.act)/.35:1;
    ctx.save();ctx.globalAlpha=Math.max(0,fade);
    for(const [dx,h,w] of [[-12,70,10],[0,120,13],[12,80,10]]){
      const hh=h*u;
      const g=ctx.createLinearGradient(k.x+dx,FLOORY,k.x+dx,FLOORY-hh);g.addColorStop(0,'#7fc7f0');g.addColorStop(1,'#f2fdff');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(k.x+dx-w,FLOORY);ctx.lineTo(k.x+dx,FLOORY-hh);ctx.lineTo(k.x+dx+w,FLOORY);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#ffffff';ctx.lineWidth=1.2;ctx.stroke();
    }
    ctx.restore();
  }
}
function drawProj(q){
  ctx.save();ctx.translate(q.x,q.y);
  const col=q.friendly?'255,170,210':'170,230,255';
  const gl=ctx.createRadialGradient(0,0,1,0,0,q.r*2.6);gl.addColorStop(0,'rgba('+col+',.55)');gl.addColorStop(1,'rgba('+col+',0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,q.r*2.6,0,7);ctx.fill();
  ctx.rotate(q.rot);
  ctx.fillStyle=q.friendly?'#ffd0e4':'#e6fbff';
  if(q.kind==='crescent'){
    ctx.beginPath();ctx.arc(0,0,q.r,.3,Math.PI*2-.3);ctx.arc(q.r*.45,0,q.r*.8,Math.PI*2-.9,.9,true);ctx.closePath();ctx.fill();
  }else{
    ctx.beginPath();ctx.moveTo(0,-q.r*1.4);ctx.lineTo(q.r*.7,0);ctx.lineTo(0,q.r*1.4);ctx.lineTo(-q.r*.7,0);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawHUD(s){
  const b=s.boss;
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(60,12,240,10);
  const g=ctx.createLinearGradient(60,0,300,0);g.addColorStop(0,'#7fd0ff');g.addColorStop(1,'#d5f4ff');
  ctx.fillStyle=g;ctx.fillRect(60,12,240*b.hp/b.max,10);
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.strokeRect(60,12,240,10);
  ctx.fillStyle='#cfe3f6';ctx.font='bold 11px "Trebuchet MS",sans-serif';ctx.textAlign='left';ctx.fillText('Doma',14,21);
  ctx.textAlign='left';ctx.font='20px sans-serif';
  for(let i=0;i<3;i++){ctx.fillStyle=i<s.hp?'#ff5c78':'rgba(255,255,255,.18)';ctx.fillText('\u2665',12+i*22,48);}
  ctx.textAlign='right';ctx.fillStyle='#eaf6ff';ctx.font='bold 14px "Trebuchet MS",sans-serif';ctx.fillText(String(s.score),W-12,44);
}
function draw(){
  const s=S;
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.save();
  if(s.shake>0)ctx.translate(rand(-1,1)*s.shake*14,rand(-1,1)*s.shake*14);
  drawBG(s.t);
  for(const k of s.spikes)drawSpike(k,s.t);
  drawBoss(s.boss,s.t);
  drawGirl(s.girl,s.t,s.hp);
  drawShinobu(s.p,s.t);
  for(const d of s.darts){
    const gl=ctx.createLinearGradient(d.x,d.y,d.x,d.y+60);gl.addColorStop(0,'rgba(230,180,255,.95)');gl.addColorStop(1,'rgba(230,180,255,0)');
    ctx.fillStyle=gl;ctx.fillRect(d.x-3,d.y,6,60);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(d.x,d.y-10);ctx.lineTo(d.x+5,d.y+4);ctx.lineTo(d.x-5,d.y+4);ctx.closePath();ctx.fill();
  }
  for(const q of s.proj)drawProj(q);
  for(const q of s.parts){ctx.globalAlpha=clamp(q.life/q.max,0,1);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  for(const f of s.snow){ctx.fillStyle='rgba(235,245,255,.75)';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();}
  ctx.textAlign='center';ctx.font='bold 13px "Trebuchet MS",sans-serif';
  for(const q of s.texts){ctx.globalAlpha=clamp(q.life/.8,0,1);ctx.fillStyle='#ffd0e4';ctx.fillText(q.t,q.x,q.y);}
  ctx.globalAlpha=1;
  ctx.restore();
  drawHUD(s);
  if(s.t<4.5&&!s.over){
    ctx.globalAlpha=clamp(1.2-(s.t-3.3),0,1)*clamp(s.t*2,0,1);
    ctx.fillStyle='#eaf6ff';ctx.textAlign='center';ctx.font='bold 13px "Trebuchet MS",sans-serif';
    ctx.fillText('Slash the ice back at him. Fill Sting, then aim it up.',W/2,H-16);
    ctx.globalAlpha=1;
  }
  const sb=$('stingBtn');
  sb.style.setProperty('--p',S.charge+'%');
  sb.classList.toggle('ready',S.charge>=100);
}

/* ---------- loop / start ---------- */
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;
  const dt=Math.min(.033,(ts-last)/1000);last=ts;
  if(S){update(dt);draw();}
}
$('go').addEventListener('click',()=>{
  reset();running=true;
  $('ov').classList.add('hide');$('ov').classList.remove('dim');
  resize();
});
requestAnimationFrame(loop);
})();
</script>
