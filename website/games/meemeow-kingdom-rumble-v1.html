.dlg{font-size:18px;min-height:70px}
.sp{font-weight:bold;color:#ffd45e;font-size:20px}
.hint{font-size:12px;color:#5a2d7a}

const AUD={ctx:null,master:null,muted:false,music:null,step:0,lastHit:0};
function ac(){
 if(!AUD.ctx){try{AUD.ctx=new(window.AudioContext||window.webkitAudioContext)();AUD.master=AUD.ctx.createGain();AUD.master.gain.value=AUD.muted?0:1;AUD.master.connect(AUD.ctx.destination)}catch(e){return null}}
 if(AUD.ctx.state==='suspended')AUD.ctx.resume();

}
function tone(f,d,type,v,delay,to){
 const c=ac();if(!c)return;
 try{const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type==='sine'?'sine':'triangle';o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.05,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AUD.master);o.start(t);o.stop(t+d+.03)}catch(e){}
}
function noise(d,v,fq,delay){
 const c=ac();if(!c)return;
 try{const t=c.currentTime+(delay||0),n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=b;f.type='lowpass';f.frequency.value=fq||800;g.gain.value=v||.1;
  s.connect(f);f.connect(g);g.connect(AUD.master);s.start(t)}catch(e){}
}

/* ---------- Drawing helpers ---------- */
function ell(x,y,rx,ry,f){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,7);ctx.fillStyle=f;ctx.fill()}
function rr(x,y,w,h,r,f){ctx.beginPath();ctx.roundRect(x,y,Math.max(0,w),Math.max(0,h),r);ctx.fillStyle=f;ctx.fill()}
function txt(t,x,y,size,col,align,stroke){ctx.font='bold '+size+'px "Trebuchet MS",system-ui,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke){ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.strokeText(t,x,y)}ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y)}
function star5(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}ctx.closePath();ctx.fill()}
function hat(kind,s,hy,col){
 switch(kind){
  case'crown':ctx.fillStyle='#ffd45e';ctx.beginPath();ctx.moveTo(-s*.5,hy);ctx.lineTo(-s*.5,hy-s*.45);ctx.lineTo(-s*.25,hy-s*.2);ctx.lineTo(0,hy-s*.55);ctx.lineTo(s*.25,hy-s*.2);ctx.lineTo(s*.5,hy-s*.45);ctx.lineTo(s*.5,hy);ctx.closePath();ctx.fill();ell(0,hy-s*.2,s*.08,s*.08,'#ff5a8a');break;
  case'wizard':ctx.fillStyle='#8a5cf0';ctx.beginPath();ctx.moveTo(-s*.7,hy+s*.05);ctx.lineTo(0,hy-s*1.1);ctx.lineTo(s*.7,hy+s*.05);ctx.closePath();ctx.fill();ell(0,hy+s*.03,s*.85,s*.12,'#6a3fd0');star5(0,hy-s*.4,s*.16,'#ffe36e');break;
  case'bow':for(const sx of[-1,1]){ctx.fillStyle='#ff5aa0';ctx.beginPath();ctx.moveTo(s*.6,hy+s*.15);ctx.lineTo(s*.6+sx*s*.45+s*.05,hy-s*.15);ctx.lineTo(s*.6+sx*s*.45+s*.05,hy+s*.45);ctx.closePath();ctx.fill()}ell(s*.6,hy+s*.15,s*.1,s*.1,'#ffd0e4');break;
  case'flower':for(let i=0;i<5;i++){const a=i*1.2566;ell(-s*.6+Math.cos(a)*s*.17,hy+s*.12+Math.sin(a)*s*.17,s*.13,s*.13,'#ff9ec7')}ell(-s*.6,hy+s*.12,s*.09,s*.09,'#ffe36e');break;
  case'pirate':ctx.fillStyle='#333';ctx.beginPath();ctx.moveTo(-s*.85,hy+s*.1);ctx.quadraticCurveTo(0,hy-s*.9,s*.85,hy+s*.1);ctx.closePath();ctx.fill();ell(0,hy-s*.15,s*.1,s*.1,'#eee');break;
  case'helmet':ctx.fillStyle='#c4c9dc';ctx.beginPath();ctx.arc(0,hy+s*.14,s*.85,Math.PI,0);ctx.closePath();ctx.fill();ctx.fillStyle='#ff5a8a';ctx.fillRect(-s*.07,hy-s*.72,s*.14,s*.45);break;
  case'catears':for(const sx of[-1,1]){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(sx*s*.3,hy+s*.1);ctx.quadraticCurveTo(sx*s*.75,hy-s*.9,sx*s*.9,hy+s*.15);ctx.closePath();ctx.fill();ctx.fillStyle='#ffb3cf';ctx.beginPath();ctx.moveTo(sx*s*.43,hy+s*.08);ctx.quadraticCurveTo(sx*s*.72,hy-s*.55,sx*s*.78,hy+s*.12);ctx.closePath();ctx.fill()}break;

 ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=s*.08;for(const dx of[-.18,0,.18]){ctx.beginPath();ctx.moveTo(dx*s,-s*.93);ctx.lineTo(dx*s,-s*.72);ctx.stroke()}

  panel(`<h2>😿 The Castle Fell!</h2><p>The monsters broke through. Regroup and try again — rebuild by day!</p><button class="go" id="rt">Retry Chapter</button>`);
  $('#rt').onclick=()=>{S.b=S.snap.b;S.fish=S.snap.fish;S.cat=S.snap.cat;startChapter()};
 },1000);
}

/* ---------- Specials ---------- */
function cast(){
 const h=S.h;if(S.phase!=='night'||!h||h.down>0||h.spCd>0)return;
 const d=HERO[S.heroType];h.spCd=d.sp;sfx.special();
 switch(S.heroType){
  case'nebula':
   for(let i=0;i<6;i++)S.sched.push({at:.25+i*.3,fn:()=>{const t=S.en.length?S.en[ri(S.en.length)]:null;const x=t?t.x:rnd(300,800),y=t?t.y:rowY(ri(ROWS));boom(x,y,75,70,'#b58cff')}});
   if(S.en.length){let sx=0,sy=0;for(const e of S.en){sx+=e.x;sy+=e.y}S.holes.push({x:sx/S.en.length,y:sy/S.en.length,t:3.5})}
   break;
  case'knight':
   h.shield=4;S.fx.push({k:'ring',x:h.x,y:h.y,r:10,mr:210,t:.6,col:'#ffd45e'});
   for(const e of S.en)if(dist(e.x,e.y,h.x,h.y)<210)e.stun=Math.max(e.stun,e.boss?1:2.2);
   for(const b of S.b)if(dist(colX(b.c),rowY(b.r),h.x,h.y)<230)b.sh=4;
   break;
  case'ranger':
   for(let r=0;r<ROWS;r++)for(let k=0;k<3;k++)S.sched.push({at:k*.35,fn:()=>{S.pr.push({x:h.x,y:rowY(r),vx:520,vy:0,dmg:22,r:8,pierce:1,hit:new Set(),life:3,col:'#7be08a',arrow:1})}});
   break;
  case'healer':
   h.hp=Math.min(h.max,h.hp+h.max*.5);for(const b of S.b)b.hp=Math.min(b.max,b.hp+b.max*.4);S.boost=6;
   for(let i=0;i<14;i++)S.fx.push({k:'emoji',e:'🧁',x:rnd(140,830),y:rnd(60,100),vy:rnd(120,200),t:2});
   S.fx.push({k:'float',x:h.x,y:h.y-40,s:'Cupcake rain! 💖',t:1.5,col:'#ffb3dc'});
   break;
  case'rogue':{
   let t=S.en.filter(e=>e.boss)[0];if(!t){t=S.en.slice().sort((a,b)=>b.hp-a.hp)[0]}
   if(!t){h.spCd=0;return}
   S.fx.push({k:'ring',x:h.x,y:h.y,r:5,mr:50,t:.4,col:'#8a7bd8'});
   h.x=Math.min(940,t.x+t.r+18);h.y=t.y;h.tx=h.x;h.ty=h.y;
   hurt(t,t.boss?240:160,null);S.fx.push({k:'float',x:t.x,y:t.y-30,s:'CRIT BACKSTAB!',t:1.2,col:'#ff5a8a'});
   S.fx.push({k:'ring',x:t.x,y:t.y,r:5,mr:60,t:.4,col:'#fff'});break;}
  case'goddess':
   S.freeze=4;for(const l of S.lost){if(!S.b.find(b=>b.c===l.c&&b.r===l.r))S.b.push({type:l.type,c:l.c,r:l.r,hp:BDEF[l.type].hp*.6,max:BDEF[l.type].hp,cd:0,tm:3,dis:0,sh:0,kills:0,lvl:1})}
   S.lost=[];h.hp=h.max;
   for(const b of S.b)b.hp=Math.min(b.max,b.hp+b.max*.3);
   S.fx.push({k:'ring',x:h.x,y:h.y,r:10,mr:500,t:1,col:'#fff3a0'});
   S.fx.push({k:'float',x:480,y:300,s:'⏸ TIME STOPPED',t:2,col:'#fff3a0'});
   break;
 }
}
function boom(x,y,r,dmg,col){
 S.fx.push({k:'ring',x,y,r:5,mr:r,t:.4,col});sfx.boom();
 for(let i=0;i<10;i++)S.fx.push({k:'p',x,y,vx:rnd(-150,150),vy:rnd(-150,150),t:.5,col,r:3});
 for(const e of S.en.slice())if(dist(e.x,e.y,x,y)<r+e.r)hurt(e,dmg,null);
}
function hurt(e,d,src){
 if(e.hp<=0)return;
 e.hp-=d*e.armor;e.flash=.1;sfx.hit();if(src)e.last=src;
 if(e.hp<=0){
  S.fx.push({k:'float',x:e.x,y:e.y-20,s:e.rew?'+'+e.rew+'🐟':'poof!',t:1,col:'#ffe36e'});S.fish+=e.rew;
  for(let i=0;i<8;i++)S.fx.push({k:'p',x:e.x,y:e.y,vx:rnd(-100,100),vy:rnd(-100,100),t:.6,col:e.col,r:4});
  if(e.last&&e.last.type==='warrior'){e.last.kills++;e.last.lvl=1+Math.floor(e.last.kills/4)}
  S.en.splice(S.en.indexOf(e),1);sfx.poof();killCombo(e);
 }
}

/* ---------- Input ---------- */
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointermove',e=>{const p=pos(e);S.mx=p.x;S.my=p.y});
cv.addEventListener('pointerdown',e=>{
 const p=pos(e);S.mx=p.x;S.my=p.y;
 if(S.phase==='day')dayClick(p);
 else if(S.phase==='night'){if(collect(p))return;if(S.h){S.h.tx=Math.max(20,Math.min(940,p.x));S.h.ty=Math.max(95,Math.min(480,p.y))}}
});
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();if(S.phase==='night')cast()}if(['arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function collect(p){
 for(let i=S.dr.length-1;i>=0;i--){const d=S.dr[i];if(dist(p.x,p.y,d.x,d.y)<30){pick(d,i);return true}}
 return false;
}
function pick(d,i){
 if(d.type==='fish')S.fish+=d.v;else S.cat+=d.v;
 S.fx.push({k:'float',x:d.x,y:d.y-10,s:'+'+d.v+(d.type==='fish'?'🐟':'🌿'),t:.9,col:d.type==='fish'?'#9fe3ff':'#a8ff9a'});
 S.dr.splice(i,1);sfx.coin();
}
function dayClick(p){
 if(collect(p))return;
 for(const c of S.cit){if(Math.abs(p.x-c.x)<28&&Math.abs(p.y-c.y)<36){talk(c);return}}
 const c=Math.floor((p.x-GX)/CW),r=Math.floor((p.y-GY)/RH);
 if(c<0||c>=COLS||r<0||r>=ROWS||p.x<GX)return;
 const ex=S.b.find(b=>b.c===c&&b.r===r);
 if(S.sel==='remove'){if(ex){S.fish+=Math.floor(BDEF[ex.type].fish/2);S.b.splice(S.b.indexOf(ex),1);beep(300)}return}
 if(ex)return;
 const d=BDEF[S.sel];if(!d)return;
 if(S.fish<d.fish||S.cat<d.cat){S.fx.push({k:'float',x:p.x,y:p.y,s:'Not enough!',t:1,col:'#ff7a7a'});beep(150);return}
 S.fish-=d.fish;S.cat-=d.cat;
 S.b.push({type:S.sel,c,r,hp:d.hp,max:d.hp,cd:rnd(0,1),tm:rnd(3,6),dis:0,sh:0,kills:0,lvl:1});sfx.pop();
}
function talk(c){
 if(c.talked){c.say='Meow! (I already gave you a gift!)';c.st=2;return}
 c.talked=true;c.say=CITLINES[ri(CITLINES.length)];c.st=3.5;
 if(Math.random()<.65){const v=15+ri(20);S.fish+=v;S.fx.push({k:'float',x:c.x,y:c.y-50,s:'+'+v+'🐟',t:1.2,col:'#9fe3ff'})}
 else{const v=1+ri(2);S.cat+=v;S.fx.push({k:'float',x:c.x,y:c.y-50,s:'+'+v+'🌿',t:1.2,col:'#a8ff9a'})}
 sfx.meow(1.2);
}

/* ---------- Update ---------- */
function update(dt){
 S.t+=dt;if(S.comboT>0)S.comboT-=dt;
 if(S.banner){S.banner.t-=dt;if(S.banner.t<=0)S.banner=null}
 for(let i=S.dr.length-1;i>=0;i--){const d=S.dr[i];if(d.y<d.ty)d.y=Math.min(d.ty,d.y+130*dt);d.life-=dt;if(d.life<=0)S.dr.splice(i,1)}
 for(let i=S.fx.length-1;i>=0;i--){const f=S.fx[i];f.t-=dt;
  if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt}
  else if(f.k==='float')f.y-=28*dt;
  else if(f.k==='emoji')f.y+=f.vy*dt;
  else if(f.k==='ring')f.r+=(f.mr-f.r)*Math.min(1,dt*7);
  if(f.t<=0)S.fx.splice(i,1)}
 if(S.phase==='day')updateDay(dt);
 else if(S.phase==='night')updateNight(dt);
}
function farmTick(dt){
 for(const b of S.b){if(b.dis>0)b.dis-=dt;if(b.sh>0)b.sh-=dt;
  if(b.type==='farm'&&b.dis<=0){b.tm-=dt;if(b.tm<=0){b.tm=7;S.dr.push({x:colX(b.c),y:rowY(b.r)-10,ty:rowY(b.r)-10,type:'cat',v:1,life:14})}}}
}
function updateDay(dt){
 S.day.t-=dt;
 if(S.day.t>0){S.day.sky-=dt;if(S.day.sky<=0){S.day.sky=2.2;S.dr.push({x:rnd(150,900),y:-10,ty:rnd(110,470),type:'fish',v:10,life:14})}}
 farmTick(dt);
 for(const c of S.cit){c.x+=c.dir*28*dt;if(c.x<150){c.x=150;c.dir=1}if(c.x>920){c.x=920;c.dir=-1}if(Math.random()<.004)c.dir*=-1;if(c.st>0)c.st-=dt}
}
function updateNight(dt){
 S.nt+=dt;const fr=S.freeze>0;if(fr)S.freeze-=dt;if(S.boost>0)S.boost-=dt;
 for(let i=S.sched.length-1;i>=0;i--){const s=S.sched[i];s.at-=dt;if(s.at<=0){S.sched.splice(i,1);s.fn()}}
 if(!fr){while(S.q.length&&S.q[0].at<=S.nt){const q=S.q.shift();addEnemy(q.type,q.row)}}
 if(S.q.length===0){
  const ready=S.en.length===0||(S.nt-S.waveStart>40&&S.wave<S.waves.length-1);
  if(ready){
   if(S.wave<S.waves.length-1){if(!S.nextAt)S.nextAt=S.nt+2.5;if(S.nt>=S.nextAt){S.nextAt=0;startWave(S.wave+1)}}
   else if(S.en.length===0&&S.phase==='night'){winNight();return}
  }
 }
 S.gold=(S.gold||12)-dt;if(S.gold<=0){S.gold=rnd(10,16);S.dr.push({x:rnd(200,900),y:-10,ty:rnd(120,470),type:'fish',v:25,life:12,gold:1})}
 farmTick(dt);
 const h=S.h;
 /* hero */
 const hd=HERO[S.heroType];
 if(h.spCd>0)h.spCd-=dt;if(h.shield>0)h.shield-=dt;
 if(h.down>0){h.down-=dt;if(h.down<=0){h.hp=h.max;h.x=150;h.y=rowY(2);h.tx=h.x;h.ty=h.y;h.shield=2}}
 else{
  let mx=0,my=0;
  if(keys['a']||keys['arrowleft'])mx-=1;if(keys['d']||keys['arrowright'])mx+=1;
  if(keys['w']||keys['arrowup'])my-=1;if(keys['s']||keys['arrowdown'])my+=1;
  if(mx||my){const l=Math.hypot(mx,my);h.x+=mx/l*hd.spd*dt;h.y+=my/l*hd.spd*dt;h.tx=h.x;h.ty=h.y}
  else{const dx=h.tx-h.x,dy=h.ty-h.y,l=Math.hypot(dx,dy);if(l>4){const s=Math.min(l,hd.spd*dt);h.x+=dx/l*s;h.y+=dy/l*s}}
  h.x=Math.max(20,Math.min(940,h.x));h.y=Math.max(95,Math.min(480,h.y));
  for(let i=S.dr.length-1;i>=0;i--)if(dist(h.x,h.y,S.dr[i].x,S.dr[i].y)<32)pick(S.dr[i],i);
  h.cd-=dt;
  if(h.cd<=0&&S.en.length){
   let t=null,bd=1e9;for(const e of S.en){const d=dist(h.x,h.y,e.x,e.y);if(d<bd){bd=d;t=e}}
   if(t&&bd<=hd.rng+t.r){h.cd=hd.cd;h.face=t.x>=h.x?1:-1;heroAttack(t,hd)}
  }
 }
 /* buildings */
 for(const b of S.b){
  if(b.dis>0)continue;
  const bx=colX(b.c),by=rowY(b.r);
  if(b.type==='cannon'){
   b.cd-=dt*(S.boost>0?1.7:1);
   if(b.cd<=0&&S.en.some(e=>e.row===b.r&&e.x>bx&&e.x<970)){b.cd=1.1;S.pr.push({x:bx+22,y:by,vx:440,vy:0,dmg:12,r:8,row:b.r,hit:new Set(),life:3,col:'#ffa94d',fish:1,src:b});sfx.pew()}
  }else if(b.type==='warrior'){
   b.cd-=dt*(S.boost>0?1.5:1);
   if(b.cd<=0){const t=S.en.find(e=>e.row===b.r&&Math.abs(e.x-bx)<CW*1.15);if(t){b.cd=.6;hurt(t,8+b.lvl*3,b);S.fx.push({k:'p',x:t.x,y:t.y,vx:rnd(-60,60),vy:rnd(-60,60),t:.25,col:'#fff',r:3})}}
  }
 }
 /* projectiles */
 for(let i=S.pr.length-1;i>=0;i--){
  const p=S.pr[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;let dead=p.life<=0||p.x>1000||p.x<-20||p.y<60||p.y>540;
  if(!dead)for(const e of S.en.slice()){
   if(p.hit.has(e))continue;
   const ok=p.fish?(e.row===p.row&&Math.abs(p.x-e.x)<e.r+p.r):(dist(p.x,p.y,e.x,e.y)<e.r+p.r);
   if(ok){p.hit.add(e);hurt(e,p.dmg,p.src||null);if(!p.pierce){dead=true;break}}
  }
  if(dead)S.pr.splice(i,1);
 }
 /* black holes */
 for(let i=S.holes.length-1;i>=0;i--){const o=S.holes[i];o.t-=dt;
  for(const e of S.en){if(Math.abs(e.y-o.y)<170&&Math.abs(e.x-o.x)<300){e.x+=(o.x-e.x)*Math.min(1,dt*1.8)}if(dist(e.x,e.y,o.x,o.y)<60)hurt(e,18*dt,null)}
  if(o.t<=0)S.holes.splice(i,1)}
 /* lava */
 for(let i=S.lava.length-1;i>=0;i--){const l=S.lava[i];l.t-=dt;
  if(h.down<=0&&dist(h.x,h.y,l.x,l.y)<30&&h.shield<=0)h.hp-=12*dt;
  for(const b of S.b)if(b.type==='warrior'&&b.r===Math.floor((l.y-GY)/RH)&&Math.abs(colX(b.c)-l.x)<CW/2)b.hp-=6*dt;
  if(l.t<=0)S.lava.splice(i,1)}
 /* enemies */
 for(const e of S.en.slice()){
  if(e.flash>0)e.flash-=dt;e.t+=dt*6;
  if(fr)continue;
  if(e.stun>0){e.stun-=dt;continue}
  let sp=e.spd;
  const col=Math.floor((e.x-GX)/CW);
  const tr=S.b.find(b=>b.type==='trap'&&b.r===e.row&&b.c===col);
  if(tr&&!e.noslow){sp*=.4;e.hp-=3*dt;if(e.hp<=0){hurt(e,0.01,null)}}
  if(e.hp<=0)continue;
  e.dmgEff=e.dmg;
  /* boss behaviours */
  if(e.type==='michi'){
   if(e.st==='run'){e.x-=sp*dt;if(e.x<GX+10){if(e.steals<3){const v=Math.min(S.fish,30+ri(30));S.fish-=v;e.steals++;e.st='flee';S.fx.push({k:'float',x:e.x+30,y:e.y-30,s:'-'+v+'🐟 STOLEN!',t:1.6,col:'#ff7a7a'});sfx.steal()}else{S.castle-=e.dmg*dt*1.5}}}
   else{e.x+=sp*dt*.9;if(e.x>990){e.st='run';e.row=ri(ROWS);e.y=rowY(e.row)}}
   e.y+=(rowY(e.row)-e.y)*.2;
   if(S.castle<=0){loseNight();return}
   continue;
  }
  if(e.type==='sylva'){e.tm-=dt;if(e.tm<=0){e.tm=.45;S.lava.push({x:e.x,y:e.y+10,t:5})}}
  if(e.type==='ein'){e.tm-=dt;if(e.tm<=0){e.tm=7;for(let k=0;k<2;k++){const r=Math.max(0,Math.min(ROWS-1,e.row+k*2-1));addEnemy('shadow',r,e.x+20,rowY(r))}S.fx.push({k:'float',x:e.x,y:e.y-50,s:'AWOOOO!',t:1.3,col:'#ff9a9a'});sfx.howl()}}
  if(e.type==='zane'){
   e.tm-=dt;
   if(e.st==='run'&&e.x<640)e.st='cast';
   if(e.st==='cast'){
    e.cdt=(e.cdt||0)+dt;
    if(e.tm<=0){e.tm=4;const ts=S.b.filter(b=>(b.type==='cannon'||b.type==='farm')&&b.dis<=0);if(ts.length){const t=ts[ri(ts.length)];t.dis=5;S.fx.push({k:'beam',x1:e.x,y1:e.y,x2:colX(t.c),y2:rowY(t.r),t:.4,col:'#9a6bff'});S.fx.push({k:'float',x:colX(t.c),y:rowY(t.r)-25,s:'DISABLED!',t:1.2,col:'#c9a8ff'});sfx.zap()}}
    if(e.cdt>22)e.st='run';
    e.y+=(rowY(e.row)-e.y)*.1;continue;
   }
  }
  /* normal move/attack */
  let blocker=null;
  for(const b of S.b){if(b.r!==e.row||b.type==='trap')continue;const L=GX+b.c*CW,R=L+CW;if(e.x-e.r<R&&e.x>L+10){blocker=b;break}}
  if(blocker){
   blocker.hp-=e.dmgEff*dt*(blocker.sh>0?.3:1);
   if(Math.random()<dt*4)S.fx.push({k:'p',x:e.x-e.r,y:e.y,vx:rnd(-60,0),vy:rnd(-40,40),t:.3,col:'#ffd45e',r:3});
   if(blocker.hp<=0){S.b.splice(S.b.indexOf(blocker),1);if(blocker.type!=='trap')S.lost.push({type:blocker.type,c:blocker.c,r:blocker.r});S.fx.push({k:'float',x:colX(blocker.c),y:rowY(blocker.r),s:'💥',t:.8,col:'#fff'});sfx.crash()}
  }else if(e.x>GX-5){e.x-=sp*dt}
  else{S.castle-=e.dmgEff*.6*dt;if(Math.random()<dt*3)S.fx.push({k:'p',x:GX-10,y:e.y,vx:rnd(-40,40),vy:rnd(-40,0),t:.3,col:'#ff7a7a',r:3})}
  /* contact damage to hero */
  if(h.down<=0&&Math.abs(e.x-h.x)<e.r+14&&Math.abs(e.y-h.y)<e.r+16){h.hp-=e.dmgEff*.5*dt*(h.shield>0?.2:1)}
 }
 for(let i=S.b.length-1;i>=0;i--)if(S.b[i].hp<=0&&S.b[i].type!=='trap'){const b=S.b[i];S.b.splice(i,1);S.lost.push({type:b.type,c:b.c,r:b.r})}
 if(h.down<=0&&h.hp<=0){h.down=6;h.hp=0;S.fx.push({k:'float',x:h.x,y:h.y-30,s:'Hero down! Back in 6s',t:2,col:'#ff7a7a'})}
 if(S.castle<=0)loseNight();
}
function heroAttack(t,hd){
 const h=S.h,a=Math.atan2(t.y-h.y,t.x-h.x);
 switch(S.heroType){
  case'nebula':S.pr.push({x:h.x,y:h.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,dmg:hd.dmg,r:10,hit:new Set(),life:1.5,col:'#c9a8ff',orb:1});beep(800,.05,'sine');break;
  case'ranger':for(let k=-1;k<=1;k++){const aa=a+k*.14;S.pr.push({x:h.x,y:h.y,vx:Math.cos(aa)*560,vy:Math.sin(aa)*560,dmg:hd.dmg,r:6,pierce:1,hit:new Set(),life:1.4,col:'#7be08a',arrow:1,ang:aa})}beep(900,.04,'triangle');break;
  case'healer':S.pr.push({x:h.x,y:h.y,vx:Math.cos(a)*380,vy:Math.sin(a)*380,dmg:hd.dmg,r:9,hit:new Set(),life:1.3,col:'#ff9ed0',orb:1});break;
  case'goddess':S.pr.push({x:h.x,y:h.y,vx:Math.cos(a)*440,vy:Math.sin(a)*440,dmg:hd.dmg,r:10,hit:new Set(),life:1.4,col:'#fff3a0',orb:1});break;
  case'knight':case'rogue':
   S.fx.push({k:'ring',x:h.x+h.face*20,y:h.y,r:5,mr:hd.rng*.7,t:.2,col:hd.col});
   for(const e of S.en.slice())if(dist(e.x,e.y,h.x,h.y)<hd.rng+e.r)hurt(e,hd.dmg,null);
   beep(300,.05,'sawtooth');break;
 }
}

/* ---------- Render ---------- */
const CLOUDS=Array.from({length:7},(_,i)=>({x:i*150+rnd(0,60),y:rnd(4,48),s:rnd(.6,1.1),v:rnd(5,12)}));
const FLOWERS=Array.from({length:110},()=>({x:rnd(0,W),y:rnd(110,552),c:['#ff9ec7','#fff3a0','#d9c7ff','#ffffff','#ffb27a'][ri(5)],s:rnd(3,5.5),p:rnd(0,6)}));
const BFLY=Array.from({length:4},(_,i)=>({x:rnd(200,800),y:rnd(150,440),p:rnd(0,6),c:['#ff9ec7','#9ed0ff','#ffe36e','#c9a8ff'][i]}));
const STARS=Array.from({length:50},()=>({x:rnd(0,W),y:rnd(2,70),p:rnd(0,6)}));
const FIRE=Array.from({length:16},()=>({x:rnd(0,W),y:rnd(130,540),p:rnd(0,6)}));
function cloud(x,y,s){
 ctx.fillStyle='rgba(255,255,255,.92)';
 for(const [dx,dy,r] of [[0,0,16],[22,-9,22],[48,0,18],[24,6,20]]){ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,r*s,0,7);ctx.fill()}
 rr(x-14*s,y-2*s,74*s,20*s,10*s,'rgba(255,255,255,.92)');
}
function drawBackground(night){
 const g=ctx.createLinearGradient(0,0,0,100);
 if(night){g.addColorStop(0,'#4a46a8');g.addColorStop(.7,'#9a7bd6');g.addColorStop(1,'#ffc2e0')}
 else{g.addColorStop(0,'#4fbfff');g.addColorStop(.7,'#9fe0ff');g.addColorStop(1,'#dff6ff')}
 ctx.fillStyle=g;ctx.fillRect(0,0,W,110);
 if(night){
  for(const s of STARS){ctx.globalAlpha=.4+.6*Math.abs(Math.sin(S.t+s.p));star5(s.x,s.y,2.5,'#fff')}ctx.globalAlpha=1;
  ell(870,40,24,24,'#fff7cf');ell(862,34,5,5,'#f1e6ae');ell(879,47,4,4,'#f1e6ae');
 }else{
  ctx.strokeStyle='#fff3a0';ctx.lineWidth=3;ctx.globalAlpha=.7;
  for(let i=0;i<12;i++){const a=i*Math.PI/6+S.t*.2;ctx.beginPath();ctx.moveTo(880+Math.cos(a)*34,38+Math.sin(a)*34);ctx.lineTo(880+Math.cos(a)*46,38+Math.sin(a)*46);ctx.stroke()}
  ctx.globalAlpha=1;ell(880,38,28,28,'#fff3a0');ell(880,38,20,20,'#ffe36e');
  ctx.globalAlpha=.3;const cols=['#ff7a9a','#ffb27a','#ffe36e','#9be37a','#7ac8ff','#b79aff'];
  cols.forEach((c,i)=>{ctx.strokeStyle=c;ctx.lineWidth=7;ctx.beginPath();ctx.arc(640,130,150-i*7,Math.PI,0);ctx.stroke()});ctx.globalAlpha=1;
 }
 for(const c of CLOUDS){c.x+=c.v*.016;if(c.x>W+80)c.x=-100;if(night)ctx.globalAlpha=.55;cloud(c.x,c.y+14,c.s);ctx.globalAlpha=1}
 ell(120,100,280,40,night?'#6dbf86':'#86dc78');ell(520,104,340,44,night?'#62b57d':'#76d36c');ell(900,100,280,40,night?'#6dbf86':'#8de07f');
 const gg=ctx.createLinearGradient(0,84,0,H);
 if(night){gg.addColorStop(0,'#7ccf8c');gg.addColorStop(1,'#5aa876')}else{gg.addColorStop(0,'#a9ec8a');gg.addColorStop(1,'#7bd16b')}
 ctx.fillStyle=gg;ctx.fillRect(0,84,W,H-84);
 for(const f of FLOWERS){
  const sw=Math.sin(S.t*1.5+f.p)*1;
  ctx.fillStyle=f.c;for(let i=0;i<4;i++){const a=i*Math.PI/2+.4;ctx.beginPath();ctx.arc(f.x+Math.cos(a)*f.s*.7+sw,f.y+Math.sin(a)*f.s*.7,f.s*.55,0,7);ctx.fill()}
  ell(f.x+sw,f.y,f.s*.4,f.s*.4,'#ffd45e');
 }
}
function drawCritters(night){
 if(night){for(const f of FIRE){const x=f.x+Math.sin(S.t*.7+f.p)*30,y=f.y+Math.cos(S.t*.9+f.p)*20;ctx.globalAlpha=.35+.5*Math.abs(Math.sin(S.t*2+f.p));ell(x,y,6,6,'rgba(255,240,140,.35)');ell(x,y,2.4,2.4,'#fff8b0');ctx.globalAlpha=1}}
 else for(const b of BFLY){
  const x=b.x+Math.sin(S.t*.5+b.p)*140,y=b.y+Math.cos(S.t*.8+b.p)*40,fl=Math.abs(Math.sin(S.t*9+b.p));
  ell(x-4,y,5,8*fl+2,b.c);ell(x+4,y,5,8*fl+2,b.c);ell(x,y,1.5,5,'#5a2d7a');
 }
}
function face(x,y,s){
 ell(x-s*.35,y,s*.12,s*.16,'#3a2150');ell(x+s*.35,y,s*.12,s*.16,'#3a2150');
 ell(x-s*.35-1,y-1,1.6,1.6,'#fff');ell(x+s*.35-1,y-1,1.6,1.6,'#fff');
 ell(x-s*.7,y+s*.2,s*.14,s*.08,'rgba(255,100,150,.6)');ell(x+s*.7,y+s*.2,s*.14,s*.08,'rgba(255,100,150,.6)');
 ctx.strokeStyle='#6b3b55';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y+s*.1,s*.12,.2,Math.PI-.2);ctx.stroke();
}
function drawBuilding(b){
 const x=colX(b.c),y=rowY(b.r),bob=Math.sin(S.t*3+b.c+b.r)*1.2;
 if(b.type==='trap'){ell(x,y+12,28,14,'#ffc2e0');ell(x,y+10,22,10,'#ffe3f2');txt('🐾',x,y+10,18);return}
 ell(x,y+30,28,7,'rgba(0,0,0,.15)');
 if(b.type==='warrior'){drawCat(x,y+2,16,'#ffd9a8',{hat:'helmet',bob:bob,t:S.t*3});txt('⚔️',x+22,y+14,16);txt('Lv'+b.lvl,x,y-38,11,'#fff','center','#b0306e')}
 else if(b.type==='cannon'){rr(x-26,y-2,52,28,12,'#ffb3d9');rr(x-8,y-16,44,18,9,'#ff8fc7');ell(x+36,y-7,7,9,'#7a3d6a');ell(x-18,y+25,8,8,'#8a5a8a');ell(x+16,y+25,8,8,'#8a5a8a');face(x-6,y+12,12);txt('🐟',x+8,y-8,14)}
 else if(b.type==='farm'){rr(x-20,y+2,40,24,9,'#ffb87a');txt('🌿',x,y-8+bob,32);face(x,y+14,10)}
 else if(b.type==='wall'){ell(x,y+4,27,27,'#ff9ec7');ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.globalAlpha=.6;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x-4+i*3,y+4,10+i*5,-1+i*.5,1.6+i*.3);ctx.stroke()}ctx.globalAlpha=1;face(x,y+6,18)}
 if(b.dis>0){rr(x-30,y-32,60,64,12,'rgba(40,10,70,.55)');txt('⚡',x,y,26)}
 if(b.sh>0){ctx.strokeStyle='#ffd45e';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x-31,y-33,62,66,14);ctx.stroke()}
 if(b.hp<b.max){rr(x-24,y+30,48,6,3,'rgba(255,255,255,.7)');rr(x-24,y+30,48*Math.max(0,b.hp/b.max),6,3,'#ff6b9a')}
}
function drawHero(){
 const h=S.h;if(!h||h.down>0)return;const hd=HERO[S.heroType];
 ell(h.x,h.y+32,16,5,'rgba(0,0,0,.2)');
 ctx.save();ctx.globalAlpha=.28+.08*Math.sin(S.t*4);ell(h.x,h.y+8,28,30,hd.col);ctx.restore();
 drawHuman(h.x,h.y-6,14,av,{bob:Math.sin(S.t*8)*1.2,flip:h.face<0});
 txt(hd.ico,h.x+(h.face>=0?24:-24),h.y+8,22);
 txt(av.name,h.x,h.y-40,12,'#fff','center','#b0306e');
 rr(h.x-22,h.y-34,44,6,3,'rgba(255,255,255,.7)');rr(h.x-22,h.y-34,44*Math.max(0,h.hp/h.max),6,3,'#6fdc8a');
 if(h.shield>0){ctx.strokeStyle='#ffd45e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(h.x,h.y+6,32,0,7);ctx.stroke()}
}
function drawEnemy(e){
 ell(e.x,e.y+e.r*1.2,e.r*1.1,e.r*.28,'rgba(0,0,0,.18)');
 drawMonster(e.type,e.x,e.y,e.r,e.col,e.t,e.flash>0);
 if(e.boss)txt(EDEF[e.type].n.split(' ')[0],e.x,e.y-e.r*1.8-4,12,'#fff','center','#7a2e8a');
 if(e.stun>0)txt('💫',e.x,e.y-e.r*1.6-14,18);
 const bw=e.boss?64:36,by=e.y+e.r*1.4;
 rr(e.x-bw/2,by,bw,6,3,'rgba(255,255,255,.7)');rr(e.x-bw/2,by,bw*Math.max(0,e.hp/e.max),6,3,e.boss?'#ff4a7a':'#ff8fb0');
}
function drawCastle(){
 rr(4,84,GX-12,H-84,12,'#ffc9e3');
 ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;
 for(let y=110;y<H;y+=26){ctx.beginPath();ctx.moveTo(4,y);ctx.lineTo(GX-8,y);ctx.stroke()}
 for(const tx of[8,50,90]){
  rr(tx,64,26,44,7,'#ffb3d9');
  ctx.fillStyle='#7fc8ff';ctx.beginPath();ctx.moveTo(tx-4,66);ctx.lineTo(tx+13,30);ctx.lineTo(tx+30,66);ctx.closePath();ctx.fill();
  txt('🚩',tx+14,26,13);
 }
 for(let r=0;r<ROWS;r++)rr(34,GY+r*RH+12,52,54,24,'#eb9cc5');
 txt('💖',22,126,14);txt('💖',100,300,14);txt('💖',22,430,14);
 const py=rowY(2)-6;
 ell(62,py+34,22,6,'rgba(0,0,0,.15)');
 drawCat(62,py,18,'#fff4fa',{hat:'crown',bob:Math.sin(S.t*2)*1.5,t:S.t*2});
 txt(N.princess,62,py+48,10,'#fff','center','#b0306e');
 txt('🏰',62,H-24,30);
}
function drawDrop(d){
 const bob=Math.sin(S.t*4+d.x)*3;
 if(d.gold){ctx.globalAlpha=.5+.3*Math.sin(S.t*6);ell(d.x,d.y+bob,26,26,'#fff3a0');ctx.globalAlpha=1}
 txt(d.type==='fish'?(d.gold?'🐠':'🐟'):'🌿',d.x,d.y+bob,d.gold?32:26);
 ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(d.x,d.y+bob,18,0,7);ctx.stroke();
}
function pill(x,y,w,h){rr(x,y,w,h,h/2,'rgba(255,255,255,.82)')}
function draw(){
 const night=S.phase==='night'||S.phase==='won'||S.phase==='lost';
 drawBackground(night);
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){rr(GX+c*CW+2,GY+r*RH+2,CW-4,RH-4,12,(r+c)%2?'rgba(255,255,255,.22)':'rgba(60,170,90,.14)')}
 if(S.phase==='day'&&S.sel){const c=Math.floor((S.mx-GX)/CW),r=Math.floor((S.my-GY)/RH);if(c>=0&&c<COLS&&r>=0&&r<ROWS){rr(GX+c*CW+2,GY+r*RH+2,CW-4,RH-4,12,'rgba(255,240,120,.5)');if(S.sel!=='remove')txt(BDEF[S.sel].e,colX(c),rowY(r),28)}}
 drawCritters(night);
 drawCastle();
 for(const l of S.lava){ctx.globalAlpha=Math.min(1,l.t/1.5);ell(l.x,l.y,24,12,'#ff7a3f');ell(l.x,l.y,14,6,'#ffd45e');ctx.globalAlpha=1}
 for(const o of S.holes){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(S.t*5);ell(0,0,34,34,'rgba(60,20,110,.85)');ctx.strokeStyle='#d9b8ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,40,0,4);ctx.stroke();ctx.restore()}
 for(const b of S.b)drawBuilding(b);
 const units=[];for(const e of S.en)units.push([e.y,()=>drawEnemy(e)]);
 if(S.phase==='night')units.push([S.h?S.h.y:0,drawHero]);
 if(S.phase==='day')for(const c of S.cit)units.push([c.y,()=>{drawCat(c.x,c.y,15,c.col,{hat:c.hat,flip:c.dir<0,bob:Math.sin(S.t*5+c.x)*1.5,t:S.t*4});if(!c.talked)txt('💬',c.x,c.y-36,16);if(c.st>0)bubble(c)}]);
 units.sort((a,b)=>a[0]-b[0]);for(const u of units)u[1]();
 for(const p of S.pr){
  if(p.arrow){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang||0);ctx.fillStyle=p.col;ctx.fillRect(-14,-2,28,4);ctx.beginPath();ctx.moveTo(14,-6);ctx.lineTo(22,0);ctx.lineTo(14,6);ctx.fill();ctx.restore()}
  else if(p.orb){ell(p.x,p.y,p.r+3,p.r+3,'rgba(255,255,255,.4)');ell(p.x,p.y,p.r,p.r,p.col);ell(p.x,p.y,p.r*.5,p.r*.5,'#fff')}
  else txt('🐟',p.x,p.y,20);
 }
 for(const d of S.dr)drawDrop(d);
 for(const f of S.fx){
  if(f.k==='p'){ctx.globalAlpha=Math.max(0,f.t*2);ell(f.x,f.y,f.r,f.r,f.col);ctx.globalAlpha=1}
  else if(f.k==='float'){ctx.globalAlpha=Math.min(1,f.t*1.5);txt(f.s,f.x,f.y,18,f.col,'center','#5a2d7a');ctx.globalAlpha=1}
  else if(f.k==='emoji')txt(f.e,f.x,f.y,24);
  else if(f.k==='ring'){ctx.globalAlpha=Math.max(0,f.t*2);ctx.strokeStyle=f.col;ctx.lineWidth=5;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.stroke();ctx.globalAlpha=1}
  else if(f.k==='beam'){ctx.strokeStyle=f.col;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke()}
 }
 if(night){ctx.fillStyle='rgba(70,40,130,.13)';ctx.fillRect(0,84,W,H-84)}
 if(S.freeze>0){ctx.fillStyle='rgba(170,210,255,.3)';ctx.fillRect(0,0,W,H)}
 /* HUD */
 pill(8,8,112,30);txt('🐟 '+Math.floor(S.fish),64,24,19,'#2a7aa8','center');
 pill(126,8,84,30);txt('🌿 '+S.cat,168,24,19,'#2f8f3a','center');
 pill(220,6,500,44);
 txt(CHAPTERS[S.ch].name,470,19,15,'#b0306e','center');
 const sub=S.phase==='day'?'☀️ Day — build & collect! ('+Math.max(0,Math.ceil(S.day.t))+'s of fish rain)':night?'🌙 Dusk — Wave '+Math.max(1,S.wave+1)+'/'+(S.waves?S.waves.length:3)+' • Monsters left: '+(S.en.length+S.q.length):'';
 txt(sub,470,37,13,'#5a2d7a','center');
 pill(730,8,222,30);txt('🏰',752,24,18);rr(770,17,170,14,7,'rgba(90,45,122,.25)');rr(770,17,170*Math.max(0,S.castle/100),14,7,S.castle>35?'#ff8fc7':'#ff4a6a');
 if(S.phase==='night'&&S.h){pill(8,44,120,26);txt(S.h.spCd>0?'⭐ '+Math.ceil(S.h.spCd)+'s':'⭐ READY!',68,57,14,S.h.spCd>0?'#8a6aa8':'#d9822b','center')}
 if(S.comboT>0&&S.combo>=2){ctx.globalAlpha=Math.min(1,S.comboT);txt('x'+S.combo+' combo!',480,84,24,'#ffe36e','center','#b0306e');ctx.globalAlpha=1}
 if(S.banner){ctx.globalAlpha=Math.min(1,S.banner.t);txt(S.banner.txt,480,290,40,'#fff','center','#b0306e');ctx.globalAlpha=1}
 if(S.freeze>0)txt('⏸ TIME STOPPED',480,130,28,'#fff3a0','center','#5a2d7a');
}
function bubble(c){
 ctx.font='bold 12px "Trebuchet MS",sans-serif';const w=Math.min(270,ctx.measureText(c.say).width+16);
 const x=Math.max(w/2+4,Math.min(W-w/2-4,c.x));
 rr(x-w/2,c.y-74,w,30,10,'#fff');txt(c.say.length>42?c.say.slice(0,40)+'…':c.say,x,c.y-59,11,'#5a2d7a','center');
}
/* ---------- Loop ---------- */
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(S.phase==='day'||S.phase==='night')update(dt);
 else if(S.phase==='won'||S.phase==='lost'){S.t+=dt;for(let i=S.fx.length-1;i>=0;i--){S.fx[i].t-=dt;if(S.fx[i].t<=0)S.fx.splice(i,1)}}
 else S.t+=dt;
 draw();
 if(S.phase==='night'&&S.h){const b=$('#bs');if(b){b.disabled=S.h.spCd>0||S.h.down>0;b.textContent=S.h.spCd>0?'⭐ '+Math.ceil(S.h.spCd)+'s':'⭐ '+HERO[S.heroType].spn}}
 requestAnimationFrame(loop);
}
function fit(){const st=$('#stage');const k=Math.min(st.clientWidth/W,st.clientHeight/H);if(k>0){cv.style.width=Math.floor(W*k)+'px';cv.style.height=Math.floor(H*k)+'px'}}
window.addEventListener('resize',fit);document.addEventListener('fullscreenchange',()=>setTimeout(fit,50));
new ResizeObserver(fit).observe($('#stage'));fit();
$('#fs').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}};
const _mb=$('#mute');
_mb.onclick=()=>{AUD.muted=!AUD.muted;ac();if(AUD.master)AUD.master.gain.value=AUD.muted?0:1;_mb.textContent=AUD.muted?'🔇':'🔊'};
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>startMusic(),{passive:true}));
showTitle();
requestAnimationFrame(loop);
</script>
