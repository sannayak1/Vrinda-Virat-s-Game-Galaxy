<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Legends of Algebra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Alegreya:ital,wght@0,500;1,500;1,700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: a night-sea world map; parchment cards float over it, one screen at a time, HUD pinned on top. */
:root{
  --deep:#081722; --night:#0e2233; --sea:#164a64; --foam:#a9cdd8;
  --parch:#f4e7c8; --parch2:#e6d2a3; --ink:#2a1f16; --ink2:#5b4a37;
  --gold:#e9b949; --gold-d:#a8781a; --rose:#e06c84; --leaf:#5fb98a; --bad:#cf4b45;
  --f-display:"Uncial Antiqua","Papyrus",Georgia,serif;
  --f-body:"Alegreya Sans","Trebuchet MS",system-ui,sans-serif;
  --f-math:"Alegreya",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--f-body);font-size:16px;color:var(--parch);
  background:radial-gradient(1200px 600px at 20% -10%,#1d5a74 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#123a52 0%,transparent 55%),var(--deep);
  background-attachment:fixed}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--ink2)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(8,23,34,.92);backdrop-filter:blur(6px);border-bottom:1px solid #24485c}
.hud-in{max-width:980px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hud .mini{width:40px;height:52px;flex:none}
.hud .who{min-width:0;flex:1 1 140px}
.hud .who b{display:block;font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .who span{font-size:13px;color:var(--foam)}
.stat{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{width:110px;height:12px;border-radius:6px;background:#2a3d49;overflow:hidden;border:1px solid #3b5666}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d94f5c,#f07d6a)}
.bar.xp i{background:linear-gradient(90deg,#4aa3c9,#8fd4e8)}
.coin{width:18px;height:18px}

/* Cards */
.card{background:var(--parch);color:var(--ink);border-radius:14px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 1px #d8c08a}
.card + .card{margin-top:16px}
.title-art{text-align:center;padding-block:18px 8px}
.title-art h1{font-size:clamp(34px,7vw,58px);color:var(--gold);line-height:1.05;text-shadow:0 3px 0 #5a3c0a}
.title-art p{color:var(--foam);max-width:52ch;margin:10px auto 0;line-height:1.5}

.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:800;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.btn.alt{background:#2b5d75;color:var(--parch);box-shadow:0 4px 0 #173a4c}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink2)}
.btn.rose{background:var(--rose);color:#fff;box-shadow:0 4px 0 #9b3a50}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Creator */
.creator{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:start}
.preview{background:radial-gradient(circle at 50% 40%,#fff6dc,#e9d3a0);border-radius:12px;padding:12px;display:flex;justify-content:center}
.preview svg{width:100%;max-width:220px;height:auto}
.opt{margin-bottom:14px}
.opt h3{font-family:var(--f-body);font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink2);margin-bottom:6px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #b9a274}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.chip{border:2px solid #c9b07a;background:#fbf3df;color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--parch);border-color:var(--ink)}
.chip:disabled{opacity:.5}
input[type=text]{font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:2px solid #c9b07a;background:#fffaf0;color:var(--ink);width:100%}

/* Village */
.scene{width:100%;height:auto;border-radius:12px;display:block}
.plot{cursor:pointer}
.plot:hover .plotbox{stroke:var(--gold)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.item{border:1px solid #d3bb85;border-radius:10px;padding:12px;background:#fbf2dc;display:flex;flex-direction:column;gap:6px}
.item b{font-size:16px}
.item small{color:var(--ink2);line-height:1.35}
.item .row{margin-top:auto;justify-content:space-between}
.built{color:#2f7d52;font-weight:800}
.friends{display:flex;gap:10px;flex-wrap:wrap}
.friend-tag{display:flex;align-items:center;gap:8px;background:#fbf2dc;border:1px solid #d3bb85;border-radius:999px;padding:4px 12px 4px 4px;font-weight:700}
.friend-tag svg{width:40px;height:40px}

/* Map */
.map{width:100%;height:auto;display:block;border-radius:14px}
.isle{cursor:pointer}
.isle.locked{cursor:not-allowed}
.isle:not(.locked):hover .isle-ring{stroke:var(--gold);stroke-width:4}
.isle-panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}

/* Battle */
.arena{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;background:linear-gradient(#1b4d63,#0f2c3c 70%,#3c5a37 70%,#2f4a2b);border-radius:14px;padding:16px 14px 10px;position:relative;overflow:hidden}
.fighter{width:42%;max-width:220px;text-align:center;position:relative}
.fighter svg{width:100%;height:auto;max-height:230px;overflow:visible}
.fighter .nm{font-weight:800;font-size:14px;margin-bottom:4px}
.fighter .bar{width:100%;margin-bottom:8px}
.mon-bar i{background:linear-gradient(90deg,#7ad08f,#b8e986)}
.vs{font-family:var(--f-display);color:var(--gold);font-size:22px;align-self:center}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--f-display);font-size:28px;pointer-events:none;animation:rise 1s forwards;text-shadow:0 2px 0 #000}
@keyframes rise{to{top:-5%;opacity:0}}

/* creature animation */
.cr .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,.975)}}
.cr .bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.cr .flapL{transform-box:fill-box;transform-origin:100% 75%;animation:flap .9s ease-in-out infinite}
@keyframes flap{50%{transform:rotate(14deg) scaleX(.86)}}
.cr .sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(7deg)}}
.cr .twinkle{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.4)}}
.cr .flick{transform-box:fill-box;transform-origin:50% 0;animation:flick .45s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(1.1) skewX(5deg)}}
.cr .pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.cr .rise{animation:drift 3s linear infinite}
@keyframes drift{from{transform:translateY(0);opacity:0}20%{opacity:1}to{transform:translateY(-60px);opacity:0}}
.cr .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.hurt{animation:hurt .5s}
@keyframes hurt{25%{filter:brightness(2.4) saturate(.3);transform:translateX(14px) rotate(4deg)}60%{transform:translateX(-4px)}}
.lunge{animation:lunge .5s}
@keyframes lunge{40%{transform:translateX(-36px) scale(1.08)}}
.bubble{position:absolute;right:4%;top:8px;max-width:58%;background:#fffaf0;color:var(--ink);font-weight:800;font-size:13.5px;line-height:1.3;padding:7px 11px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.25);z-index:2}
.bubble::after{content:"";position:absolute;bottom:-8px;right:30%;border:8px solid transparent;border-top-color:#fffaf0;border-bottom:0}
.arena{padding-top:56px}
@media (prefers-reduced-motion:reduce){.cr *,.hurt,.lunge{animation:none!important}}
@media (prefers-reduced-motion:reduce){.shake,.float{animation:none}.float{display:none}}
.qcard{text-align:center}
.eq{font-family:var(--f-math);font-size:clamp(26px,6vw,40px);line-height:1.35;margin:8px 0 14px;font-variant-numeric:lining-nums}
.eq i{font-style:italic;font-weight:700;color:#7a2f9e}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.1}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.answer{display:flex;gap:10px;max-width:420px;margin:0 auto}
.answer label{position:absolute;left:-9999px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:460px;margin:0 auto}
.choices .btn{font-family:var(--f-math);font-size:22px;background:#fbf2dc;box-shadow:0 4px 0 #c9b07a}
.tools{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap;font-size:14px}
.hintbox{background:#e3f1e6;border-left:4px solid var(--leaf);padding:10px 12px;border-radius:6px;margin-top:12px;text-align:left}
.explain{text-align:left}
.explain .you{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 10px;font-weight:700}
.explain .you span em{font-family:var(--f-math);font-style:normal;font-size:20px}
.oops{background:#fbe3df;border-left:4px solid var(--bad);padding:10px 12px;border-radius:6px;line-height:1.45}
.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px 10px;padding:8px 0;border-bottom:1px dashed #cdb787}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--parch);display:grid;place-items:center;font-weight:800;font-size:14px;grid-row:span 2}
.steps .m{font-family:var(--f-math);font-size:22px}
.steps .m i{font-style:italic;color:#7a2f9e;font-weight:700}
.correct-ans{background:#e2f2e7;border:2px solid var(--leaf);border-radius:10px;padding:10px 14px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.correct-ans .m{font-family:var(--f-math);font-size:24px}
.correct-ans .m i{font-style:italic;color:#7a2f9e}

/* Friend */
.friendview{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:start}
.friendview .art{background:radial-gradient(circle,#fff8e2,#ead6a6);border-radius:12px;padding:10px}
.friendview .art svg{width:100%;height:auto}
.lesson{background:#fbf2dc;border:1px solid #d3bb85;border-radius:10px;padding:14px;margin-top:12px}
.lesson .m{font-family:var(--f-math);font-size:21px}
.lesson .m i{font-style:italic;color:#7a2f9e;font-weight:700}
.banner{background:var(--gold);color:var(--ink);font-weight:800;border-radius:10px;padding:10px 14px;margin-top:12px}
p{line-height:1.5;max-width:65ch}
.muted{color:var(--ink2)}
@media (max-width:640px){
  .creator,.friendview{grid-template-columns:minmax(0,1fr)}
  .preview svg{max-width:170px}
  .friendview .art{max-width:200px;margin:0 auto}
  .isle-panel{grid-template-columns:minmax(0,1fr)}
  .bar{width:80px}
  .choices .btn{font-size:19px}
}
</style>

<div id="hud"></div>
<main class="wrap" id="app"></main>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];
const nz=(lo,hi,min=1)=>{let v;do{v=ri(lo,hi)}while(Math.abs(v)<min);return v};
const n=v=>v<0?'−'+(-v):''+v;
const term=b=>b===0?'':b>0?` + ${b}`:` − ${-b}`;
const xt=(a,v='x')=>a===1?v:a===-1?'−'+v:n(a)+v;
const xterm=a=>a===0?'':a>0?` + ${a===1?'':a}x`:` − ${a===-1?'':-a}x`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=s=>s.replace(/([xy])/g,'<i>$1</i>').replace(/\{([^|}]+)\|([^}]+)\}/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
function shade(hex,p){const h=hex.replace('#','');let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);const f=v=>Math.max(0,Math.min(255,Math.round(v+(p<0?v:255-v)*p/100)));return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
function mk(pairs,correct){const m={};for(const [v,msg] of pairs){if(Number.isFinite(v)&&Number.isInteger(v)&&v!==correct&&!(v in m))m[v]=msg}return m}

/* ---------- algebra generators ---------- */
const GEN={
 one(){const t=ri(0,3),x=ri(-9,15);
  if(t===0){const a=ri(2,20),b=x+a;return{eq:`x${term(a)} = ${n(b)}`,ans:x,hint:`Undo the + ${a}: subtract ${a} from both sides.`,
   steps:[[`Subtract ${a} from both sides to undo the + ${a}`,`x = ${n(b)} − ${a}`],[`Simplify`,`x = ${n(x)}`]],
   mistakes:mk([[b+a,`It looks like you added ${a}. The equation has + ${a}, so you undo it with the opposite operation: subtract ${a}.`]],x)}}
  if(t===1){const a=ri(2,20),b=x-a;return{eq:`x − ${a} = ${n(b)}`,ans:x,hint:`Undo the − ${a}: add ${a} to both sides.`,
   steps:[[`Add ${a} to both sides to undo the − ${a}`,`x = ${n(b)} + ${a}`],[`Simplify`,`x = ${n(x)}`]],
   mistakes:mk([[b-a,`It looks like you subtracted ${a} again. To undo − ${a}, do the opposite: add ${a} to both sides.`]],x)}}
  if(t===2){const a=nz(-9,9,2),b=a*x;return{eq:`${xt(a)} = ${n(b)}`,ans:x,hint:`${xt(a)} means ${n(a)} times x. Undo it by dividing by ${n(a)}.`,
   steps:[[`${xt(a)} means ${n(a)} × x, so divide both sides by ${n(a)}`,`x = ${n(b)} ÷ ${n(a)}`],[`Simplify (watch the signs)`,`x = ${n(x)}`]],
   mistakes:mk([[b*a,`You multiplied by ${n(a)}. Since x is already being multiplied by ${n(a)}, you need to divide.`],[b-a,`You subtracted ${n(a)}. The ${n(a)} is multiplied by x, not added, so divide instead.`],[-x,`So close! Check the sign. A ${(b<0)===(a<0)?'negative divided by a negative is positive':'positive divided by a negative (or the other way) is negative'}.`]],x)}}
  const a=ri(2,9),b=ri(-9,12),xx=a*b;return{eq:`{x|${a}} = ${n(b)}`,ans:xx,hint:`x is being divided by ${a}. Undo it by multiplying both sides by ${a}.`,
   steps:[[`x is divided by ${a}, so multiply both sides by ${a}`,`x = ${n(b)} × ${a}`],[`Simplify`,`x = ${n(xx)}`]],
   mistakes:mk([[b/a,`You divided again. To undo dividing by ${a}, do the opposite: multiply by ${a}.`],[b+a,`You added ${a}. The ${a} is dividing x, so multiply by ${a} instead.`]],xx)}},

 two(){const x=ri(-9,12);
  if(Math.random()<.7){const a=Math.random()<.25?-ri(2,9):ri(2,9),b=nz(-15,15),c=a*x+b;
   return{eq:`${xt(a)}${term(b)} = ${n(c)}`,ans:x,hint:`Two steps: first ${b>0?'subtract '+b:'add '+(-b)} on both sides, then divide by ${n(a)}.`,
    steps:[[b>0?`Subtract ${b} from both sides`:`Add ${-b} to both sides`,`${xt(a)} = ${n(c-b)}`],[`Divide both sides by ${n(a)}`,`x = ${n(c-b)} ÷ ${n(a)} = ${n(x)}`]],
    mistakes:mk([[(c+b)/a,`Check the sign when you moved the ${n(b)}. To undo ${b>0?'+ '+b:'− '+(-b)}, you ${b>0?'subtract':'add'} ${Math.abs(b)}.`],[c-b,`You were one step away! After getting ${xt(a)} = ${n(c-b)}, divide both sides by ${n(a)}.`],[c/a-b,`You divided before moving the ${n(b)}. That only works if you divide every term. It's safer to undo the + or − first.`],[-x,`Close! Your sign is flipped. Recheck the division: ${n(c-b)} ÷ ${n(a)}.`]],x)}}
  const a=ri(2,6),k=ri(-6,8),xx=a*k,b=nz(-10,10),c=k+b;
  return{eq:`{x|${a}}${term(b)} = ${n(c)}`,ans:xx,hint:`First ${b>0?'subtract '+b:'add '+(-b)}, then multiply by ${a}.`,
   steps:[[b>0?`Subtract ${b} from both sides`:`Add ${-b} to both sides`,`{x|${a}} = ${n(k)}`],[`Multiply both sides by ${a}`,`x = ${n(k)} × ${a} = ${n(xx)}`]],
   mistakes:mk([[k,`You were one step away! x is still divided by ${a}, so multiply both sides by ${a}.`],[a*(c+b),`Check the sign when you moved the ${n(b)}. Use the opposite operation.`],[(c-b)/a,`x is divided by ${a}, so you multiply by ${a} to undo it, not divide.`]],xx)}},

 peak(){const x=ri(-6,10);
  if(Math.random()<.5){const a=ri(2,6),b=nz(-8,8),c=a*(x+b);
   return{eq:`${a}(x${term(b)}) = ${n(c)}`,ans:x,hint:`Distribute: multiply ${a} by x AND by ${n(b)}. Or divide both sides by ${a} first.`,
    steps:[[`Distribute the ${a} to both terms in the parentheses`,`${a}x${term(a*b)} = ${n(c)}`],[a*b>0?`Subtract ${a*b} from both sides`:`Add ${-a*b} to both sides`,`${a}x = ${n(c-a*b)}`],[`Divide both sides by ${a}`,`x = ${n(x)}`]],
    mistakes:mk([[(c-b)/a,`You multiplied ${a} by x but not by ${n(b)}. The ${a} multiplies everything inside the parentheses: ${a}·x and ${a}·${n(b)} = ${n(a*b)}.`],[c/a+b,`Check the sign of the ${n(b)} when you moved it across.`],[(c+a*b)/a,`Check the sign when you moved the ${n(a*b)}. Use the opposite operation.`]],x)}}
  let a=ri(2,9),c=ri(1,8);while(c===a)c=ri(1,8);const b=ri(-10,10),d=(a-c)*x+b,k=a-c;
  return{eq:`${xt(a)}${term(b)} = ${xt(c)}${term(d)}`,ans:x,hint:`Gather the x terms on one side: subtract ${xt(c)} from both sides.`,
   steps:[[`Subtract ${xt(c)} from both sides to gather the x terms`,`${xt(k)}${term(b)} = ${n(d)}`],...(b?[[b>0?`Subtract ${b} from both sides`:`Add ${-b} to both sides`,`${xt(k)} = ${n(d-b)}`]]:[]),[k===1?`x is already alone`:`Divide both sides by ${n(k)}`,`x = ${n(x)}`]],
   mistakes:mk([[(d-b)/(a+c),`You added the x terms. To move ${xt(c)} to the other side you subtract it, which gives ${xt(k)}.`],[(d+b)/k,`Check the sign when you moved the ${n(b)}.`],[-x,`Close, but the sign is flipped. Recheck the last division.`]],x)}},

 lagoon(){
  if(Math.random()<.4){const a=ri(2,7),b=ri(1,6),x=ri(-5,10),c=nz(-12,12),d=(a+b)*x+c;
   return{eq:`${a}x + ${b}x${term(c)} = ${n(d)}`,ans:x,hint:`Combine like terms first: ${a}x + ${b}x = ?`,
    steps:[[`Combine like terms (${a}x + ${b}x = ${a+b}x)`,`${a+b}x${term(c)} = ${n(d)}`],[c>0?`Subtract ${c} from both sides`:`Add ${-c} to both sides`,`${a+b}x = ${n(d-c)}`],[`Divide both sides by ${a+b}`,`x = ${n(x)}`]],
    mistakes:mk([[(d-c)/(a*b),`It looks like you multiplied ${a} and ${b}. Like terms add together: ${a}x + ${b}x = ${a+b}x.`],[(d+c)/(a+b),`Check the sign when you moved the ${n(c)}. Use the opposite operation on both sides.`],[d-c,`One step away! Divide both sides by ${a+b} to finish.`]],x)}}
  const a=(Math.random()<.45?-1:1)*ri(2,6),b=ri(-10,10),k=ri(-6,8),c=a*k+b;
  const fl={'<':'>','>':'<','≤':'≥','≥':'≤'},op=pick(['<','>','≤','≥']),res=a<0?fl[op]:op;
  let wb=(c+b)/a;if(!Number.isInteger(wb)||wb===k)wb=-k;if(wb===k)wb=k+2;

function creature(kind,c,o={}){const K=kit();return K.wrap(ART[kind](K,c,o||{}),kind)}
function friendArt(k){const K=kit();return K.wrap(FRIEND_ART[k](K),FRIENDS[k]?FRIENDS[k].name:k)}
const TAUNT={imp:["Hee hee! Bet you can't solve this one!","I hid your x. Find it!"],goblin:["Your x is MINE!","Goblins never show their work!"],troll:["Troll smash wrong answers.","Nobody crosses my bridge without solving for x."],golem:["RUNES. MUST. BALANCE.","EQUATION DETECTED. PREPARE."],giant:["Fee-fi-fo-fum, I smell a variable!","I'm big, but my equations are bigger."],kraken:["Eight arms, eight problems!","The deep sea is full of tricky signs."],serpent:["Ssssolve me if you can…","My coils twist like inequalities."],dragon:["Only legends may pass.","My fire burns hotter than a negative sign!"],slime:["Blorp! Wanna see my numbers?","Squish! I'm made of variables."]};
const OUCH=["Ouch! How did you know that?","Grr… lucky guess!","Hey, that actually hurt!","Nooo, you solved it!","Wait, you're good at this!"];
const GLOAT=["Ha! Check your steps!","Missed me! Read the explanation.","So close… try again!","Heh. Signs are tricky, huh?"];

const coinSVG=`<svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#e9b949" stroke="#a8781a" stroke-width="2"/><text x="10" y="14" text-anchor="middle" font-size="10" font-weight="800" fill="#7a540d">x</text></svg>`;

/* ---------- HUD ---------- */
function hud(){
 if(!S.created||screen==='title'||screen==='create'){$('#hud').innerHTML='';return}
 const xpIn=S.xp%100;
 $('#hud').innerHTML=`<div class="hud"><div class="hud-in">
  <div class="mini">${avatar(S.look)}</div>
  <div class="who"><b>${esc(S.name)}</b><span>Level ${level()} · ${titleFor(level())}</span></div>
  <div class="stat" title="Health">HP <div class="bar" aria-hidden="true"><i style="width:${Math.max(0,S.hp/maxHP()*100)}%"></i></div><span>${S.hp}/${maxHP()}</span></div>
  <div class="stat" title="Experience to next level">XP <div class="bar xp" aria-hidden="true"><i style="width:${xpIn}%"></i></div></div>
  <div class="stat" title="Gold">${coinSVG}<span>${S.gold}</span></div>
 </div></div>`;
}

/* ---------- screens ---------- */
function go(s){screen=s;render();window.scrollTo({top:0})}
function render(){hud();const f={title,create,village,map,battle,friend}[screen];$('#app').innerHTML=f();after()}
function after(){const inp=$('#ans');if(inp)inp.focus({preventScroll:true})}

function title(){
 return `<div class="title-art"><h1>The Legends<br>of Algebra</h1>
 <p>Islands full of goblins, giants and dragons are waiting. Only a hero who can solve for <i style="font-family:var(--f-math)">x</i> can defeat them. Make your hero, build your village, and make friends with fairies, unicorns and mermaids along the way.</p></div>
 <div class="card" style="max-width:560px;margin:20px auto 0;display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center">
  ${creature('goblin','#73b553')}
  <div><p style="margin:0 0 12px">Get one wrong? No problem. Every mistake comes with a step-by-step explanation and the right answer, so you learn as you battle.</p>
  <button class="btn" onclick="startCreate()">Create your hero</button></div></div>`;
}
function startCreate(){draft={name:S.name,look:{...S.look}};go('create')}
function create(){
 const L=draft.look;
 const sw=(k,arr)=>`<div class="opt"><h3>${{skin:'Skin',hair:'Hair color',eyes:'Eyes',topColor:'Clothes color',shoeColor:'Shoe color'}[k]}</h3><div class="row">${arr.map(c=>`<button class="sw" style="background:${c}" aria-label="${k} ${c}" aria-pressed="${L[k]===c}" onclick="setLook('${k}','${c}')"></button>`).join('')}</div></div>`;
 const ch=(k,label,arr)=>`<div class="opt"><h3>${label}</h3><div class="row">${arr.map(v=>{const lock=ACC_LOCK[v]&&!(S.friends[ACC_LOCK[v][0]]||S.built[ACC_LOCK[v][0]]);return `<button class="chip" ${lock?`disabled title="${ACC_LOCK[v][1]} to unlock"`:''} aria-pressed="${L[k]===v}" onclick="setLook('${k}','${v}')">${NAMES[v]||v}${lock?' (locked)':''}</button>`}).join('')}</div></div>`;
 return `<div class="card"><div class="eyebrow">${S.created?'Wardrobe':'Step 1 of 1'}</div><h2 style="margin:4px 0 16px;font-size:30px">${S.created?'Change your look':'Create your hero'}</h2>
 <div class="creator"><div><div class="preview" id="pv">${avatar(L)}</div>
  <div class="opt" style="margin-top:14px"><h3><label for="heroName">Hero name</label></h3><input type="text" id="heroName" maxlength="18" placeholder="e.g. Nova Starfield" value="${esc(draft.name)}" oninput="draft.name=this.value"></div>
  <button class="btn" style="width:100%" onclick="finishCreate()">${S.created?'Save look':'Begin the adventure'}</button>
  ${S.created?`<button class="btn ghost" style="width:100%;margin-top:10px" onclick="go('village')">Cancel</button>`:''}
 </div><div>
  ${sw('skin',LOOK.skin)}${ch('hairStyle','Hair style',LOOK.hairStyle)}${sw('hair',LOOK.hair)}${sw('eyes',LOOK.eyes)}
  ${ch('top','Clothes',LOOK.top)}${sw('topColor',LOOK.topColor)}${ch('shoes','Shoes',LOOK.shoes)}${sw('shoeColor',LOOK.shoeColor)}${ch('acc','Accessory',LOOK.acc)}
 </div></div></div>`;
}
function setLook(k,v){draft.look[k]=v;const y=scrollY;render();scrollTo(0,y)}
function finishCreate(){
 const nm=(draft.name||'').trim();if(!nm){const i=$('#heroName');i.focus();i.placeholder='Your hero needs a name!';i.style.borderColor='var(--bad)';return}
 S.name=nm;S.look=draft.look;const first=!S.created;S.created=true;save();
 if(first){toast=`Welcome, ${nm}! Your village is waiting. Earn gold on the islands to build it up.`}
 go('village');
}
let toast='';

function building(id,x,y){
 const house=(w,r,extra='')=>`<rect x="${x-32}" y="${y-40}" width="64" height="40" fill="${w}"/><polygon points="${x-40},${y-40} ${x},${y-72} ${x+40},${y-40}" fill="${r}"/><rect x="${x-8}" y="${y-24}" width="16" height="24" rx="7" fill="#4a2d18"/><rect x="${x-26}" y="${y-32}" width="12" height="12" fill="#ffe7a0" stroke="#4a2d18" stroke-width="2"/><rect x="${x+14}" y="${y-32}" width="12" height="12" fill="#ffe7a0" stroke="#4a2d18" stroke-width="2"/>${extra}`;
 switch(id){
  case 'cottage':return house('#e7cfa1','#b5452a');
  case 'bakery':return house('#f5d6dc','#d9667a',`<circle cx="${x}" cy="${y-50}" r="7" fill="#e9b949"/>`);
  case 'library':return house('#c9d6e8','#3f5f9f',`<rect x="${x-20}" y="${y-62}" width="40" height="10" fill="#e9b949"/>`);
  case 'forge':return house('#7d7a78','#3d3836',`<rect x="${x+16}" y="${y-80}" width="10" height="24" fill="#4a4442"/><circle cx="${x+22}" cy="${y-88}" r="6" fill="#bfc6cc" opacity=".7"/><circle cx="${x+28}" cy="${y-98}" r="5" fill="#bfc6cc" opacity=".5"/>`);
  case 'garden':return `<path d="M${x-30} ${y} V${y-34} Q${x} ${y-66} ${x+30} ${y-34} V${y}" stroke="#7a5a34" stroke-width="5" fill="none"/>`+[[-30,-34],[-22,-50],[-8,-60],[8,-60],[22,-50],[30,-34]].map(([a,b])=>`<circle cx="${x+a}" cy="${y+b}" r="6" fill="${pick(['#f28db2','#f2c341','#b48ae6'])}"/>`).join('')+[-24,-10,8,22].map(a=>`<circle cx="${x+a}" cy="${y-6}" r="7" fill="#f28db2"/><circle cx="${x+a}" cy="${y-6}" r="3" fill="#ffe27a"/>`).join('');
  case 'stable':return `<rect x="${x-36}" y="${y-38}" width="72" height="38" fill="#b5452a"/><polygon points="${x-42},${y-38} ${x-20},${y-62} ${x+20},${y-62} ${x+42},${y-38}" fill="#6e2a1c"/><path d="M${x-14} ${y} V${y-22} Q${x} ${y-34} ${x+14} ${y-22} V${y}" fill="#4a2d18"/><path d="M${x-14} ${y-22} L${x+14} ${y} M${x+14} ${y-22} L${x-14} ${y}" stroke="#e7cfa1" stroke-width="2"/><polygon points="${x-4},${y-62} ${x},${y-78} ${x+4},${y-62}" fill="#f2c341"/>`;
  case 'fountain':return `<ellipse cx="${x}" cy="${y-6}" rx="40" ry="12" fill="#a6b0bb"/><ellipse cx="${x}" cy="${y-10}" rx="34" ry="8" fill="#4fb8d6"/><rect x="${x-5}" y="${y-48}" width="10" height="40" fill="#a6b0bb"/><path d="M${x} ${y-48} Q${x-24} ${y-62} ${x-28} ${y-14} M${x} ${y-48} Q${x+24} ${y-62} ${x+28} ${y-14}" stroke="#8fd4e8" stroke-width="3" fill="none"/><circle cx="${x}" cy="${y-52}" r="7" fill="#4fd1c0"/>`;
  case 'tower':return `<rect x="${x-18}" y="${y-92}" width="36" height="92" fill="#8c7fb8"/><polygon points="${x-26},${y-92} ${x},${y-132} ${x+26},${y-92}" fill="#4a3290"/><rect x="${x-6}" y="${y-70}" width="12" height="14" rx="6" fill="#ffe7a0"/><rect x="${x-6}" y="${y-40}" width="12" height="14" rx="6" fill="#ffe7a0"/><path d="M${x} ${y-142} l2 4 4 .5-3 3 1 4-4-2-4 2 1-4-3-3 4-.5z" fill="#ffe27a"/>`;
 }
}
function village(){
 const friends=Object.keys(S.friends);
 const scene=`<svg class="scene" viewBox="0 0 640 300" role="img" aria-label="Your village"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c5d7a"/><stop offset="1" stop-color="#7fb2c4"/></linearGradient></defs>
  <rect width="640" height="300" fill="url(#sky)"/><circle cx="560" cy="40" r="18" fill="#fff4c8"/>

  <path d="M-10 296 Q200 270 330 190 Q400 150 650 160" stroke="#d8c08a" stroke-width="16" fill="none" opacity=".75"/>
  ${PLOTS.map(([x,y],i)=>{const b=BUILDINGS[i],has=S.built[b.id];return `<g class="plot" role="button" tabindex="0" aria-label="${b.name}" onclick="build('${b.id}')" onkeydown="if(event.key==='Enter')build('${b.id}')">${has?building(b.id,x,y):`<rect class="plotbox" x="${x-40}" y="${y-60}" width="80" height="60" rx="8" fill="rgba(0,0,0,.12)" stroke="#e6d2a3" stroke-width="2" stroke-dasharray="6 5"/><text x="${x}" y="${y-22}" text-anchor="middle" font-size="22" fill="#f4e7c8" font-weight="800">+</text>`}<text x="${x}" y="${y+17}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#f4e7c8" style="paint-order:stroke" stroke="#1f3a24" stroke-width="3">${has?b.name:b.cost+' gold'}</text></g>`}).join('')}
  <g transform="translate(300 152) scale(.34)">${avatar(S.look).replace(/<\/?svg[^>]*>/g,'')}</g>
 </svg>`;
 return `${toast?`<div class="banner" style="margin:0 0 14px">${esc(toast)}</div>`:''}
 <div class="card"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Home</div><h2 style="font-size:30px">${esc(S.name)}'s Village</h2></div>
 <div class="row"><button class="btn" onclick="go('map')">Set sail to the islands</button><button class="btn alt" onclick="startCreate()">Wardrobe</button><button class="btn ghost" onclick="rest()" ${S.hp>=maxHP()?'disabled':''}>Rest (heal fully)</button></div></div>
 <div style="margin-top:14px">${scene}</div>
 <div class="shop">${BUILDINGS.map(b=>{const has=S.built[b.id],need=b.needs&&!S.friends[b.needs];return `<div class="item"><b>${b.name}</b><small>${b.eff}</small>${need?`<small><em>Befriend ${FRIENDS[b.needs].name} first.</em></small>`:''}<div class="row">${has?'<span class="built">Built ✓</span>':`<span class="stat">${coinSVG}${b.cost}</span><button class="btn" style="padding:7px 14px" onclick="build('${b.id}')" ${S.gold<b.cost||need?'disabled':''}>Build</button>`}</div></div>`}).join('')}</div></div>
 <div class="card"><div class="eyebrow">Mythical friends</div><h3 style="font-size:22px;margin:4px 0 10px">${friends.length?'Friends who joined your village':'No friends yet'}</h3>
 ${friends.length?`<div class="friends">${friends.map(k=>`<span class="friend-tag">${friendArt(k)}${FRIENDS[k].name}</span>`).join('')}</div>`:`<p class="muted" style="margin:0">Visit each island to meet a fairy, a unicorn, a snow fox, a mermaid and a phoenix. Each one teaches you a trick for that island's math.</p>`}
 <p class="muted" style="margin:12px 0 0;font-size:14px">Record: ${S.correct} answered right · ${S.wrong} learned from · ${S.wins.reduce((a,b)=>a+b,0)} battles won</p></div>`;
}
function build(id){
 const b=BUILDINGS.find(x=>x.id===id);toast='';
 if(S.built[id]){toast=`${b.name}: ${b.eff}`}
 else if(b.needs&&!S.friends[b.needs]){toast=`To build the ${b.name}, first befriend ${FRIENDS[b.needs].name}.`}
 else if(S.gold<b.cost){toast=`The ${b.name} costs ${b.cost} gold. You have ${S.gold}. Win battles on the islands to earn more!`}
 else{S.gold-=b.cost;S.built[id]=true;if(id==='cottage')S.hp+=20;if(id==='tower')S.hp+=10;toast=`You built the ${b.name}! ${b.eff}`;save()}
 render();
}
function rest(){S.hp=maxHP();toast='You rested at home. Full health!';save();render()}

function islandArt(i,[x,y],lock){
 const f=[
  ()=>[[-24,-8],[0,-16],[22,-6]].map(([a,b])=>`<rect x="${x+a-2}" y="${y+b}" width="4" height="12" fill="#6b4226"/><circle cx="${x+a}" cy="${y+b-4}" r="10" fill="#3e8e4a"/>`).join(''),
  ()=>`<ellipse cx="${x}" cy="${y-2}" rx="28" ry="9" fill="#4d6b4a"/>`+[-20,-8,6,18].map(a=>`<path d="M${x+a} ${y} v-18" stroke="#3a5a2a" stroke-width="3"/><ellipse cx="${x+a}" cy="${y-20}" rx="3" ry="7" fill="#7a5a34"/>`).join(''),
  ()=>`<polygon points="${x-36},${y+4} ${x-10},${y-40} ${x+16},${y+4}" fill="#8a94a0"/><polygon points="${x-18},${y-26} ${x-10},${y-40} ${x-2},${y-26}" fill="#fff"/><polygon points="${x},${y+4} ${x+18},${y-26} ${x+38},${y+4}" fill="#7d8691"/><polygon points="${x+12},${y-16} ${x+18},${y-26} ${x+24},${y-16}" fill="#fff"/>`,
  ()=>`<ellipse cx="${x}" cy="${y-2}" rx="22" ry="10" fill="#4fb8d6"/><path d="M${x+26} ${y} v-26" stroke="#7a5a34" stroke-width="4"/><path d="M${x+26} ${y-26} q-14 -2 -20 6 M${x+26} ${y-26} q14 -2 18 8 M${x+26} ${y-26} q0 -12 -12 -14" stroke="#3e8e4a" stroke-width="5" fill="none" stroke-linecap="round"/>`,
  ()=>`<polygon points="${x-34},${y+4} ${x-10},${y-36} ${x+10},${y-36} ${x+34},${y+4}" fill="#5a4a46"/><ellipse cx="${x}" cy="${y-36}" rx="10" ry="4" fill="#ff7a3c"/><path d="M${x-4} ${y-40} q-6 -14 4 -22 q2 10 6 4 q2 10 -4 18" fill="#ffb347"/>`
 ][i]();
 const col=['#7cc47a','#7d9b6a','#c7d0d8','#e8d7a0','#9b7468'][i];
 return `<g class="isle ${lock?'locked':''}" role="button" tabindex="0" aria-label="${ISLANDS[i].name}${lock?' (locked)':''}" onclick="pickIsle(${i})" onkeydown="if(event.key==='Enter')pickIsle(${i})" opacity="${lock?.45:1}">
  <ellipse cx="${x}" cy="${y+10}" rx="66" ry="30" fill="#e6d2a3"/><ellipse class="isle-ring" cx="${x}" cy="${y+6}" rx="58" ry="25" fill="${col}" stroke="${sel===i?'#e9b949':'transparent'}" stroke-width="${sel===i?4:0}"/>${f}
  <text x="${x}" y="${y+56}" text-anchor="middle" font-family="Uncial Antiqua, Georgia, serif" font-size="15" fill="#f4e7c8" style="paint-order:stroke" stroke="#081722" stroke-width="4">${ISLANDS[i].name}</text>
  ${lock?`<g transform="translate(${x-9} ${y-20})"><rect y="8" width="18" height="14" rx="3" fill="#2a1f16"/><path d="M4 8 V4 a5 5 0 0 1 10 0 V8" stroke="#2a1f16" stroke-width="3" fill="none"/></g>`:''}
  ${S.wins[i]?`<text x="${x+50}" y="${y-18}" text-anchor="middle" font-size="12" font-weight="800" fill="#081722"><tspan>★${S.wins[i]}</tspan></text>`:''}
 </g>`;
}
function map(){
 const I=ISLANDS[sel],lock=!unlocked(sel),boss=S.wins[sel]%4===3,fr=FRIENDS[I.friend];
 return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="font-size:28px;color:var(--gold)">The Algebra Isles</h2><button class="btn alt" onclick="toast='';go('village')">Back to village</button></div>
 <svg class="map" viewBox="0 0 620 360" role="img" aria-label="Map of the islands"><rect width="620" height="360" fill="#164a64"/>
  ${[...Array(18)].map((_,k)=>`<path d="M${(k*97)%600} ${(k*61)%340+10} q8 -6 16 0 q8 6 16 0" stroke="#3d7c98" stroke-width="2" fill="none"/>`).join('')}
  <path d="M110 285 Q190 260 255 205 Q200 140 120 100 Q260 60 390 105 Q470 170 505 250" stroke="#e6d2a3" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" fill="none"/>
  ${ISLANDS.map((x,i)=>islandArt(i,x.pos,!unlocked(i))).join('')}
 </svg>
 <div class="card" style="margin-top:14px"><div class="isle-panel"><div>
  <div class="eyebrow">Island ${sel+1} · ${I.topic}</div><h2 style="font-size:26px;margin:4px 0 6px">${I.name}</h2>
  ${lock?`<p style="margin:0">Win 3 battles on ${ISLANDS[sel-1].name} to unlock this island.</p>`:
  `<p style="margin:0">Creatures here: ${I.pool.map(p=>p[1]).join(', ')}. ${boss?`<b>The ${I.boss[1]} awaits!</b>`:`Every 4th battle, the ${I.boss[1]} appears.`} Battles won: ${S.wins[sel]}.</p>`}
  </div><div class="row">${lock?'':`<button class="btn" onclick="startBattle(${sel})">${boss?'Face the boss':'Battle!'}</button><button class="btn rose" onclick="visit('${I.friend}')">Meet ${fr.name.split(' ')[0]}${S.friends[I.friend]?'':' ✦'}</button>`}</div></div></div>`;
}
function pickIsle(i){sel=i;render()}

/* ---------- friends ---------- */
function visit(k){friendView=k;go('friend')}
function friend(){
 const F=FRIENDS[friendView],met=S.friends[friendView];
 return `<div class="card"><div class="friendview"><div class="art">${friendArt(friendView)}</div><div>
  <div class="eyebrow">${F.kind} of ${ISLANDS.find(i=>i.friend===friendView).name}</div><h2 style="font-size:30px;margin:4px 0 8px">${F.name}</h2>
  <p style="font-size:18px;margin:0">“${F.hello}”</p>
  <div class="lesson"><div class="eyebrow">Lesson: ${F.lesson}</div><p style="margin:6px 0 10px">${F.rule}</p>
   <ol class="steps" style="margin:0">${F.ex.map(([t,e])=>`<li><span>${t}</span><span class="m">${M(e)}</span></li>`).join('')}</ol></div>
  ${met?`<div class="banner">${F.name.split(' ')[0]} lives in your village now. Come back for the lesson any time!</div>`:''}
  <div class="row" style="margin-top:14px">${met?'':`<button class="btn rose" onclick="befriend()">Become friends (receive ${F.gift})</button>`}
   <button class="btn" onclick="healFriend()" ${S.hp>=maxHP()?'disabled':''}>Ask for healing</button><button class="btn ghost" onclick="go('map')">Back to map</button></div>
 </div></div></div>`;
}
function befriend(){S.friends[friendView]=true;S.gold+=25;save();render()}
function healFriend(){S.hp=maxHP();save();render()}

/* ---------- battle ---------- */
function newQ(i){const q=GEN[ISLANDS[i].gen]();q.prompt=q.prompt||'Solve for x';return q}
function startBattle(i){
 const boss=S.wins[i]%4===3,[kind,name,color,opt]=boss?ISLANDS[i].boss:pick(ISLANDS[i].pool);
 const hp=boss?5+i:3+Math.floor(i/2);
 if(S.hp<=0)S.hp=maxHP();
 B={i,boss,m:{kind,name,color,opt:opt||{},hp,max:hp,say:pick(TAUNT[kind]),dmg:(boss?16:12)+i*2},hints:1+(S.built.library?1:0),streak:0,q:newQ(i),showHint:false,phase:'ask',last:null,fx:null};
 go('battle');
}
function battle(){
 const m=B.m,q=B.q;
 const arena=`<div class="arena"><div class="bubble" aria-live="polite">${esc(m.say)}</div>
  <div class="fighter" id="pf"><div class="nm">${esc(S.name)}</div><div class="bar"><i style="width:${S.hp/maxHP()*100}%"></i></div>${avatar(S.look)}</div>
  <div class="vs">vs</div>
  <div class="fighter" id="mf"><div class="nm">${m.name}${B.boss?' (Boss)':''}</div><div class="bar mon-bar"><i style="width:${m.hp/m.max*100}%"></i></div>${creature(m.kind,m.color,m.opt)}</div>
 </div>`;
 let body='';
 if(B.phase==='ask'){
  body=`<div class="card qcard" style="margin-top:14px"><div class="eyebrow">${q.prompt}${B.streak>=2?` · Streak ${B.streak}`:''}</div><div class="eq">${M(q.eq)}</div>
  ${q.choices?`<div class="choices">${q.choices.map((c,k)=>`<button class="btn" onclick="answer(${k})">${M(c)}</button>`).join('')}</div>`:
  `<form class="answer" onsubmit="event.preventDefault();answer()"><label for="ans">Your answer</label><input type="text" id="ans" inputmode="text" autocomplete="off" placeholder="x = ?"><button class="btn" type="submit">Attack</button></form>`}
  ${B.showHint?`<div class="hintbox"><b>Hint:</b> ${q.hint}</div>`:''}
  <div class="tools"><button class="btn ghost" onclick="useHint()" ${B.hints<1||B.showHint?'disabled':''}>Use a hint crystal (${B.hints} left)</button><button class="btn ghost" onclick="flee()">Flee to map</button></div>
  <p class="muted" style="margin:10px auto 0;font-size:13px">Type whole numbers like −4 or 12. Fractions like 3/2 work too.</p></div>`;
 } else if(B.phase==='explain'){
  const L=B.last;
  body=`<div class="card explain" style="margin-top:14px"><div class="eyebrow">The ${m.name} hit you for ${L.dmg} · Let's learn from it</div>
  <div class="eq" style="text-align:center">${M(q.eq)}</div>
  <div class="you"><span>Your answer: <em>${L.shown}</em></span></div>
  <div class="oops">${L.why}</div>
  <ol class="steps">${q.steps.map(([t,e])=>`<li><span>${t}</span><span class="m">${M(e)}</span></li>`).join('')}</ol>
  <div class="correct-ans">Correct answer: <span class="m">${M(q.choices?q.ans:'x = '+n(q.ans))}</span></div>
  <div class="row" style="margin-top:14px">${S.hp>0?`<button class="btn" id="nextBtn" onclick="nextQ()">Got it, next question</button>`:`<button class="btn rose" id="nextBtn" onclick="defeat()">You fainted… return to the village</button>`}</div></div>`;
 } else if(B.phase==='won'){
  const r=B.reward;
  body=`<div class="card" style="margin-top:14px;text-align:center"><div class="eyebrow">Victory</div><h2 style="font-size:32px;margin:6px 0">You defeated the ${m.name}!</h2>
  <p style="margin:0 auto 10px">+${r.gold} gold · +${r.xp} XP${r.heal?` · Honey Bakery healed ${r.heal} HP`:''}</p>
  ${r.notes.map(t=>`<div class="banner">${t}</div>`).join('')}
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="startBattle(${B.i})">Battle again</button><button class="btn alt" onclick="go('map')">Back to map</button><button class="btn ghost" onclick="toast='';go('village')">Go home</button></div></div>`;
 }
 return arena+body;
}
function parseAns(s){
 s=s.replace(/−|–/g,'-').replace(/\s/g,'').replace(/^[xy]=/i,'');
 if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);
 const f=s.match(/^(-?\d+)\/(-?\d+)$/);if(f&&+f[2]!==0)return f[1]/f[2];
 return null;
}
function answer(k){
 const q=B.q;let ok,val,shown;
 if(q.choices){val=q.choices[k];shown=M(val);ok=val===q.ans}
 else{const raw=$('#ans').value;val=parseAns(raw);if(raw.trim()===''){$('#ans').focus();return}
  if(val===null){const i=$('#ans');i.value='';i.placeholder='Numbers only, e.g. −3';i.focus();return}
  shown='x = '+esc(raw.replace(/^[xy]\s*=\s*/i,''));ok=Math.abs(val-q.ans)<1e-9}
 if(ok){
  S.correct++;B.streak++;const dbl=S.built.forge&&B.streak>=3&&B.streak%3===0,dmg=dbl?2:1;
  B.m.hp=Math.max(0,B.m.hp-dmg);S.xp+=2;save();
  if(B.m.hp<=0)return win();
  B.m.say=pick(OUCH);B.q=newQ(B.i);B.showHint=false;render();fx('#mf',dbl?'Double hit!':'Hit!','#ffe27a','hurt');
 } else {
  S.wrong++;B.streak=0;const dmg=Math.max(4,B.m.dmg-(S.built.garden?5:0));S.hp=Math.max(0,S.hp-dmg);save();
  const key=q.choices?val:Math.round(val*1e6)/1e6;
  const why=q.mistakes[key]||(q.choices?'Not quite. Walk through the steps below.':`Not quite! Let's walk through it one step at a time and find where it went off track.`);
  B.m.say=pick(GLOAT);B.last={shown,why,dmg};B.phase='explain';render();fx('#pf','−'+dmg,'#ff8a8a');const ms=$('#mf svg');if(ms)ms.classList.add('lunge');
  const nb=$('#nextBtn');if(nb)nb.focus({preventScroll:true});
 }
}
function fx(sel,text,color,cls='shake'){const el=$(sel);if(!el)return;const svg=el.querySelector('svg');svg.classList.add(cls);const f=document.createElement('div');f.className='float';f.textContent=text;f.style.color=color;el.appendChild(f);setTimeout(()=>f.remove(),1000)}
function nextQ(){B.q=newQ(B.i);B.phase='ask';B.showHint=false;render()}
function useHint(){if(B.hints>0){B.hints--;B.showHint=true;render()}}
function flee(){B=null;go('map')}
function defeat(){S.hp=maxHP();save();toast='You woke up safe at home, fully healed. Every mistake made you smarter. Try again!';B=null;go('village')}
function win(){
 const i=B.i,wasLocked=!unlocked(i+1)&&i<4,lvl=level();
 let gold=B.boss?30+10*i:12+4*i,xp=B.boss?50+10*i:20+5*i;
 if(S.built.stable)gold=Math.round(gold*1.25);if(S.built.fountain)xp=Math.round(xp*1.25);
 S.gold+=gold;S.xp+=xp;S.wins[i]++;let heal=0;
 if(S.built.bakery){heal=Math.min(15,maxHP()-S.hp);S.hp+=heal}
 const notes=[];
 if(level()>lvl)notes.push(`Level up! You are now level ${level()}: ${titleFor(level())}.`);
 if(i<4&&wasLocked&&unlocked(i+1))notes.push(`New island unlocked: ${ISLANDS[i+1].name}!`);
 if(S.wins[i]%4===3)notes.push(`The ${ISLANDS[i].boss[1]} has noticed you. Your next battle here is a boss fight!`);
 if(B.boss&&i===4)notes.push(`You defeated the Elder Dragon. You are a true Legend of Algebra! The islands are endless, so keep battling to grow even stronger.`);
 B.reward={gold,xp,heal,notes};B.phase='won';save();render();
}

render();
</script>
