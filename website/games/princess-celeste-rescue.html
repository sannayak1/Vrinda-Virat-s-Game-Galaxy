<!doctype html>
<script src="../app-back.js" defer></script>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Princess Celeste's Rescue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mochiy+Pop+One&display=swap">
<style>
/* Layout: one 16:9 game stage with touch pads below; menus (hero maker, quest map, invite) swap in as full-width panels. Single pastel look. */
:root{
  --bg:#fff2f8; --ink:#55366b; --muted:#8a6f9c; --pink:#ff7fbf; --pinkdeep:#e0559c;
  --peri:#9aa6ff; --mint:#7fdcc0; --gold:#ffc94d; --card:#ffffff; --line:#f5d3e6;
  --display:"Mochiy Pop One","Baloo 2",system-ui,sans-serif;
  --body:"Baloo 2",ui-rounded,system-ui,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
body{font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;
  background-image:radial-gradient(circle at 14px 14px,#ffd9ec 2px,transparent 2.6px);background-size:28px 28px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:clamp(15px,3vw,21px);color:var(--pink);text-shadow:2px 2px 0 #fff}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tog{font-family:var(--body);font-weight:700;font-size:14px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.tog[aria-pressed="false"]{color:var(--muted);background:#fbf3f8}
#stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:22px;overflow:hidden;border:4px solid #fff;
  box-shadow:0 7px 0 var(--line),0 16px 30px rgba(120,60,140,.14);background:#ffe3f1}
#cv{width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
.titleOv{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-inline:12px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vw,14px);
  text-align:center;padding:12px;background:rgba(255,240,248,.82)}
.overlay h2{font-family:var(--display);font-size:clamp(18px,4.2vw,36px);margin:0;color:var(--pinkdeep);text-wrap:balance}
.overlay p{margin:0;font-size:clamp(13px,2.2vw,18px);max-width:52ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.overlay .row{justify-content:center}
.btn{font-family:var(--display);font-size:clamp(12px,1.9vw,16px);border:none;border-radius:999px;padding:.6em 1.4em;background:var(--pink);color:#fff;
  box-shadow:0 4px 0 var(--pinkdeep);cursor:pointer;transition:transform .08s}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pinkdeep)}
.btn:focus-visible,.tog:focus-visible,.pad:focus-visible,.chip:focus-visible,.sw:focus-visible,.card:focus-visible{outline:3px solid var(--peri);outline-offset:3px}
.skip{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;font-family:var(--body);font-weight:800;font-size:13px;border:none;border-radius:999px;
  background:rgba(255,255,255,.85);color:var(--ink);padding:4px 12px;cursor:pointer}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}
.grp{display:flex;gap:10px}
.pad{width:clamp(54px,13vw,70px);height:clamp(54px,13vw,70px);border-radius:50%;border:none;background:#fff;color:var(--ink);font-family:var(--display);
  font-size:clamp(11px,2.6vw,14px);box-shadow:0 5px 0 var(--line);cursor:pointer;touch-action:none}
.pad.jump{background:var(--peri);color:#fff;box-shadow:0 5px 0 #7480e0}
.pad.star{background:var(--gold);color:#6b4a00;box-shadow:0 5px 0 #e0a72a}
.pad.sm{width:44px;height:44px;font-size:12px;align-self:center}
.pad.on{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.hint{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted)}
@media (max-width:620px){.hint{display:none}}
.panel{background:var(--card);border-radius:24px;padding:clamp(14px,3vw,26px);box-shadow:0 7px 0 var(--line);display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);color:var(--pinkdeep);margin:0;font-size:clamp(20px,4vw,30px);text-wrap:balance}
.panel p{margin:0;color:var(--muted);max-width:60ch}
.createGrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:700px){.createGrid{grid-template-columns:minmax(0,1fr)}}
.pvBox{display:flex;flex-direction:column;gap:8px;align-items:stretch}
#pv{width:100%;max-width:260px;aspect-ratio:26/30;border-radius:20px;background:#fff0f7;align-self:center}
label{font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input[type=text]{font-family:var(--display);font-size:18px;color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:8px 12px;background:#fff;min-width:0}
input[type=text]:focus{outline:none;border-color:var(--peri)}
textarea{font-family:var(--body);font-size:16px;color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:10px;resize:vertical;width:100%;box-sizing:border-box}
.opts{display:flex;flex-direction:column;gap:12px;min-width:0}
.optRow{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--body);font-weight:700;font-size:14px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pinkdeep)}
.end{justify-content:flex-end}
.mapHead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.mapHead>div:first-child{min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{position:relative;text-align:left;border:none;border-radius:20px;padding:14px;min-height:118px;display:flex;flex-direction:column;gap:2px;
  color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--line);font-family:var(--body);transition:transform .12s}
.card:hover:not(:disabled){transform:translateY(-3px)}
.card.dark{color:#fff}
.card:disabled{cursor:not-allowed;filter:grayscale(.85) opacity(.55)}
.card .num{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.card .nm{font-family:var(--display);font-size:17px;line-height:1.2}
.card .bs{font-size:14px;font-weight:700}
.card .st{font-size:13px;margin-top:auto;font-weight:700}
.friends{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.friends li{background:#fff0f7;border-radius:999px;padding:4px 12px;font-weight:700;display:flex;gap:6px;align-items:center}
.friends button{border:none;background:none;color:var(--muted);cursor:pointer;font-weight:800}
@media (prefers-reduced-motion:reduce){.card,.btn{transition:none}}
</style>
</head>
<body>
<noscript><p style="padding:16px;font-weight:700">This game needs JavaScript. Open the file in Chrome, Edge, Safari or Firefox (not a file preview).</p></noscript>


<div class="wrap">
  <header class="top">
    <div class="logo">Princess Celeste's Rescue</div>
    <div class="toggles">
      <button class="tog" id="tVoice" aria-pressed="true">Voices: on</button>
      <button class="tog" id="tSfx" aria-pressed="true">Sounds: on</button>
    </div>
  </header>

  <section id="scrStage">
    <div id="stage">
      <canvas id="cv" aria-label="Game screen"></canvas>
      <div id="titleOv" class="titleOv"></div>
      <button id="skip" class="skip" hidden>Skip scene</button>
      <div id="ov" class="overlay" hidden></div>
    </div>
    <div class="controls" id="controls" style="margin-top:12px">
      <div class="grp"><button class="pad" id="bL" aria-label="Move left">◀</button><button class="pad" id="bR" aria-label="Move right">▶</button></div>
      <div class="hint">Jump (double jump too): Space or ↑ · Throw star: X · Move in boss fights: ← → · Pause: P</div>
      <div class="grp"><button class="pad sm" id="bP" aria-label="Pause">II</button><button class="pad star" id="bS">Star</button><button class="pad jump" id="bJ">Jump</button></div>
    </div>
  </section>

  <section id="scrCreate" class="panel" hidden>
    <h2>Make your hero</h2>
    <div class="createGrid">
      <div class="pvBox">
        <canvas id="pv" width="520" height="600"></canvas>
        <label for="heroName">Hero name</label>
        <input type="text" id="heroName" maxlength="14" placeholder="Type your name" autocomplete="off">
        <button class="btn alt" id="randBtn">Surprise me</button>
      </div>
      <div id="opts" class="opts"></div>
    </div>
    <div class="row end"><button class="btn alt" id="createBack">Back</button><button class="btn" id="createGo">Start my quest!</button></div>
  </section>

  <section id="scrMap" class="panel" hidden>
    <div class="mapHead">
      <div><h2 id="mapTitle"></h2><p id="mapSub"></p></div>
      <div class="row"><button class="btn alt" id="mEdit">Edit hero</button><button class="btn alt" id="mInvite">Invite friends</button><button class="btn alt" id="mIntro">Watch the story</button></div>
    </div>
    <div id="cards" class="cards"></div>
  </section>

  <section id="scrInvite" class="panel" hidden>
    <h2>Invite friends</h2>
    <p>Copy this message and send it with the link to this game. Friends you add below will cheer for you at the big picnic at the end!</p>
    <textarea id="inviteText" rows="4" readonly></textarea>
    <div class="row"><button class="btn" id="copyBtn">Copy message</button><span id="copied" role="status" style="font-weight:800;color:var(--pinkdeep)"></span></div>
    <label for="friendName">Add a friend's name</label>
    <div class="row"><input type="text" id="friendName" maxlength="14" placeholder="Friend's name" autocomplete="off"><button class="btn alt" id="addFriend">Add friend</button></div>
    <ul id="friends" class="friends"></ul>
    <div class="row"><button class="btn alt" id="invBack">Back to map</button></div>
  </section>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, W=960, H=540, GROUND=455, CUTG=385;

/* ---------- save data ---------- */
const KEY='celeste-quest-v1';
const DEFAULT_LOOK={gender:'girl',hair:'pigtails',hairColor:'#5a3a22',skin:'#f6c9a0',eyes:'#4a7bd6',top:'hoodie',topColor:'#9aa6ff',bottom:'skirt',bottomColor:'#ff7fbf',shoes:'#ffffff',acc:'bow'};
let save={name:'',look:{...DEFAULT_LOOK},unlocked:1,cleared:0,coins:0,best:{},friends:[],muffin:false,kandy:false,introSeen:false,won:false,voice:true,sfx:true};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save={...save,...s,look:{...DEFAULT_LOOK,...(s.look||{})}};}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
const heroName=()=>save.name||'Star Hero';

/* ---------- universes ---------- */
const U=[
 {id:'candy',name:'Candy Swirl',sky:['#ffc4e4','#fff1f8'],ground:'#ff9fcf',top:'#ffffff',enemy:'#ff6fae',spike:'#ff5f8f',boss:'Gumdrop Golem',bossColor:'#ff5fa2',line:"Sticky sugar fists, ready! Nobody gets past the Candy Swirl!",intro:"Even the clouds are cotton candy here. Hestia's smoky trail leads this way!"},
 {id:'jungle',name:'Jungle Jamboree',sky:['#a9ecc0','#efffe9'],ground:'#a0704a',top:'#5fcf7a',enemy:'#ffb347',spike:'#3f9a5a',boss:'Big Bongo',bossColor:'#b0784a',line:"Bongo bongo! If you want to pass, you have to beat my drums!",intro:"Giant leaves, singing parrots and lots of bananas. Watch out for thorny bushes!"},
 {id:'goth',name:'Gloomy Goth Town',sky:['#2f2350','#6b4f95'],ground:'#3b2d57',top:'#8a6fc0',enemy:'#c9a4ff',spike:'#7a5ab0',boss:'Count Fluffula',bossColor:'#5b3f8a',line:"Mwah ha ha! I am the fluffiest, spookiest bat in all the land!",intro:"Cute little ghosts and flickering candles everywhere. Stay brave!",dark:true},
 {id:'cyber',name:'Cyberverse',sky:['#17204f','#3e4fb5'],ground:'#1d2462',top:'#5ff0ff',enemy:'#5ff0ff',spike:'#ff5fd2',boss:'Glitch.EXE',bossColor:'#6a7bff',line:"Beep boop! Error four oh four: hero not allowed!",intro:"Neon lights and pixel paths. Everything buzzes and beeps!",dark:true},
 {id:'space',name:'Starry Space',sky:['#0f0c2e','#33296f'],ground:'#6c5fb8',top:'#b3a6ff',enemy:'#ffd25c',spike:'#9a8cff',boss:'Nebula Nom',bossColor:'#ff7fd0',line:"Nom nom! I eat stars for breakfast and heroes for dessert!",intro:"Floating planets and twinkling stars. Jump high!",dark:true},
 {id:'desert',name:'Sunny Desert',sky:['#ffcf9a','#fff3dc'],ground:'#e8b468',top:'#f7d391',enemy:'#ff9f5a',spike:'#4fae6a',boss:'Sir Scorpio',bossColor:'#d9783a',line:"Pinch pinch! My stinger tail is the sharpest in the sand!",intro:"The sun is hot and the sand is soft. Mind the cactus spikes!"},
 {id:'ocean',name:'Bubble Bay',sky:['#7fd4ff','#dff6ff'],ground:'#ffe0a3',top:'#fff0c8',enemy:'#ff8a7a',spike:'#ff6f91',boss:'Captain Crabcake',bossColor:'#ff6a5a',line:"Arr! These bubbly waters belong to Captain Crabcake!",intro:"Under the sea everything is bubbly and blue. Hop over the coral!"},
 {id:'ice',name:'Frosting Peaks',sky:['#bfe0ff','#f5faff'],ground:'#dbeeff',top:'#ffffff',enemy:'#8fd3ff',spike:'#9fc8ff',boss:'Blizzard Bun',bossColor:'#eef6ff',line:"Brrr! Ready to freeze? My snowballs never miss!",intro:"Snowflakes like sprinkles and hills like frosting. Brrr!"},
 {id:'cloud',name:'Rainbow Heights',sky:['#ffd9f7','#dfe9ff'],ground:'#ffffff',top:'#ffe6fb',enemy:'#c79bff',spike:'#ffd25c',boss:'Thunder Puff',bossColor:'#a7a3c9',line:"Ka-boom! Thunder Puff rules the whole sky!",intro:"Bouncy clouds and a giant rainbow. Hestia's castle is very close now!"},
 {id:'ember',name:"Hestia's Ember Castle",sky:['#4a1630','#ff7f50'],ground:'#5a2a3a',top:'#ff8a5c',enemy:'#ff7a3d',spike:'#ff5a3a',boss:'Hestia the Witch',bossColor:'#b06bff',line:"You will never take back the picnic! My flames burn forever!",intro:"",dark:true}
];
const SCENE_BG={meadow:{sky:['#bfe6ff','#fff4fb'],ground:'#7fd38f',top:'#a8eba0'},picnic:{sky:['#bfe6ff','#fff4fb'],ground:'#7fd38f',top:'#a8eba0'},fire:{sky:['#ff8a5c','#ffd1a1'],ground:'#8a6a4a',top:'#b48a5a'}};
function bgData(id){return SCENE_BG[id]||U.find(u=>u.id===id);}

/* ---------- characters ---------- */
const CH={
 hero:{name:()=>heroName(),look:()=>save.look,opts:{},tag:'#9aa6ff'},
 princess:{name:()=>'Princess Celeste',look:()=>({gender:'girl',hair:'long',hairColor:'#7a4a2a',skin:'#ffe3cc',eyes:'#3f7ee8',top:'dress',topColor:'#a7b4ff',bottom:'skirt',bottomColor:'#a7b4ff',shoes:'#ffc94d',acc:'none'}),opts:{gown:'#a7b4ff',gown2:'#c9cfff',crown:true},tag:'#8d9bff'},
 hestia:{name:()=>'Hestia',look:()=>({gender:'girl',hair:'long',hairColor:'#1d1a22',skin:'#f6dbe9',eyes:'#9b4dff',top:'dress',topColor:'#ffa6d2',bottom:'skirt',bottomColor:'#d9c2ff',shoes:'#2a1a33',acc:'none'}),opts:{gown:'#ffa6d2',gown2:'#d9c2ff',hat:true,grump:true,wand:true},tag:'#b06bff'},
 muffin:{name:()=>'Muffin Blaze',look:()=>({gender:'girl',hair:'bun',hairColor:'#ff7a3d',skin:'#d9a273',eyes:'#7a4a2a',top:'dress',topColor:'#ff9b7a',bottom:'skirt',bottomColor:'#ff9b7a',shoes:'#e8574a',acc:'flame'}),opts:{},tag:'#ff8a5c'},
 kandy:{name:()=>'Kawaii Kandy',look:()=>({gender:'girl',hair:'pigtails',hairColor:'#f49ac1',skin:'#ffe3cc',eyes:'#8a55d4',top:'sailor',topColor:'#8fe3c8',bottom:'skirt',bottomColor:'#ff8fc6',shoes:'#ff8fc6',acc:'lolly'}),opts:{},tag:'#ff7fbf'},
 narrator:{name:()=>'Storyteller',tag:'#7fdcc0'}
};
const VOICE={hero:()=>({pitch:save.look.gender==='girl'?1.45:1.15,rate:1.05}),princess:()=>({pitch:1.6,rate:1}),hestia:()=>({pitch:.6,rate:.95}),
 muffin:()=>({pitch:1.3,rate:1.12}),kandy:()=>({pitch:1.9,rate:1.15}),narrator:()=>({pitch:1,rate:.98}),boss:()=>({pitch:.45,rate:1})};

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=.1,type='sine',v=.07,f2){if(!save.sfx)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);
 if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);gn.gain.setValueAtTime(v,a.currentTime);gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(gn).connect(a.destination);o.start();o.stop(a.currentTime+d+.02);}catch(e){}}
function say(text,who){if(!save.voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=(VOICE[who]||VOICE.narrator)();u.pitch=v.pitch;u.rate=v.rate;u.lang='en-US';speechSynthesis.speak(u);}catch(e){}}
function hush(){try{speechSynthesis.cancel()}catch(e){}}

/* ---------- drawing helpers ---------- */
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function rep(sp,f,scroll,cb){const s=scroll*f;const k0=Math.floor(s/sp)-1;for(let k=k0;k<k0+Math.ceil(W/sp)+3;k++)cb(k*sp-s,k);}
function star(c,x,y,r,col,stroke,rot=0){c.save();c.translate(x,y);c.rotate(rot);c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;c.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);}c.closePath();c.fillStyle=col;c.fill();if(stroke)c.stroke();c.restore();}
function heart(c,x,y,s,col){c.save();c.translate(x,y);c.scale(s,s);c.beginPath();c.moveTo(0,6);c.bezierCurveTo(-12,-2,-8,-12,0,-6);c.bezierCurveTo(8,-12,12,-2,0,6);c.fillStyle=col;c.fill();c.lineWidth=1.6/s*1.2;c.strokeStyle='#4a2f5e';c.stroke();c.restore();}
function cloud(c,x,y,s,col){c.fillStyle=col;c.beginPath();c.arc(x,y,20*s,0,TAU);c.arc(x+22*s,y-12*s,25*s,0,TAU);c.arc(x+47*s,y,20*s,0,TAU);c.fill();c.fillRect(x,y-2*s,47*s,22*s);}
function txt(c,s,x,y,size,fill='#fff',stroke='#55366b',font='body',align='center'){c.font=(font==='display'?`${size}px "Mochiy Pop One", "Baloo 2", sans-serif`:`800 ${size}px "Baloo 2", system-ui, sans-serif`);c.textAlign=align;c.textBaseline='middle';
 if(stroke){c.lineJoin='round';c.lineWidth=Math.max(3,size/5);c.strokeStyle=stroke;c.strokeText(s,x,y);}c.fillStyle=fill;c.fillText(s,x,y);}
function wrapLines(c,text,maxW){const out=[];let line='';for(const w of text.split(' ')){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}if(line)out.push(line);return out;}

/* ---------- the chibi ---------- */
function drawChibi(c,x,y,s,L,t,o={}){
 c.save();c.translate(x,y);c.scale(o.flip?-s:s,s);
 if(o.alpha!=null)c.globalAlpha=o.alpha;
 c.lineWidth=1.5;c.strokeStyle='#4a2f5e';c.lineJoin='round';c.lineCap='round';
 const sw=o.run?Math.sin(t*.35):0;
 c.translate(0,o.run?-Math.abs(sw)*2:Math.sin(t*.07)*.8);
 // back hair
 c.fillStyle=L.hairColor;
 if(L.hair==='long'){rr(c,-18,-64,36,44,12);c.fill();c.stroke();}
 else if(L.hair==='pigtails'){for(const sx of[-1,1]){c.beginPath();c.ellipse(sx*21,-42,7,12,sx*.35,0,TAU);c.fill();c.stroke();}}
 else if(L.hair==='bun'){c.beginPath();c.arc(0,-68,8.5,0,TAU);c.fill();c.stroke();}
 // legs
 const la=o.air?-.6:sw*.7, lb=o.air?.5:-sw*.7;
 for(const [sx,a] of [[-1,la],[1,lb]]){
  c.save();c.translate(sx*5,-19);c.rotate(a);

 const wall=fire?'#e9b9c9':'#ffd6ea',roof=fire?'#a05a8a':'#ff7fbf';
 c.fillStyle=wall;rr(c,x-70,y-80,140,80,4);c.fill();c.stroke();
 for(const tx of[-80,0,80]){const th=tx?110:140;c.fillStyle=wall;rr(c,x+tx-18,y-th,36,th,4);c.fill();c.stroke();
  c.fillStyle=roof;c.beginPath();c.moveTo(x+tx-24,y-th);c.lineTo(x+tx,y-th-40);c.lineTo(x+tx+24,y-th);c.closePath();c.fill();c.stroke();
  c.fillStyle='#9aa6ff';rr(c,x+tx-6,y-th+20,12,16,6);c.fill();c.stroke();}
 c.fillStyle='#b48a6a';rr(c,x-16,y-40,32,40,14);c.fill();c.stroke();
 if(fire){for(let k=0;k<7;k++){const fx=x-90+k*30,fy=y-60-hash(k)*90,s=14+Math.sin(t*.2+k)*4;flame(c,fx,fy,s);}}
 c.restore();
}

function update(dt){
 if(L.over&&L.phase!=='won'){updParts(dt);return;}
 const i=L.i;L.shake=Math.max(0,L.shake-dt);
 // speed and scroll
 const target=L.phase==='run'||L.phase==='toBoss'?L.speed:0;L.vs+=(target-L.vs)*.04*dt;L.scroll+=L.vs*dt;

  const eb=e.k==='walk'?box(e.x-18,e.y-32,36,32):e.k==='fly'?box(e.x-16,e.y-15,32,30):box(e.x-18,e.y-34,36,34);

 // boss
 const b=L.boss;
 if(b&&b.hp>0){b.t+=dt;b.flash=Math.max(0,b.flash-dt);
  if(b.x>b.tx+1)b.x+=(b.tx-b.x)*.04*dt; else b.x=b.tx+Math.sin(b.t*.013)*60;

 }

 }
 if(L.banner>0&&L.boss){const a=Math.min(1,L.banner/30,(180-L.banner)/20);g.globalAlpha=Math.max(0,a);
  g.fillStyle='rgba(85,54,107,.55)';g.fillRect(0,170,W,140);
  txt(g,'BOSS',W/2,205,26,'#ffd25c','#55366b','display');txt(g,u.boss,W/2,245,40,'#fff','#ff5f9f','display');
  g.font='700 20px "Baloo 2", system-ui, sans-serif';txt(g,'"'+u.line+'"',W/2,285,20,'#fff',null);g.globalAlpha=1;}
}
function renderTitle(){
 drawBg(g,'meadow',frame*.5,frame,GROUND);
 c_shadow(g,300,GROUND,1.9);drawChibi(g,300,GROUND,1.9,save.look,frame,{wave:true});
 c_shadow(g,470,GROUND,1.9);drawChibi(g,470,GROUND,1.9,CH.princess.look(),frame,{...CH.princess.opts,flip:true});
 const hy=GROUND-120+Math.sin(frame*.04)*14;
 g.strokeStyle='#6b4a2e';g.lineWidth=6;g.lineCap='round';g.beginPath();g.moveTo(640,hy+4);g.lineTo(770,hy-6);g.stroke();
 drawChibi(g,705,hy,1.6,CH.hestia.look(),frame,{...CH.hestia.opts,flip:true});
 txt(g,"Princess Celeste's",W/2,70,38,'#fff','#ff7fbf','display');
 txt(g,'Rescue',W/2,124,58,'#ffd25c','#55366b','display');
 txt(g,'A kawaii running quest across ten universes',W/2,172,22,'#55366b','#ffffff');
}
function render(){g.setTransform(dpr,0,0,dpr,0,0);
 if(mode==='title')renderTitle();else if(mode==='cut'&&cs){cs.chars+=1.3;renderCut();}else if(mode==='play'&&L)renderPlay();}

/* ---------- overlay actions ---------- */
ov.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;ac();
 if(a==='resume'){paused=false;hideOv();}
 else if(a==='retry'){startLevel(L.i);}
 else if(a==='retryBoss'){startLevel(L.i,true);}
 else if(a==='next'){hideOv();enterUniverse(Math.min(9,L.i+1));}
 else if(a==='map'){hideOv();showMap();}
 else if(a==='title'){goTitle();}});
function togglePause(){if(mode!=='play'||!L||L.over)return;paused=!paused;if(paused){hush();showOv(`<h2>Paused</h2><p>Take a cookie break!</p><div class="row"><button class="btn" data-act="resume">Keep going</button><button class="btn alt" data-act="retry">Restart</button><button class="btn alt" data-act="map">World map</button></div>`);}else hideOv();}

/* ---------- input ---------- */
const inp={l:false,r:false,shoot:false};
function onJump(){ac();if(mode==='cut'){advance();return;}if(mode==='play'&&!paused&&L&&!L.over)jump();}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(scr.stage.hidden)return;
 const k=e.key;
 if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();if(!e.repeat)onJump();}
 else if(k==='Enter'&&mode==='cut'){e.preventDefault();advance();}
 else if(k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();inp.l=true;}
 else if(k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();inp.r=true;}
 else if(k==='x'||k==='X'||k==='f'||k==='F'||k==='j'||k==='J'){inp.shoot=true;}
 else if(k==='p'||k==='P'||k==='Escape'){togglePause();}});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')inp.l=false;if(k==='ArrowRight'||k==='d'||k==='D')inp.r=false;if('xXfFjJ'.includes(k))inp.shoot=false;});
cv.addEventListener('pointerdown',()=>{if(mode==='cut'){ac();advance();}});
function hold(id,on,off){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}on();});
 const up=()=>{el.classList.remove('on');off&&off();};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
 el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();on();setTimeout(up,120);}});}
hold('#bL',()=>inp.l=true,()=>inp.l=false);
hold('#bR',()=>inp.r=true,()=>inp.r=false);
hold('#bJ',onJump);
hold('#bS',()=>{ac();inp.shoot=true;},()=>inp.shoot=false);
$('#bP').onclick=togglePause;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&!paused&&L&&!L.over)togglePause();});

/* ---------- loop ---------- */
function loop(now){const dt=Math.min(3,(now-last)/16.667||1);last=now;frame+=dt;
 if(!scr.stage.hidden){if(mode==='play'&&!paused&&L)update(dt);render();}
 if(!scr.create.hidden)drawPreview();
 requestAnimationFrame(loop);}
goTitle();
requestAnimationFrame(t=>{last=t;loop(t);});
})();
</script>
