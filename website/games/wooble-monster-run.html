<!doctype html>
<script src="../app-back.js" defer></script>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wooble Monster Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one arcade cabinet column — toolbar, 16:9 game screen, touch pad or key help. Single deliberate candy-night look. */
:root{
  --night:#24132f; --plum:#3a2050; --ink:#fff4fa; --pink:#ff6fae; --mint:#7fe3c9; --gold:#ffd36e; --muted:#cdb4dc;
  --display:'Mochiy Pop One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'M PLUS Rounded 1c','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);margin:0;padding-inline:16px;box-sizing:border-box;
  display:flex;justify-content:center;overflow:hidden;
  background-image:radial-gradient(circle at 20% 10%,#4a2560 0,transparent 40%),radial-gradient(circle at 85% 90%,#3b1d4f 0,transparent 45%)}
#app{display:flex;flex-direction:column;gap:10px;padding-block:10px;width:100%;max-width:1200px;align-items:center}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;width:100%}
.brand{font-family:var(--display);font-size:18px;color:var(--pink);letter-spacing:.02em;text-shadow:0 2px 0 #12081a}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--body);font-weight:800;font-size:14px;color:var(--ink);background:var(--plum);border:2px solid #5d3a78;border-radius:999px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--pink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button[aria-pressed="false"]{color:var(--muted);background:transparent}
#stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px #5d3a78,0 18px 40px rgba(0,0,0,.45);background:#000;max-width:100%}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
#pad{display:flex;justify-content:space-between;width:100%;gap:16px;user-select:none;-webkit-user-select:none;touch-action:none}
#pad .grp{display:flex;gap:14px}
#pad button{width:72px;height:72px;border-radius:50%;font-size:22px;padding:0;border-width:3px;touch-action:none}
#pad .jump{background:var(--pink);border-color:#ffb3d6;font-size:15px}
#pad .blast{background:#2f8f7d;border-color:var(--mint);font-size:15px}
#pad button.on{transform:scale(.93);filter:brightness(1.2)}
.help{margin:0;font-size:13px;color:var(--muted);text-align:center}
.help b{color:var(--ink)}
@media (prefers-reduced-motion: reduce){#pad button.on{transform:none}}
</style>
</head>
<body>


<div id="app">
  <div class="bar">
    <span class="brand">Wooble Monster Run</span>
    <div class="tools">
      <button id="bVoice" aria-pressed="true">Voices on</button>
      <button id="bMusic" aria-pressed="true">Music on</button>
      <button id="bPause">Pause</button>
    </div>
  </div>
  <div id="stage"><canvas id="game" aria-label="Wooble Monster Run game screen"></canvas></div>
  <div id="pad" hidden>
    <div class="grp"><button data-k="left" aria-label="Run left">◀</button><button data-k="right" aria-label="Run right">▶</button></div>
    <div class="grp"><button data-k="shoot" class="blast">Blast</button><button data-k="jump" class="jump">Jump</button></div>
  </div>
  <p class="help" id="help"><b>← →</b> or <b>A D</b> run · <b>Space</b> jump (twice with Muffin) · <b>J</b> blast · <b>Enter</b> talk · <b>Esc</b> pause or skip scene</p>
</div>

<script>
(()=>{
'use strict';
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const W=960,H=540,GY=460,TAU=Math.PI*2;
const DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
const FD="'Mochiy Pop One','Arial Rounded MT Bold','Trebuchet MS',sans-serif";
const FB="'M PLUS Rounded 1c','Arial Rounded MT Bold','Trebuchet MS',sans-serif";
try{document.fonts.load('20px "Mochiy Pop One"');document.fonts.load('800 20px "M PLUS Rounded 1c"');}catch(e){}

/* ---------- utils ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const mod=(a,n)=>((a%n)+n)%n;
function hash(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function rng(seed){let s=seed>>>0;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function ell(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU);ctx.fill();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,TAU);ctx.fill();}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function heartPath(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.45);ctx.bezierCurveTo(x-s*.1,y+s*.35,x-s*.5,y+s*.1,x-s*.5,y-s*.15);ctx.bezierCurveTo(x-s*.5,y-s*.45,x-s*.08,y-s*.5,x,y-s*.22);ctx.bezierCurveTo(x+s*.08,y-s*.5,x+s*.5,y-s*.45,x+s*.5,y-s*.15);ctx.bezierCurveTo(x+s*.5,y+s*.1,x+s*.1,y+s*.35,x,y+s*.45);ctx.closePath();}
function starPath(x,y,r,n=5,inner=.48,rot=-Math.PI/2){ctx.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,rad=i%2?r*inner:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();}
function otext(s,x,y,size,fill,stroke,font=FD,align='center',lw=6){ctx.font=`${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.lineJoin='round';if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);}ctx.fillStyle=fill;ctx.fillText(s,x,y);}
function wrap(text,maxW){const words=text.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}

/* ---------- input ---------- */
const keys={};let pressed={};
const KEYMAP={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'jump',w:'jump',W:'jump',' ':'jump',j:'shoot',J:'shoot',x:'shoot',X:'shoot',k:'shoot',K:'shoot',Enter:'ok',Escape:'esc',p:'esc',P:'esc'};
addEventListener('keydown',e=>{initAudio();
  if(mode==='custom'&&cz&&cz.row===0&&!(cz.leaving>0)&&czType(e)){e.preventDefault();return;}
  if(!e.repeat){if(e.key==='ArrowUp')pressed.up=true;if(e.key==='ArrowDown')pressed.down=true;if(e.key===' ')pressed.space=true;}
  const k=KEYMAP[e.key];if(!k)return;if(!keys[k])pressed[k]=true;keys[k]=true;e.preventDefault();});
addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k){keys[k]=false;e.preventDefault();}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(mode==='play')mode='pause';});
cv.addEventListener('pointerdown',e=>{
  initAudio();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(mode==='play')return;
  if(!(cz&&cz.leaving>0))for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn();return;}}
  if(mode==='custom'||mode==='title')return;
  pressed.ok=true;
});
const pad=document.getElementById('pad'),help=document.getElementById('help');
let isTouch=matchMedia('(pointer: coarse)').matches;
function showPad(){isTouch=true;pad.hidden=false;help.hidden=true;fit();}
if(isTouch)showPad();
addEventListener('touchstart',()=>{if(!isTouch)showPad();},{passive:true});
pad.querySelectorAll('button').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();initAudio();if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
const stage=document.getElementById('stage');
function fit(){const bar=document.querySelector('.bar').offsetHeight,below=(pad.hidden?help.offsetHeight:pad.offsetHeight);
  const availH=innerHeight-bar-below-46,availW=Math.min(document.getElementById('app').clientWidth,1200);
  const w=Math.max(260,Math.min(availW,availH*16/9));stage.style.width=w+'px';stage.style.height=(w*9/16)+'px';}
addEventListener('resize',fit);fit();

/* ---------- audio ---------- */
let AC=null,master,musicGain,sfxGain,musicOn=true,voiceOn=true;
function initAudio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=.2;musicGain.connect(master);sfxGain=AC.createGain();sfxGain.gain.value=.5;sfxGain.connect(master);}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,dur,type='square',vol=.3,slide=0,dest=sfxGain,when){if(!AC)return;when=when??AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,when);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),when+dur);g.gain.setValueAtTime(vol,when);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g);g.connect(dest);o.start(when);o.stop(when+dur+.02);}
const SFX={
  jump:()=>tone(480,.16,'square',.12,1.9),jump2:()=>{tone(620,.14,'triangle',.18,1.8);tone(930,.12,'sine',.1,1.5);},
  shoot:()=>tone(1100,.1,'triangle',.14,.55),heart:()=>tone(1400,.08,'sine',.16,.7),
  stomp:()=>{tone(260,.14,'square',.18,.45);tone(780,.1,'triangle',.1,1.4);},
  hurt:()=>tone(330,.3,'sawtooth',.14,.4),coin:()=>{tone(1320,.07,'square',.09);setTimeout(()=>tone(1760,.12,'square',.09),60);},
  bossHit:()=>tone(200,.16,'square',.18,.6),thud:()=>tone(120,.3,'sine',.4,.5),blub:()=>tone(300,.15,'sine',.2,2.2),
  boom:()=>tone(160,.35,'sawtooth',.18,.3),chime:()=>[0,4,7].forEach((n,i)=>setTimeout(()=>tone(880*2**(n/12),.18,'triangle',.16),i*70)),
  win:()=>[0,4,7,12,16].forEach((n,i)=>setTimeout(()=>tone(523*2**(n/12),.28,'triangle',.22),i*110)),
  portal:()=>tone(300,.8,'sine',.25,4)
};
function sfx(n){if(AC)try{SFX[n]();}catch(e){}}
const midi=n=>440*2**((n-69)/12);
const SONGS={
  title:{root:72,bpm:112,lead:[0,4,7,12,7,4,9,7,5,9,12,9,7,4,2,null],bass:[0,5,7,5]},
  candy:{root:74,bpm:128,lead:[0,null,4,7,9,7,4,null,2,4,5,7,4,2,0,null],bass:[0,9,5,7]},
  jelly:{root:69,bpm:104,wave:'sine',lead:[0,7,12,7,3,7,10,7,0,5,8,5,7,null,3,null],bass:[0,8,5,7]},
  star:{root:76,bpm:120,lead:[0,7,11,14,12,7,4,7,2,9,12,9,7,4,2,null],bass:[0,4,9,7]},
  mallow:{root:70,bpm:116,lead:[0,4,7,4,9,7,4,2,0,2,4,7,5,4,2,null],bass:[0,5,3,7]},
  ice:{root:79,bpm:110,wave:'sine',lead:[0,7,12,7,4,7,11,7,2,9,14,9,7,4,2,null],bass:[0,5,9,7]},
  desert:{root:69,bpm:124,lead:[0,1,4,5,7,null,5,4,1,null,4,1,0,null,null,null],bass:[0,0,5,7]},
  toy:{root:72,bpm:136,wave:'square',lead:[0,null,7,null,4,7,12,null,11,null,7,null,5,4,2,null],bass:[0,7,5,7]},
  storm:{root:65,bpm:140,wave:'square',lead:[0,3,7,10,12,10,7,3,5,8,12,8,7,null,3,null],bass:[0,8,3,10]},
  lair:{root:64,bpm:132,wave:'square',lead:[0,0,3,null,5,null,6,5,3,0,null,10,null,7,null,null],bass:[0,0,8,7]},
  boss:{root:67,bpm:150,wave:'square',lead:[0,3,7,3,10,7,3,7,0,5,8,5,12,8,5,8],bass:[0,0,5,7]},
  final:{root:62,bpm:156,wave:'square',lead:[0,12,10,7,12,15,12,10,0,12,10,7,6,7,10,null],bass:[0,3,5,6]},
  sad:{root:69,bpm:80,wave:'sine',lead:[0,null,3,null,7,null,5,3,2,null,0,null,-2,null,0,null],bass:[0,-4,-7,-5]},
  victory:{root:72,bpm:104,lead:[0,4,7,12,null,7,12,16,14,12,9,7,5,4,2,0],bass:[0,5,7,0]}
};
let curSong=null,step=0,nextT=0;
function playSong(n){if(curSong===n)return;curSong=n;step=0;if(AC)nextT=AC.currentTime+.05;}
setInterval(()=>{if(!AC||!curSong||!musicOn)return;const s=SONGS[curSong],spb=60/s.bpm/2;if(nextT<AC.currentTime-.3)nextT=AC.currentTime+.05;
  while(nextT<AC.currentTime+.2){const i=step%s.lead.length,n=s.lead[i];if(n!=null)tone(midi(s.root+n),spb*.85,s.wave||'triangle',.22,0,musicGain,nextT);
    if(i%4===0){const b=s.bass[(step/4|0)%s.bass.length];tone(midi(s.root-24+b),spb*3.4,'triangle',.4,0,musicGain,nextT);}step++;nextT+=spb;}},50);

/* ---------- voices ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));}catch(e){voices=[];}}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
const VOICE={Berry:{pitch:1.75,rate:1.1,vi:0},Muffin:{pitch:1.25,rate:.95,vi:1},Kandy:{pitch:2,rate:1.2,vi:2},Celeste:{pitch:1.3,rate:.9,vi:3},
  Chunky:{pitch:.1,rate:.82,vi:4},Narrator:{pitch:1,rate:.95,vi:5},Pip:{pitch:1.6,rate:1.1,vi:6},'Sir Lollipop':{pitch:.6,rate:1,vi:7},
  Jellyzilla:{pitch:.3,rate:.8,vi:8},'Comet Crab':{pitch:.9,rate:1.25,vi:9},'Chunky the Gobstopper':{pitch:.1,rate:.82,vi:4},
  'Grumbly Gummy Bear':{pitch:.4,rate:.9,vi:10},'Brrrnadette the Yeti':{pitch:.8,rate:.95,vi:11},'Swirly the Sandworm':{pitch:.7,rate:.85,vi:12},
  'Wind-Up Wally':{pitch:1.4,rate:1.3,vi:13},'Cocoa Thunderpuff':{pitch:.5,rate:1,vi:14}};
function say(who,text){if(!voiceOn||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=VOICE[who]||VOICE.Narrator;
  u.pitch=v.pitch;u.rate=v.rate;u.volume=1;if(voices.length)u.voice=voices[v.vi%voices.length];speechSynthesis.speak(u);}catch(e){}}
let cap=null;
function caption(who,text,dur){text=HN(text);cap={who,text,t:0,dur:dur||Math.max(2.6,text.length*.065)};say(who,text);}

/* ---------- toolbar ---------- */
const bVoice=document.getElementById('bVoice'),bMusic=document.getElementById('bMusic'),bPause=document.getElementById('bPause');
bVoice.onclick=()=>{voiceOn=!voiceOn;bVoice.textContent='Voices '+(voiceOn?'on':'off');bVoice.setAttribute('aria-pressed',voiceOn);if(!voiceOn)try{speechSynthesis.cancel();}catch(e){}};
bMusic.onclick=()=>{initAudio();musicOn=!musicOn;bMusic.textContent='Music '+(musicOn?'on':'off');bMusic.setAttribute('aria-pressed',musicOn);};
bPause.onclick=()=>{if(mode==='play')mode='pause';else if(mode==='pause')mode='play';};

/* ---------- characters ---------- */
const CHAR={
  Berry:{body:'#ff5f9e',dark:'#d63c7c',belly:'#ffd0e2',hat:'leaf',pattern:'spots',eyes:'round'},
  Muffin:{body:'#e3a96b',dark:'#b8804a',belly:'#fbe3c2',hat:'muffin'},
  Kandy:{body:'#62dcc4',dark:'#36b39b',belly:'#d9fff6',hat:'bow'},
  Celeste:{body:'#b49cff',dark:'#8a6fe8',belly:'#efe8ff',hat:'crown'},
  Pip:{body:'#ffd25e',dark:'#e0ab2c',belly:'#fff2c4',hat:'antenna'},
  Dot:{body:'#7cc6ff',dark:'#4c9be0',belly:'#dff1ff',hat:'antenna'}
};
const DARK='#2b1530';
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=amt<0?0:255,p=Math.abs(amt);
  r=Math.round(r+(f-r)*p);g=Math.round(g+(f-g)*p);b=Math.round(b+(f-b)*p);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}

/* ---------- customize your wooble ---------- */
const PALETTE=[['Strawberry','#ff5f9e'],['Cherry','#ff4d5e'],['Peach','#ff9a6b'],['Lemon','#ffd25e'],['Lime','#9be36a'],['Mint','#62dcc4'],
  ['Sky','#6ec6ff'],['Blueberry','#6b86ff'],['Lavender','#b49cff'],['Grape','#9b5cf6'],['Bubblegum','#ff8fd8'],['Cocoa','#b07a5a']];
const HATS=[['Sprout','leaf'],['Bow','bow'],['Crown','crown'],['Flower','flower'],['Kitty ears','ears'],['Party hat','party'],['Star antenna','star'],['No hat','none']];
const EYES=[['Shiny','round'],['Sparkly','sparkle'],['Sleepy','sleepy'],['Love hearts','heart'],['Wink','wink']];
const PATTERNS=[['Sprinkles','spots'],['Hearts','hearts'],['Stars','stars'],['Stripes','stripes'],['Plain','none']];
const NAMES=['Berry','Mochi','Pudding','Sprinkle','Boba','Taffy','Coco','Jellybean','Peaches','Bubbles','Nugget','Cupcake','Sundae','Waffles','Daisy','Pickle'];
const custom={name:'Berry',color:0,hat:0,eyes:0,pattern:0};
const save={flow:0};
let heroName='Berry';
const SKEY='wooble-monster-run';
function persist(){try{localStorage.setItem(SKEY,JSON.stringify({custom,flow:save.flow}));}catch(e){}}
function applyCustom(){
  custom.color=mod(custom.color|0,PALETTE.length);custom.hat=mod(custom.hat|0,HATS.length);custom.eyes=mod(custom.eyes|0,EYES.length);custom.pattern=mod(custom.pattern|0,PATTERNS.length);
  custom.name=String(custom.name||'').replace(/[^a-zA-Z]/g,'').slice(0,10);
  const body=PALETTE[custom.color][1];
  CHAR.Berry={body,dark:shade(body,-.2),belly:shade(body,.72),hat:HATS[custom.hat][1],pattern:PATTERNS[custom.pattern][1],eyes:EYES[custom.eyes][1]};
  heroName=custom.name||'Berry';
}
try{const d=JSON.parse(localStorage.getItem(SKEY)||'null');if(d){if(d.custom)Object.assign(custom,d.custom);save.flow=d.flow|0;}}catch(e){}
applyCustom();
function HN(s){return heroName==='Berry'?s:s.replace(/\bBerry\b/g,heroName);}
function dispName(who){return who==='Berry'?heroName:who;}

function drawWooble(x,y,r,name,o={}){
  const c=CHAR[name],f=o.face||1,sq=o.squash||0,mood=o.mood||'happy',t=o.t||0,hat=c.hat||'none',pat=c.pattern||'none';
  const rx=r*(1+sq*.2),ry=r*(1-sq*.2),cy=y-ry*.95;
  ctx.save();if(o.alpha!=null)ctx.globalAlpha=o.alpha;
  ctx.fillStyle='rgba(50,15,50,.2)';ell(x,y,r*.85,r*.14);
  const st=o.step||0;ctx.fillStyle=c.dark;
  ell(x-r*.42,y-r*.1-Math.max(0,st)*r*.18,r*.27,r*.16);ell(x+r*.42,y-r*.1-Math.max(0,-st)*r*.18,r*.27,r*.16);
  // things behind the body
  if(hat==='antenna'||hat==='star'){ctx.strokeStyle=c.dark;ctx.lineWidth=r*.08;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,cy-ry*.9);ctx.quadraticCurveTo(x+f*r*.25,cy-ry*1.3,x+f*r*.1,cy-ry*1.45);ctx.stroke();
    if(hat==='star'){ctx.fillStyle='#ffd36e';starPath(x+f*r*.1,cy-ry*1.5,r*.24,5,.48,-Math.PI/2+Math.sin(t*3)*.25);ctx.fill();ctx.strokeStyle='#e8a93c';ctx.lineWidth=Math.max(1,r*.03);ctx.stroke();}

function spawnBoss(g){const d=BOSSES[g.L.boss];const b={kind:g.L.boss,name:d.name,hp:d.hp,maxHp:d.hp,w:d.w,h:d.h,x:g.arenaL+W-d.w-120,y:GY-d.h,vx:0,vy:0,state:'intro',st:1.6,n:0,inv:0,flash:0,face:-1,spin:0,rot:0,squash:0,phase:0,look:-1,onGround:true,dead:false,deadT:0,hidden:false};

/* ---------- game state ---------- */
let mode='title',G=null,cut=null,card=null,T=0,shake=0,flashA=0,endT=0,flowI=0;

function runFlow(){const f=FLOW[flowI];if(!f)return;
  if(f.cut)startCut(f.cut,()=>{flowI++;runFlow();});
  else if(f.level!=null){card={i:f.level,t:0};mode='card';const L=LEVELS[f.level];playSong(L.song);say('Narrator',`Universe ${L.n}. ${L.name}.`);}
  else{mode='end';endT=0;playSong('victory');save.flow=0;persist();}}

  G={i,L,th:THEMES[L.id],...lv,p:{x:120,y:GY-44,w:40,h:44,vx:0,vy:0,face:1,onGround:true,dj:false,inv:0,cd:0,hp:5,maxHp:5,squash:0,jbuf:0,coyote:0},

}
function hurt(n,fell){
  const g=G,p=g.p;if(!fell&&p.inv>0)return;
  p.hp-=n;stats.bonks++;sfx('hurt');p.inv=1.3;shake=.3;
  if(fell||p.hp<=0){const out=p.hp<=0;if(out)p.hp=p.maxHp;const c=g.checkpoint;p.x=c.x;p.y=c.y-p.h-2;p.vx=p.vy=0;g.fade=1;g.bshots=[];g.warns=[];

  else{p.vy=-450;p.vx=-p.face*260;if(Math.random()<.4)caption('Berry',['Ouch!','Oof!','Hey, that tickles!'][Math.random()*3|0],1.2);}
}

/* ---------- play update ---------- */
function updatePlay(dt){
  const g=G,p=g.p;g.t+=dt;stats.time+=dt;if(g.fade>0)g.fade-=dt*2;
  const dir=(keys.right?1:0)-(keys.left?1:0);
  const icy=g.L.ice&&p.onGround;
  if(dir){p.vx+=dir*(icy?1400:2600)*dt;p.face=dir;}else{const s=Math.sign(p.vx);p.vx-=s*(icy?520:2300)*dt;if(Math.sign(p.vx)!==s)p.vx=0;}
  p.vx=clamp(p.vx,-330,330);
  if(pressed.jump)p.jbuf=.13;else p.jbuf-=dt;
  p.coyote=p.onGround?.1:p.coyote-dt;
  if(p.jbuf>0){
    if(p.coyote>0){p.vy=-860;p.coyote=0;p.jbuf=0;p.onGround=false;sfx('jump');p.squash=-.5;}
    else if(party.muffin&&!p.dj){p.vy=-780;p.dj=true;p.jbuf=0;sfx('jump2');p.squash=-.5;for(let i=0;i<8;i++)g.parts.push({x:p.x+p.w/2,y:p.y+p.h,vx:(Math.random()-.5)*180,vy:Math.random()*80,life:.5,max:.5,col:i%2?'#fff4e6':'#ffd36e',r:5+Math.random()*4,kind:'dot',g:0});}
  }
  const grav=2300*g.L.grav;
  if(p.vy<0&&!keys.jump)p.vy+=grav*1.3*dt;
  p.vy=Math.min(p.vy+grav*dt,1000);
  p.cd-=dt;
  if(keys.shoot&&p.cd<=0){p.cd=party.kandy?.17:.32;g.shots.push({x:p.x+p.w/2+p.face*22,y:p.y+20,vx:p.face*700+p.vx*.3,life:.8,heart:party.kandy,r:party.kandy?11:9});sfx(party.kandy?'heart':'shoot');}
  // move & collide
  p.x+=p.vx*dt;
  for(const s of g.solids)if(overlap(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;p.vx=0;}
  if(p.x<0){p.x=0;p.vx=0;}
  if(g.bossActive){p.x=clamp(p.x,g.arenaL+4,g.arenaL+W-4-p.w);}
  const prevB=p.y+p.h,was=p.onGround;p.y+=p.vy*dt;p.onGround=false;
  for(const s of g.solids)if(overlap(p,s)){if(p.vy>0){p.y=s.y-p.h;p.vy=0;p.onGround=true;}else if(p.vy<0){p.y=s.y+s.h;p.vy=0;}}
  if(p.vy>=0)for(const s of g.ones)if(p.x+p.w>s.x&&p.x<s.x+s.w&&prevB<=s.y+2&&p.y+p.h>=s.y){p.y=s.y-p.h;p.vy=0;p.onGround=true;}
  if(p.onGround){p.dj=false;if(!was)p.squash=.45;}
  p.squash=lerp(p.squash,0,Math.min(1,dt*10));
  if(p.inv>0)p.inv-=dt;
  if(p.y>H+150)hurt(1,true);
  // friends
  g.trail.unshift({x:p.x+p.w/2,y:p.y+p.h});if(g.trail.length>40)g.trail.pop();
  const fr=[party.muffin&&'Muffin',party.kandy&&'Kandy'].filter(Boolean);
  fr.forEach((n,k)=>{const f=g.friends[k],tr=g.trail[Math.min(g.trail.length-1,(k+1)*8)];const tx=p.x+p.w/2-p.face*(48+k*40);f.x=lerp(f.x,tx,Math.min(1,dt*5));f.y=tr?tr.y:p.y+p.h;f.face=Math.abs(tx-f.x)>4?Math.sign(p.x+p.w/2-f.x)||1:p.face;});
  // items
  for(const it of g.items)if(!it.taken&&Math.abs(it.x-(p.x+p.w/2))<30&&Math.abs(it.y-(p.y+p.h/2))<34){it.taken=true;g.berries++;stats.berries++;sfx('coin');burst(it.x,it.y,6,['#ff3d6e','#ffd36e','#fff'],160);
    if(g.berries%20===0&&p.hp<p.maxHp){p.hp++;caption(fr.length?fr[0]:'Berry',"Yummy! A berry heart!",1.8);}}
  // checkpoints
  for(const c of g.checks)if(!c.hit&&p.x+p.w>c.x){c.hit=true;g.checkpoint={x:c.x,y:c.y};sfx('chime');burst(c.x+20,c.y-80,10,['#ff6fae','#ffd36e','#7fe3c9'],200,'star');
    const lines=fr.length?[[fr[0],'Checkpoint! Snack break!'],[fr[fr.length-1],'Sweet! Keep going, Berry!'],['Berry','Checkpoint! We got this!']]:[['Berry','Checkpoint! Yay!'],['Berry','Wooble power!']];
    const l=lines[g.cpN++%lines.length];caption(l[0],l[1],1.8);}
  // enemies
  for(const e of g.enemies){
    if(!e.alive){e.dt=(e.dt||0)+dt;continue;}
    if(Math.abs(e.x-p.x)>W*1.2)continue;

    if(e.type==='walk'){e.x+=e.vx*dt;if(e.x<e.minX){e.x=e.minX;e.vx*=-1;}if(e.x+e.w>e.maxX){e.x=e.maxX-e.w;e.vx*=-1;}}
    else{e.y=e.y0+Math.sin(e.t*2.2)*40;e.x=e.x0+Math.sin(e.t*.8)*80;}
    if(overlap(p,e)){if(p.vy>0&&p.y+p.h-e.y<24){e.alive=false;p.vy=keys.jump?-720:-560;p.dj=false;sfx('stomp');burst(e.x+e.w/2,e.y+e.h/2,10,[g.th.walker,'#fff','#ffd36e'],240,'star');}else hurt(1);}
  }
  // shots
  for(const s of g.shots){s.x+=s.vx*dt;s.life-=dt;
    for(const e of g.enemies)if(e.alive&&Math.abs(s.x-(e.x+e.w/2))<e.w/2+s.r&&Math.abs(s.y-(e.y+e.h/2))<e.h/2+s.r){e.alive=false;s.life=0;sfx('stomp');burst(e.x+e.w/2,e.y+e.h/2,10,[g.th.walker,'#fff'],220,'star');break;}
    const b=g.boss;if(s.life>0&&b&&!b.dead&&!b.hidden&&s.x>b.x-s.r&&s.x<b.x+b.w+s.r&&s.y>b.y-s.r&&s.y<b.y+b.h+s.r){damageBoss(1);s.life=0;}

    if(s.life>0)for(const so of g.solids)if(s.x>so.x&&s.x<so.x+so.w&&s.y>so.y){s.life=0;break;}
    if(Math.random()<.5)g.parts.push({x:s.x,y:s.y,vx:0,vy:0,life:.25,max:.25,col:s.heart?'#ff8fbf':'#fff3a8',r:3,kind:'dot',g:0});}

    const go=()=>{mode='play';playSong(BOSSES[g.L.boss].song);caption(g.L.boss==='chunky'?'Chunky':g.boss.name,BOSSES[g.L.boss].intro);};
    if(g.L.preCut)startCut(g.L.preCut,go);else go();

  }

  const b=g.boss;

    if(b.dead){b.deadT+=dt;if(Math.random()<dt*12)burst(b.x+Math.random()*b.w,b.y+Math.random()*b.h,3,['#fff','#ffd36e','#ff6fae'],200,'star');
      if(b.kind==='chunky'){b.vx=0;bPhys(b,dt,g,2400);if(b.deadT>3.2&&!g.bossDone){g.bossDone=true;flowI++;runFlow();return;}}

      if(!b.hidden){const m=b.kind==='chunky'?14:b.kind==='worm'?12:6,hb={x:b.x+m,y:b.y+m,w:b.w-m*2,h:b.h-m};

  // boss shots
  for(const q of g.bshots){q.x+=q.vx*dt;q.vy+=q.g*dt;q.y+=q.vy*dt;q.life-=dt;q.rot=(q.rot||0)+dt*6;
    if(q.kind!=='wave'&&q.kind!=='zap'&&q.y+q.r>GY){q.life=0;burst(q.x,GY-6,5,q.kind==='fire'?['#ff9f1c','#ff4b3e']:q.kind==='caramel'||q.kind==='drop'?['#c8783a','#f6c98a']:['#fff','#ffd36e'],150);}
    if(q.x<g.arenaL-60||q.x>g.arenaL+W+60)q.life=0;
    if(q.kind==='zap'){if(q.life>0&&Math.abs(p.x+p.w/2-q.x)<24)hurt(1);continue;}

  const target=g.bossActive?g.arenaL:clamp(p.x-W*.38,0,g.arenaL);

function drawBoss(b,t){

function renderCustom(){
  skyGrad('#ffd3ea','#c9b6ff');
  for(let i=0;i<26;i++){const h=hash(i*4.7);ctx.fillStyle=`rgba(255,255,255,${(.2+h*.3).toFixed(2)})`;circ(h*W,mod(hash(i*9.1)*H-T*18*(.3+h),H),3+h*6);}
  ctx.fillStyle='rgba(255,255,255,.5)';rr(24,24,388,492,34);ctx.fill();
  otext('Make your Wooble!',218,74,24,'#fff','#b8306f',FD,'center',7);
  ctx.fillStyle='rgba(255,111,174,.2)';ell(218,410,120,22);
  const lv=cz.leaving>0,hop=lv?Math.abs(Math.sin(T*9))*44:Math.abs(Math.sin(T*2.6))*10;
  drawWooble(218,410-hop,82,'Berry',{t:T,mood:(cz.joy>0||lv)?'joy':'happy',squash:hop<3?.25:-.08});
  otext(custom.name||'…',218,474,30,'#ff5f9e','#fff',FD,'center',8);
  const X=440,RW=496,rowY=[34,104,222,288,354],rowH=[56,104,52,52,52];
  for(let r=0;r<5;r++)if(cz.row===r){ctx.fillStyle='rgba(255,255,255,.6)';rr(X-8,rowY[r]-6,RW,rowH[r]+12,18);ctx.fill();ctx.strokeStyle='#ff6fae';ctx.lineWidth=3;ctx.stroke();}
  const lab=(s,r,dy)=>otext(s,X+6,rowY[r]+(dy??rowH[r]/2+7),18,'#5a2a5a',null,FB,'left');
  // name
  lab('Name',0);
  ctx.fillStyle='#fff';rr(X+86,rowY[0]+4,262,48,16);ctx.fill();ctx.strokeStyle=cz.row===0?'#ff6fae':'#e7c3e0';ctx.lineWidth=2;ctx.stroke();
  ctx.font=`800 22px ${FB}`;ctx.textAlign='left';ctx.fillStyle=DARK;ctx.fillText(custom.name,X+102,rowY[0]+36);
  if(cz.row===0&&!isTouch&&(T*2|0)%2){const w=ctx.measureText(custom.name).width;ctx.fillRect(X+104+w,rowY[0]+14,3,28);}
  addHit(X+86,rowY[0]+4,262,48,()=>{cz.row=0;cz.fresh=true;});
  const dx=X+360,dy=rowY[0]+4;ctx.fillStyle='#ff6fae';rr(dx,dy,110,48,16);ctx.fill();ctx.fillStyle='#fff';rr(dx+10,dy+10,28,28,6);ctx.fill();ctx.fillStyle='#ff6fae';[[0,0],[-7,-7],[7,7]].forEach(([a,b])=>circ(dx+24+a,dy+24+b,3));
  otext('Pick',dx+76,dy+31,17,'#fff',null,FB);addHit(dx,dy,110,48,czDice);
  // colors
  lab('Color',1,26);otext(PALETTE[custom.color][0],X+6,rowY[1]+52,14,'#8a5a8a',null,FB,'left');
  for(let i=0;i<PALETTE.length;i++){const cx0=X+122+(i%6)*62,cy0=rowY[1]+(i<6?26:78);ctx.fillStyle=PALETTE[i][1];circ(cx0,cy0,22);ctx.fillStyle='rgba(255,255,255,.45)';circ(cx0-7,cy0-7,6);
    if(i===custom.color){ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(cx0,cy0,26,0,TAU);ctx.stroke();ctx.strokeStyle=DARK;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx0,cy0,30,0,TAU);ctx.stroke();}
    addHit(cx0-28,cy0-26,56,52,()=>{cz.row=1;custom.color=i;applyCustom();cz.joy=.7;sfx('heart');});}
  // pickers
  const arrow=(x,y,d,r)=>{ctx.fillStyle='#ff6fae';rr(x,y,46,44,22);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x+23+d*9,y+22);ctx.lineTo(x+23-d*7,y+12);ctx.lineTo(x+23-d*7,y+32);ctx.closePath();ctx.fill();addHit(x,y,46,44,()=>czChange(r,d));};
  const picker=(r,label,list,idx)=>{lab(label,r);const y=rowY[r];arrow(X+120,y+4,-1,r);otext(list[idx][0],X+300,y+34,21,DARK,null,FB);otext(`${idx+1}/${list.length}`,X+300,y+50,11,'#8a5a8a',null,FB);arrow(X+434,y+4,1,r);addHit(X+170,y,260,52,()=>czChange(r,1));};
  picker(2,'Hat',HATS,custom.hat);picker(3,'Eyes',EYES,custom.eyes);picker(4,'Pattern',PATTERNS,custom.pattern);
  // done
  const bw=290,bh=58,bx=X+RW/2-8-bw/2,byy=426,sel=cz.row===5,pulse=sel?1+Math.sin(T*5)*.03:1;
  ctx.save();ctx.translate(bx+bw/2,byy+bh/2);ctx.scale(pulse,pulse);ctx.fillStyle='#b8306f';rr(-bw/2,-bh/2+5,bw,bh,29);ctx.fill();ctx.fillStyle='#ff6fae';rr(-bw/2,-bh/2,bw,bh,29);ctx.fill();
  if(sel){ctx.strokeStyle='#ffd36e';ctx.lineWidth=4;rr(-bw/2-5,-bh/2-5,bw+10,bh+10,34);ctx.stroke();}otext("Let's go!",0,9,24,'#fff','#b8306f',FD,'center',5);ctx.restore();
  addHit(bx,byy,bw,bh,czDone);
  otext(isTouch?'Tap the arrows and colors to change your Wooble':'↑ ↓ pick a row · ← → change · type a name · Enter when ready',X+RW/2-8,512,13,'#5a2a5a',null,FB);
}
function renderCard(){
  const L=LEVELS[card.i],th=THEMES[L.id],t=card.t;drawBG(L.id,t*90,T);groundStrip(GY,th.top,th.body);
  const fr=['Berry',card.i>=1&&'Muffin',card.i>=2&&'Kandy'].filter(Boolean);
  fr.forEach((n,k)=>{const x=-80+t*300-k*55;drawWooble(x,GY+Math.abs(Math.sin(t*14+k))*-6,k?18:26,n,{t,step:Math.sin(t*16+k)});});
  ctx.fillStyle='rgba(43,21,48,.55)';rr(W/2-320,110,640,220,30);ctx.fill();
  otext(`Universe ${L.n} of ${LEVELS.length}`,W/2,166,24,'#ffd36e',null,FD);
  otext(L.name,W/2,228,L.name.length>22?34:42,'#fff','#ff5f9e',FD,'center',8);
  otext(`Boss: ${BOSSES[L.boss].name}`,W/2,276,18,'#fff',null,FB);
  for(let i=0;i<LEVELS.length;i++){const dx=W/2+(i-(LEVELS.length-1)/2)*30;ctx.fillStyle=i<card.i?'#7fe3c9':i===card.i?'#ffd36e':'rgba(255,255,255,.3)';if(i===card.i){starPath(dx,306,11);ctx.fill();}else circ(dx,306,7);}
}
function fmt(s){s=Math.floor(s);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function renderEnd(){
  drawBG('kingdomNew',0,T,410);groundStrip(410,'#c8f5d4','#8fd9a8');
  [['Pip',90],['Kandy',200,26],['Muffin',280,28],['Berry',380,36],['Celeste',490,40]].forEach(([n,x,r],i)=>drawWooble(x,410-Math.abs(Math.sin(T*5+i))*14,r||28,n,{t:T,mood:'joy',face:1}));
  drawChunky(700,410-62,56,{t:T,mood:'happy',look:-1,cracks:.3});drawWooble(880,410,28,'Dot',{t:T,mood:'joy',face:-1});
  for(let i=0;i<40;i++){const h=hash(i*2.3);ctx.fillStyle=['#ff6fae','#ffd36e','#7fe3c9','#b49cff'][i%4];ctx.save();ctx.translate(h*W,mod(T*80*(.5+h)+h*600,H));ctx.rotate(T*3+i);ctx.fillRect(-4,-2,8,4);ctx.restore();}
  otext('The End',W/2,110,72,'#ff5f9e','#fff',FD,'center',14);
  otext(`Wooberries ${stats.berries}  ·  Bonks ${stats.bonks}  ·  Time ${fmt(stats.time)}`,W/2,160,20,'#2b1530','#fff',FB,'center',6);
  if(endT>1.5)otext(isTouch?'Tap to play again':'Press Enter to play again',W/2,200,18,'#fff','#5a2a5a',FB,'center',5);
}

/* ---------- main loop ---------- */
function update(dt){
  T+=dt;if(shake>0)shake=Math.max(0,shake-dt);if(flashA>0)flashA-=dt*1.4;
  if(mode==='title'){const it=titleItems();tsel=clamp(tsel,0,it.length-1);if(pressed.up)tsel=mod(tsel-1,it.length);if(pressed.down)tsel=mod(tsel+1,it.length);if(pressed.ok||pressed.space)it[tsel].fn();}
  else if(mode==='custom')updateCustom(dt);
  else if(mode==='cut')updateCut(dt);
  else if(mode==='card'){card.t+=dt;if(card.t>3.4||(card.t>.6&&(pressed.ok||pressed.jump)))startLevel(card.i);}
  else if(mode==='play'){if(pressed.esc){mode='pause';}else updatePlay(dt);}
  else if(mode==='pause'){if(pressed.esc||pressed.ok)mode='play';}
  else if(mode==='end'){endT+=dt;if(endT>1.5&&(pressed.ok||pressed.jump)){mode='title';playSong('title');}}
  if(cap){cap.t+=dt;if(cap.t>cap.dur)cap=null;}
}
function render(){
  ctx.clearRect(0,0,W,H);hits=[];
  if(mode==='title')renderTitle();
  else if(mode==='custom')renderCustom();
  else if(mode==='cut')renderCut();
  else if(mode==='card')renderCard();
  else if(mode==='play'||mode==='pause'){renderPlay();if(mode==='pause'){ctx.fillStyle='rgba(36,19,47,.6)';ctx.fillRect(0,0,W,H);otext('Paused',W/2,H/2,56,'#fff','#ff5f9e',FD,'center',10);otext(isTouch?'Tap to keep playing':'Press Esc or Enter to keep playing',W/2,H/2+44,18,'#fff',null,FB);}}
  else if(mode==='end')renderEnd();
  if(flashA>0){ctx.fillStyle=`rgba(255,255,255,${Math.min(1,flashA)})`;ctx.fillRect(0,0,W,H);}
  bPause.textContent=mode==='pause'?'Resume':'Pause';
}
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;try{update(dt);render();}catch(e){console.error(e);}pressed={};requestAnimationFrame(frame);}
playSong('title');
requestAnimationFrame(frame);
})();
</script>
